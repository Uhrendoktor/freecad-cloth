name: Temporary PR 2711 rebase
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebase-pr2711.yml"

permissions:
  actions: write
  contents: write

jobs:
  rebase-pr-2711:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for temporary workflow cleanup, rebase PR 2711, and validate exact head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: 05e6e9e5b4909318aba58e1c754488642928f8b5
          PR_BRANCH: fix/anny-backed-avatar-shaping
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW_PATH=".github/workflows/rebase-pr2711.yml"
          # The deletion push must not start a second copy of this job.
          if git cat-file -e "${GITHUB_SHA}^:${WORKFLOW_PATH}" 2>/dev/null; then
            echo "Workflow existed in previous commit; this is not the one-shot addition event."
            exit 0
          fi
          git cat-file -e "${GITHUB_SHA}:${WORKFLOW_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${PR_BRANCH})" = "${EXPECTED_HEAD}"

          # Main is protected, so cleanup is made through a separate pull request.
          # Wait for that PR to remove this temporary workflow before taking the
          # final main SHA as the rebase target.
          for attempt in $(seq 1 90); do
            if ! gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=main" >/dev/null 2>&1; then
              break
            fi
            sleep 20
          done
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=main" >/dev/null 2>&1; then
            echo "::error::Temporary rebase workflow was not removed from main before timeout."
            exit 1
          fi

          git fetch origin main
          git checkout -B "${PR_BRANCH}" "refs/remotes/origin/${PR_BRANCH}"
          if ! git -c rerere.enabled=true rebase origin/main; then
            echo "::error::PR 2711 rebase has conflicts."
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git merge-base --is-ancestor origin/main HEAD
          REBASED_HEAD="$(git rev-parse HEAD)"
          echo "rebased_head=${REBASED_HEAD}" >> "${GITHUB_OUTPUT}"
          git log -5 --oneline --decorate
          git push --force-with-lease="refs/heads/${PR_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${PR_BRANCH}"

          # Explicit dispatch is needed because this job pushes with GITHUB_TOKEN.
          gh workflow run canonical-execution.yml --repo "${GITHUB_REPOSITORY}" --ref "${PR_BRANCH}" -f runner_mode=hosted
          for attempt in $(seq 1 30); do
            RUN_JSON="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "Canonical execution" --branch "${PR_BRANCH}" --event workflow_dispatch --limit 20 --json databaseId,headSha,status,url --jq '.[] | select(.headSha == "'"${REBASED_HEAD}"'")' || true)"
            if [ -n "${RUN_JSON}" ]; then
              echo "${RUN_JSON}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Dispatched canonical validation but could not find its run for ${REBASED_HEAD}"
          exit 1
