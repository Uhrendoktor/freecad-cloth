name: Supervisor adjust blanket fixture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Adjust validated blanket fixture on release branch
        run: |
          set -euo pipefail
          target='agent/issue-1017-release-foundation-20260923'
          git fetch origin "refs/heads/$target:refs/remotes/origin/$target"
          git switch --detach refs/remotes/origin/$target
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/freecad_simulation_turntable.py')
          text = path.read_text(encoding='utf-8')
          for old, new in [
              ('App.Vector(0.0, 0.0, 250.0)', 'App.Vector(0.0, 0.0, 220.0)'),
              ('App.Vector(-210.0, -120.0, 250.0)', 'App.Vector(-210.0, -120.0, 220.0)'),
              ('App.Vector(210.0, -120.0, 250.0)', 'App.Vector(210.0, -120.0, 220.0)'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing expected fixture value: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/freecad_simulation_turntable.py
          git commit -m 'test: position blanket closer to validated cube approach band'
          git push origin HEAD:refs/heads/$target
      - name: Remove one-off executor from main
        if: always()
        run: |
          set +e
          git switch main
          git rm .github/workflows/supervisor-adjust-blanket.yml
          git commit -m 'chore: remove temporary blanket fixture executor'
          git push origin HEAD:refs/heads/main
