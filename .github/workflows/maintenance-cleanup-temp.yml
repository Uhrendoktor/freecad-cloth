name: Temporary repository maintenance cleanup

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Clean old Actions runs and remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          repo = __import__('os').environ['REPO']
          def run(cmd):
              p=subprocess.run(cmd,text=True,capture_output=True)
              return p.returncode,p.stdout.strip(),p.stderr.strip()
          raw_code, raw_out, raw_err = run(['gh','api','--paginate',f'repos/{repo}/actions/runs?per_page=100','--jq','.workflow_runs[] | @json'])
          if raw_code:
              raise SystemExit(raw_err or raw_out or 'failed to list Actions runs')
          runs=[json.loads(x) for x in raw_out.splitlines() if x.strip()]
          active=[r for r in runs if r.get('status') in {'queued','in_progress','waiting','requested','pending'}]
          completed=sorted([r for r in runs if r.get('status')=='completed'], key=lambda r:r.get('created_at',''), reverse=True)
          keep={r['id'] for r in completed[:10]}
          targets=[r['id'] for r in completed[10:]]
          def delete_one(run_id):
              code,out,err=run(['gh','api','--method','DELETE',f'repos/{repo}/actions/runs/{run_id}'])
              if code and '404' not in (err or out):
                  return run_id, False, err or out
              return run_id, True, ''
          deleted=[]
          with ThreadPoolExecutor(max_workers=20) as pool:
              futures=[pool.submit(delete_one,rid) for rid in targets]
              for f in as_completed(futures):
                  rid,ok,msg=f.result()
                  if not ok:
                      raise SystemExit(f'failed deleting Actions run {rid}: {msg}')
                  deleted.append(rid)
          code,out,err=run(['gh','api',f'repos/{repo}/git/ref/heads/main'])
          if code:
              raise SystemExit(err or out or 'main branch verification failed')
          print(json.dumps({
              'actions_before': len(runs),
              'active_runs_preserved': len(active),
              'completed_runs_kept': len(keep),
              'completed_runs_delete_attempts': len(targets),
              'verification': 'main exists'
          },indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/maintenance-cleanup-temp.yml
          git commit -m 'chore: remove temporary maintenance cleanup workflow [skip ci]'
          git push
