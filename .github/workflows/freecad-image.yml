name: Build FreeCAD CI image

on:
  push:
    branches: [main]
    paths:
      - 'docker/freecad-ci/Dockerfile'
      - '.github/workflows/freecad-image.yml'
  workflow_dispatch:

concurrency:
  group: freecad-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/freecad-ci
          push: true
          tags: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
          cache-from: type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache
          cache-to: type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max
