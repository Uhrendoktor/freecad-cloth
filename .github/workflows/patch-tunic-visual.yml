name: Apply tunic visual validation fix
on:
  push:
    branches: [fix/pr537-tunic-visual-validation]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch canonical tunic fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/freecad_screenshot_source.py')
          s = p.read_text()
          replacements = {
              'clearance = max(20.0, 0.08 * body_depth);': 'clearance = max(6.0, 0.02 * body_depth);',
              'for edge_a, edge_b, seam_id in ((2,2,"TunicRightShoulder"),(5,5,"TunicLeftShoulder")):\n        add_seam(doc, Seam(str(front.PieceId), edge_a, str(back.PieceId), edge_b, id=seam_id, alignment="uniform", stitch_group="TunicAssembly"))': 'for edge_a, edge_b, seam_id in ((2,6,"TunicRightShoulder"),(6,2,"TunicLeftShoulder")):\n        add_seam(doc, Seam(str(front.PieceId), edge_a, str(back.PieceId), edge_b, id=seam_id, alignment="uniform", stitch_group="TunicAssembly"))',
              'scene.ParticleDistance = 24.0;': 'scene.ParticleDistance = 22.0;',
              'scene.SolverIterations = 8;': 'scene.SolverIterations = 6;',
              'scene.TimeStep = 1.0 / 120.0;': 'scene.TimeStep = 1.0 / 90.0;',
              'for batch in (15,15,15,15,15,15):': 'for batch in (10,10,10):',
              'if int(scene.Steps) != 90 or': 'if int(scene.Steps) != 30 or',
              '"simulation did not reach a finite 90-step state"': '"simulation did not reach a finite 30-step state"',
              'after 90 real steps;': 'after 30 real steps;',
              'upper_margin = 0.12 * max(1.0, float(shoulder_z) - float(hem_z))': 'upper_margin = 0.17 * max(1.0, float(shoulder_z) - float(hem_z))',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing source anchor: {old[:90]}')
              s = s.replace(old, new, 1)

          old_pin = '''    def authored_shoulder_pins(piece, positions):
        targets = (
            (0.14 * panel_width, 0.97 * garment_height),
            (0.86 * panel_width, 0.97 * garment_height),
        )
        available = list(range(len(positions)))
        result = []
        for local_x, local_y in targets:
            target_point = piece.Placement.multVec(App.Vector(float(local_x), float(local_y), 0.0))
            index = min(available, key=lambda i: (positions[i][0] - target_point.x) ** 2 + (positions[i][1] - target_point.y) ** 2 + (positions[i][2] - target_point.z) ** 2)
            result.append(index)
            available.remove(index)
        return tuple(result)
    front_positions, _front_triangles, _front_boundary = quality_piece_mesh(front, 0.0, scene.ParticleDistance)
    back_positions, _back_triangles, _back_boundary = quality_piece_mesh(back, 0.0, scene.ParticleDistance)
    front_pins = authored_shoulder_pins(front, front_positions)
    back_pins_local = authored_shoulder_pins(back, back_positions)'''
          new_pin = '''    def authored_shoulder_pins(piece, positions, boundary):
        targets = (
            (0.08 * panel_width, 0.97 * garment_height),
            (0.92 * panel_width, 0.97 * garment_height),
            (0.20 * panel_width, 0.90 * garment_height),
            (0.80 * panel_width, 0.90 * garment_height),
        )
        available = [int(i) for i in boundary]
        result = []
        for local_x, local_y in targets:
            target_point = piece.Placement.multVec(App.Vector(float(local_x), float(local_y), 0.0))
            index = min(available, key=lambda i: (positions[i][0] - target_point.x) ** 2 + (positions[i][1] - target_point.y) ** 2 + (positions[i][2] - target_point.z) ** 2)
            result.append(index)
            available.remove(index)
        return tuple(result)
    front_positions, _front_triangles, front_boundary = quality_piece_mesh(front, 0.0, scene.ParticleDistance)
    back_positions, _back_triangles, back_boundary = quality_piece_mesh(back, 0.0, scene.ParticleDistance)
    front_pins = authored_shoulder_pins(front, front_positions, front_boundary)
    back_pins_local = authored_shoulder_pins(back, back_positions, back_boundary)'''
          if old_pin not in s:
              raise SystemExit('missing authored pin block anchor')
          p.write_text(s.replace(old_pin, new_pin, 1))

          p = Path('tests/freecad_screenshot.py')
          s = p.read_text()
          substitutions = {
              "'scene.SolverIterations = 8;', 'scene.SolverIterations = 16;'": "'scene.SolverIterations = 6;', 'scene.SolverIterations = 6;'",
              "'scene.SolverSubsteps = 1;', 'scene.SolverSubsteps = 4;'": "'scene.SolverSubsteps = 1;', 'scene.SolverSubsteps = 1;'",
              "'scene.TimeStep = 1.0 / 120.0;', 'scene.TimeStep = 1.0 / 480.0;'": "'scene.TimeStep = 1.0 / 90.0;', 'scene.TimeStep = 1.0 / 90.0;'",
              "'scene.FabricFriction = 0.75;', 'scene.FabricFriction = 1.0;'": "'scene.FabricFriction = 0.75;', 'scene.FabricFriction = 0.75;'",
              "'for batch in (15,15,15,15,15,15):', 'for batch in (10,5):'": "'for batch in (10,10,10):', 'for batch in (10,10,10):'",
              "'if int(scene.Steps) != 90 or', 'if int(scene.Steps) != 15 or'": "'if int(scene.Steps) != 30 or', 'if int(scene.Steps) != 30 or'",
              "'\"simulation did not reach a finite 90-step state\"', '\"simulation did not reach a finite 15-step state\"'": "'\"simulation did not reach a finite 30-step state\"', '\"simulation did not reach a finite 30-step state\"'",
              "'after 90 real steps;', 'after 15 real steps;'": "'after 30 real steps;', 'after 30 real steps;'",
          }
          for old, new in substitutions.items():
              if old not in s:
                  raise SystemExit(f'missing wrapper anchor: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove patch workflow and commit fix
        run: |
          set -euo pipefail
          rm .github/workflows/patch-tunic-visual.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/freecad_screenshot_source.py tests/freecad_screenshot.py .github/workflows/patch-tunic-visual.yml
          git commit -m 'fix: align tunic visual fixture with validated turntable'
          git push
