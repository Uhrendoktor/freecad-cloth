name: Repair screenshot publisher

on:
  push:
    branches: [agent/gui-screenshot-pr-comments-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/gui-screenshot-pr-comments-20260831
          fetch-depth: 0
      - name: Repair authenticated git clone/push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/canonical-execution.yml')
          s = p.read_text()
          s = s.replace('git clone --filter=blob:none --no-checkout "$GITHUB_SERVER_URL/$REPO.git" screenshot-repo', 'git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" screenshot-repo')
          s = s.replace('git push --force origin "HEAD:$branch"', 'git push --force "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" "HEAD:$branch"')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-execution.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: authenticate screenshot publisher'
          git push origin HEAD:agent/gui-screenshot-pr-comments-20260831