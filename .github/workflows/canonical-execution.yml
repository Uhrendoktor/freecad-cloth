          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_SUBSTEPS="$CLOTH_PBD_SUBSTEPS" -e CLOTH_PBD_COLLISION_MODE="$CLOTH_PBD_COLLISION_MODE" \
            -e CLOTH_PBD_COLLISION_TRIANGLES="$CLOTH_PBD_COLLISION_TRIANGLES" -e CLOTH_PBD_COLLISION_VOXEL_MM="$CLOTH_PBD_COLLISION_VOXEL_MM" \
            -e CLOTH_PBD_COLLISION_TOLERANCE_MM="$CLOTH_PBD_COLLISION_TOLERANCE_MM" \
            -e CLOTH_BLANKET_STEPS="$CLOTH_BLANKET_STEPS" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /tmp "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              CLOTH_CI_DISABLE_PBD=1 timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_avatar_screenshot.py
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_simulation_turntable.py
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Validate turntable frame counts on restored workspace
        run: |
          set -euo pipefail
          test "$(find docs/images/generated/cloth-avatar-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-simulation-arranged-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-simulation-draped-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73

      - name: Validate blanket motion and camera evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          log = Path("docs/images/generated/simulation-turntable-progress.log").read_text(encoding="utf-8")
          for marker in (
              "stage=scene-build-pass",
              "stage=arranged-render-pass",
              "stage=simulation-pass",
              "stage=validation-pass",
              "stage=draped-render-pass",
              "stage=total-pass",
          ):
            if marker not in log: raise SystemExit("missing timing marker: "+marker)
          if "stage=validation-pass state=structurally-plausible" not in log:
            raise SystemExit("drape gate did not remain structurally-plausible")
          m = re.findall(r"blanket-motion-diagnostic max_centroid_displacement_mm=([+-]?[0-9.]+).*min_z_mm=([+-]?[0-9.]+).*cube_top_z_mm=([+-]?[0-9.]+)", log)
          if not m: raise SystemExit("missing blanket motion diagnostic")
          displacement, minimum_z, cube_top = (float(x) for x in m[-1])
          if displacement < 40.0: raise SystemExit("blanket displacement below 40 mm")
          if minimum_z > cube_top + 35.0: raise SystemExit("blanket did not approach cube")
          if "blanket-turntable-pass" not in log: raise SystemExit("blanket turntable incomplete")
          if "mesh-quality=passed" not in log: raise SystemExit("blanket mesh-quality evidence missing")
          penetration = re.findall(r"collision-penetration=passed max_penetration_mm=([+-]?[0-9.]+)", log)
          if not penetration: raise SystemExit("missing blanket collision penetration diagnostic")
          if float(penetration[-1]) > 3.0: raise SystemExit("blanket collision penetration exceeds 3 mm")
          for directory in ("cloth-avatar-turntable-frames","cloth-simulation-arranged-turntable-frames","cloth-simulation-draped-turntable-frames"):
            hashes=[]
            frames=sorted((Path("docs/images/generated")/directory).glob("frame-*.png"))
            if len(frames) != 73: raise SystemExit("unexpected frame count for "+directory)
            for frame_path in frames:
              hashes.append(hashlib.sha256(frame_path.read_bytes()).hexdigest())
            if len(set(hashes)) != 73: raise SystemExit("all 73 frames are not distinct for "+directory)
            checkpoints=[]
            for frame in (0,18,36,54):
              p=Path("docs/images/generated")/directory/("frame-%03d.png"%frame)
              if not p.is_file(): raise SystemExit("missing "+str(p))
              checkpoints.append(hashlib.sha256(p.read_bytes()).hexdigest())
            if len(set(checkpoints)) != 4: raise SystemExit("camera checkpoints not distinct for "+directory)
          PY
      - name: Build README turntable GIFs
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then IM=(magick)
          elif command -v convert >/dev/null 2>&1; then IM=(convert)
          else sudo apt-get update && sudo apt-get install -y imagemagick && IM=(convert)
          fi
          for spec in \
            "cloth-avatar-turntable-frames cloth-avatar-turntable.gif" \
            "cloth-simulation-arranged-turntable-frames cloth-simulation-arranged-turntable.gif" \
            "cloth-simulation-draped-turntable-frames cloth-simulation-draped-turntable.gif"; do
            read -r frame_dir gif <<< "$spec"
            "${IM[@]}" -delay 8 "docs/images/generated/$frame_dir"/frame-*.png \
              -loop 0 -colors 128 \
              "docs/images/generated/$gif"
            test -s "docs/images/generated/$gif"
            frame_delays="$(identify -format '%T\n' "docs/images/generated/$gif" | sort -u)"
            test "$frame_delays" = "8"
          done
          for gif in \
            docs/images/generated/cloth-avatar-turntable.gif \
            docs/images/generated/cloth-simulation-arranged-turntable.gif \
            docs/images/generated/cloth-simulation-draped-turntable.gif; do
            identify -format '%n\n' "$gif" | head -n 1 | grep -qx '73'
          done
      - name: Upload README turntable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readme-turntables
          path: |
            docs/images/generated/cloth-avatar-turntable.gif
            docs/images/generated/cloth-simulation-arranged-turntable.gif
            docs/images/generated/cloth-simulation-draped-turntable.gif
            docs/images/generated/cloth-avatar-turntable-frames/frame-000.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-018.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-036.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-054.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-000.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-018.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-036.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-054.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-000.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-018.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-036.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-054.png
            docs/images/generated/avatar-gui-progress.log
            docs/images/generated/simulation-turntable-progress.log
          if-no-files-found: ignore
          compression-level: 1

  gui-visual-examples:
    name: Basic blanket visual example
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 30
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned PositionBasedDynamics validation image
        run: docker pull "$FREECAD_PBD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_PBD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run blanket visual example
        run: |
          set -euo pipefail
          rm -rf docs/images/generated/blanket-example
          mkdir -p docs/images/generated/blanket-example
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e FREECAD_USER_HOME=/tmp/freecad-user \
            -e FREECAD_USER_DATA=/tmp/freecad-user-data \
            -e FREECAD_USER_TEMP=/tmp/freecad-user-temp \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_SUBSTEPS=8 -e CLOTH_PBD_COLLISION_MODE=mesh \
            -e CLOTH_PBD_COLLISION_TRIANGLES=2048 -e CLOTH_PBD_COLLISION_VOXEL_MM=8 \
            -e CLOTH_PBD_COLLISION_TOLERANCE_MM=2 \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /tmp "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              rm -rf "$FREECAD_USER_HOME" "$FREECAD_USER_DATA" "$FREECAD_USER_TEMP"
              mkdir -p "$FREECAD_USER_HOME" "$FREECAD_USER_DATA" "$FREECAD_USER_TEMP" "$XDG_RUNTIME_DIR" /workspace/docs/images/generated/blanket-example
              rm -rf /tmp/freecad-mod
              mkdir -p /tmp/freecad-mod/freecad-cloth
              cp -a /workspace/Init.py /workspace/InitGui.py /workspace/package.xml /workspace/resources /workspace/freecad_cloth /tmp/freecad-mod/freecad-cloth/
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 60s /opt/freecad/AppRun -M /tmp/freecad-mod -P /tmp/freecad-mod/freecad-cloth /workspace/tests/freecad_visual_examples.py
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Validate blanket visual evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test -s docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'blanket-visual-acceptance=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'mesh=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'movement=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'material-presentation=passed viewport=true' docs/images/generated/blanket-example/blanket-visual.log
          test "$(find docs/images/generated/blanket-example -maxdepth 1 -name 'checkpoint-*.png' | wc -l)" -eq 5
          test "$(find docs/images/generated/blanket-example -maxdepth 1 -name 'motion-*.png' | wc -l)" -eq 16

      - name: Build blanket motion GIF
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=(magick)
          elif command -v convert >/dev/null 2>&1; then
            IM=(convert)
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=(convert)
          fi
          "${IM[@]}" -delay 10 -loop 0 \
            docs/images/generated/blanket-example/motion-*.png \
            -colors 128 docs/images/generated/blanket-example/blanket-motion.gif
          identify -format '%n\n' docs/images/generated/blanket-example/blanket-motion.gif | head -n 1 | grep -qx '16'
          frame_delays="$(identify -format '%T\n' docs/images/generated/blanket-example/blanket-motion.gif | sort -u)"
          test "$frame_delays" = "10"
          test -s docs/images/generated/blanket-example/blanket-motion.gif
      - name: Upload blanket visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blanket-visual-example
          path: |
            docs/images/generated/blanket-example/*.png
            docs/images/generated/blanket-example/blanket-motion.gif
            docs/images/generated/blanket-example/blanket-visual.log
          if-no-files-found: error
          compression-level: 1
  publish-readme-turntables:
