          cp ../tunic/docs/images/generated/cloth-simulation-draped-diagnostics.png docs/images/generated/cloth-simulation-diagnostics.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/generated/cloth-avatar-turntable.gif \
            docs/images/generated/cloth-simulation-arranged-turntable.gif \
