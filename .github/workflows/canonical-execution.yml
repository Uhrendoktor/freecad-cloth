name: Canonical execution

on:
  push:
    branches: [main, ci/self-hosted-native-freecad]
  pull_request:
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FREECAD_BIN: freecad
      CLOTH_TEST_JOBS: 4
      DISPLAY: :99
      QT_X11_NO_MITSHM: 1
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate prebuilt self-hosted runner
        run: |
          set -u
          echo "Runner: $(hostname)"
          echo "OS: $(uname -a)"
          echo "CPU threads: $(nproc)"
          echo "PATH: $PATH"
          for tool in python3 xvfb-run openbox xargs Xvfb docker; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "FOUND $tool: $(command -v "$tool")"
            else
              echo "MISSING $tool"
            fi
          done
          if command -v "$FREECAD_BIN" >/dev/null 2>&1; then
            echo "FOUND FreeCAD: $(command -v "$FREECAD_BIN")"
            "$FREECAD_BIN" --version || true
          else
            echo "MISSING FreeCAD executable: $FREECAD_BIN"
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "Cached CI image candidates:"
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep 'freecad' || true
          fi
          # Keep this step non-failing so the next run can report the complete
          # runner state instead of hiding which preinstalled dependency is absent.
          exit 0

      - name: Require FreeCAD test runtime
        run: |
          set -euo pipefail
          for tool in python3 xvfb-run openbox xargs; do
            command -v "$tool" >/dev/null || { echo "Missing required runner utility: $tool" >&2; exit 1; }
          done
          command -v "$FREECAD_BIN" >/dev/null || {
            echo "Missing FREECAD_BIN=$FREECAD_BIN. Provision FreeCAD 1.1.3 on the runner or set FREECAD_BIN to its executable path." >&2
            exit 1
          }

      - name: Run Python tests and FreeCAD smoke/GUI tests
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated artifacts/freecad-e2e
          rm -f docs/images/generated/*.png docs/images/generated/gui-progress.log

          printf '%s\n' \
            tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py \
            tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py \
            tests/test_simulation_scene.py tests/test_collisions.py tests/test_freecad_objects.py \
            tests/test_gui_structure.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py \
            tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_avatar_fitting.py \
            tests/test_drape_quality.py tests/test_pattern_sketch.py tests/test_pattern_ir.py \
            tests/test_pattern_export_semantics.py tests/test_sketch_authority.py \
            tests/test_simulation_quality.py tests/test_sewing_network_gui_contract.py \
            | xargs -P "${CLOTH_TEST_JOBS}" -n 1 python3

          python3 -m compileall -q .
          "$FREECAD_BIN" tests/freecad_smoke.py
          "$FREECAD_BIN" tests/freecad_meshpart_smoke.py
          "$FREECAD_BIN" tests/freecad_sewing_smoke.py
          timeout --signal=TERM --kill-after=5s 120s "$FREECAD_BIN" tests/freecad_screenshot.py

          test -s docs/images/generated/cloth-pattern-design.png
          test -s docs/images/generated/cloth-sewing.png
          test -s docs/images/generated/cloth-simulation.png

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
          compression-level: 1

      - name: Upload GUI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            artifacts/freecad-e2e/workflow.log
          if-no-files-found: ignore
          compression-level: 1
