name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

env:
  FREECAD_BIN: freecad
  FREECAD_VERSION: 1.1.3
  FREECAD_APPIMAGE_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  PIXELFLUX_WAYLAND: false
  XDG_RUNTIME_DIR: /tmp/runtime-cloth
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1

jobs:
  python-core:
    name: Python core
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max docker/freecad-ci
      - name: Run core tests
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            for test in tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py tests/test_collisions.py; do
              echo "PYTEST START $test"
              python3 "$test"
              echo "PYTEST PASS $test"
            done
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  python-pattern-sewing:
    name: Python pattern and sewing
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max docker/freecad-ci
      - name: Run pattern and sewing tests
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            for test in tests/test_pattern_sketch.py tests/test_pattern_ir.py tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_sewing_network_gui_contract.py tests/test_gui_structure.py; do
              echo "PYTEST START $test"
              python3 "$test"
              echo "PYTEST PASS $test"
            done
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  python-simulation:
    name: Python simulation
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max docker/freecad-ci
      - name: Run simulation tests
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            for test in tests/test_simulation_scene.py tests/test_simulation_quality.py tests/test_avatar_fitting.py tests/test_drape_quality.py tests/test_freecad_objects.py; do
              echo "PYTEST START $test"
              python3 "$test"
              echo "PYTEST PASS $test"
            done
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  python-compile:
    name: Python compileall
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m compileall -q .

  freecad-smoke:
    name: FreeCAD smoke ${{ matrix.test }}
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        test:
          - tests/freecad_smoke.py
          - tests/freecad_meshpart_smoke.py
          - tests/freecad_sewing_smoke.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max docker/freecad-ci
      - name: Run smoke without entering the FreeCAD GUI event loop
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          TEST: ${{ matrix.test }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/freecad-e2e docs/images/generated
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash \
            -e DISPLAY=:99 -e TEST="$TEST" -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PIXELFLUX_WAYLAND=false \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated -e CLOTH_E2E_DIR=/workspace/artifacts/freecad-e2e \
            -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
              set -e
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/freecad-e2e
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              trap "kill $XVFB_PID 2>/dev/null || true" EXIT
              sleep 1
              echo "FREECAD START $TEST"
              printf "%s\n" "import FreeCADGui; FreeCADGui.setupWithoutGUI(); exec(compile(open(\"$TEST\", encoding=\"utf-8\").read(), \"$TEST\", \"exec\"))" "exit()" | timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun freecad --console
              echo "FREECAD PASS $TEST"
            ')"
          cleanup() {
            set +e
            docker cp "$CID:/workspace/artifacts/freecad-e2e/." artifacts/freecad-e2e/ 2>/dev/null || true
            docker cp "$CID:/workspace/docs/images/generated/." docs/images/generated/ 2>/dev/null || true
            docker logs "$CID" > artifacts/freecad-e2e/docker-console.log 2>&1 || true
            docker inspect "$CID" > artifacts/freecad-e2e/docker-inspect.json 2>/dev/null || true
            docker cp "$CID:/tmp/xvfb.log" artifacts/freecad-e2e/xvfb.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-${{ matrix.test }}-diagnostics
          path: artifacts/freecad-e2e
          if-no-files-found: ignore
          compression-level: 1

  gui-screenshot:
    name: FreeCAD GUI screenshot
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max docker/freecad-ci
      - name: Run GUI screenshot
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash \
            -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PIXELFLUX_WAYLAND=false \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
              set -e
              mkdir -p "$XDG_RUNTIME_DIR"
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & WM_PID=$!
              trap "kill $WM_PID $XVFB_PID 2>/dev/null || true" EXIT
              sleep 1
              timeout --signal=TERM --kill-after=10s 120s /opt/freecad/AppRun /workspace/tests/freecad_screenshot.py
            ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
