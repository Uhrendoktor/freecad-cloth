name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_xpbd.py
          python tests/test_cloth_solver.py
          python tests/test_side_tasks.py
          python tests/test_simulation_scene.py
          python tests/test_collisions.py
          python tests/test_freecad_objects.py
          python tests/test_gui_structure.py
          python tests/test_sewing_workbench.py
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
          test -f PatternGui.py
          test -f SimulationGui.py
          test -f SewingGui.py
          test -f SewingObjects.py

  freecad-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real FreeCAD runtime in Debian trixie
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad
              freecadcmd --version
              freecadcmd tests/freecad_smoke.py
            '

  one-shot-branch-cleanup:
    if: github.event_name == 'push' && github.event.head_commit.message == 'chore: one-shot stale branch cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete confirmed stale branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          stale_branches=(
            'agent/drape-selection-controls-20260828'
            'agent/drape-selection-controls-v2-20260828'
            'agent/pattern-drafting-canvas-20260828'
            'agent/pattern-workbench-marks-20260828'
            'agent/sewing-plan-20260828'
            'agent/sewing-workbench'
            'agent/sewing-workbench-smoke-20260828'
            'agent/simulation-gui-20260828-final'
            'agent/simulation-gui-20260828-v2'
            'agent/simulation-gui-20260828'
            'agent/xpbd-capsule-collision-20260828'
            'ci/initial-validation'
            'ci/initial-validation-2'
            'feat/clean-workbench-command-separation'
            'feature/sewing-ui-integrated'
            'feature/sewing-ui-v2'
            'feature/sewing-workbench-tools'
            'feature/sewing-workbench-tools-v2'
            'mainline/pattern-mesh'
            'mainline/pattern-mesh-2'
            'mainline/pattern-mesh-3'
            'mainline/pattern-mesh-4'
            'mainline/pattern-mesh-5'
            'side-tasks/final'
            'side-tasks/finalize'
            'side-tasks/impl'
            'side-tasks/real'
            'side-tasks/remaining'
            'side-tasks/svg'
            'side-tasks/work'
            'supervisor/ci-repair-20260828'
            'supervisor/freecad-ci-smoke'
            'supervisor/parametric-patternpiece'
            'supervisor/seam-allowance-20260828'
            'supervisor/seam-graph-backend-20260828'
            'supervisor/cleanup-duplicate-backend-20260828'
          )
          for branch in "${stale_branches[@]}"; do
            echo "Deleting $branch"
            curl --fail-with-body --silent --show-error \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}/git/refs/heads/${branch}"
          done
