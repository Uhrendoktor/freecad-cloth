name: Canonical execution engine
run-name: Canonical execution engine
# Execution mode is caller-selected: fast PR feedback, full merge-queue validation, or documentation publication.
on:
  workflow_call:
    inputs:
      execution_mode:
        description: fast for PR iteration, full for pre-merge validation, publication for main-only documentation assets, or scheduled.
        required: true
        type: string
      runner_mode:
        description: Trusted execution mode; local prefers self-hosted Docker, hosted uses GitHub-hosted runners.
        required: false
        type: string
        default: local
      fallback_source_run:
        description: Original run ID when invoked as an automatic hosted fallback.
        required: false
        type: string
        default: ""
      diagnostic_controls:
        description: Run diagnostic-only PBD contact controls.
        required: false
        type: boolean
        default: false
      pr_number:
        description: Optional PR number for explicit full validation and PR evidence publication.
        required: false
        type: string
        default: ""

env:
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth
  CLOTH_SIMULATION_BACKEND: position-based-dynamics
  CLOTH_CI_ENABLE_PBD: 1
  CLOTH_PBD_SUBSTEPS: 8
  CLOTH_PBD_COLLISION_MODE: mesh
  CLOTH_PBD_COLLISION_TOLERANCE_MM: 2
  CLOTH_CI_RUNNER_MODE: ${{ inputs.runner_mode || (github.event_name == 'pull_request' && 'hosted' || 'local') }}
  CLOTH_CI_EXECUTION_MODE: ${{ inputs.execution_mode }}
  CLOTH_TURNTABLE_FRAMES: 72
  CLOTH_BLANKET_STEPS: 180
  CLOTH_TURNTABLE_PBD_SUBSTEPS: 10
  CLOTH_DOC_AVATAR_FIT_STEPS: 10
  CLOTH_TURNTABLE_AVATAR_FIT_STEPS: 18
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  # Explicitly activated on main; ordinary pushes and PR checks leave this job skipped.
  # The activation commit's first title line identifies the target PR; its branch head is read live at run time.
  # Activation commit titles use RUN REBASE: PR #<number> to rebase that open PR and dispatch exact-head validation.
  guarded-rebase-pr:
    name: Rebase a PR named in an explicit activation commit
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN REBASE: PR #') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase requested PR branch onto current main and dispatch exact-head validation
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_TITLE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="$(printf '%s\n' "$ACTIVATION_TITLE" | head -n 1 | sed -n 's/^RUN REBASE: PR #\([0-9][0-9]*\)$/\1/p')"
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Invalid rebase activation commit title."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main

          PR_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          PR_STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          PR_BASE="$(printf '%s' "$PR_JSON" | jq -r '.base.ref')"
          PR_BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.head.ref')"
          PR_REPO="$(printf '%s' "$PR_JSON" | jq -r '.head.repo.full_name // empty')"
          EXPECTED_HEAD="$(printf '%s' "$PR_JSON" | jq -r '.head.sha')"
          if [ "$PR_STATE" != "open" ] || [ "$PR_BASE" != "main" ] || [ "$PR_REPO" != "${GITHUB_REPOSITORY}" ] || [ -z "$PR_BRANCH" ] || [ "$PR_BRANCH" = "main" ]; then
            echo "::error::PR must be open, based on main, and have a branch in this repository."
            exit 1
          fi
          git fetch origin "refs/heads/${PR_BRANCH}:refs/remotes/origin/${PR_BRANCH}"
          FETCHED_HEAD="$(git rev-parse "refs/remotes/origin/${PR_BRANCH}")"
          if [ "$FETCHED_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head changed during inspection; refusing to rebase a stale revision."
            exit 1
          fi
          git checkout -B "${PR_BRANCH}" "refs/remotes/origin/${PR_BRANCH}"
          # Rebase without conflict heuristics or generated source/configuration repair.
          # A genuine conflict is an explicit maintainer decision; fail rather than synthesize a commit.
          git rebase origin/main
          git merge-base --is-ancestor origin/main HEAD
          REBASED_HEAD="$(git rev-parse HEAD)"
          git push --force-with-lease="refs/heads/${PR_BRANCH}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${PR_BRANCH}"

          # GITHUB_TOKEN pushes do not reliably start follow-on PR workflows; dispatch the full checks explicitly.
          gh workflow run commit-validation.yml --repo "${GITHUB_REPOSITORY}" --ref "${PR_BRANCH}" -f runner_mode=hosted -f execution_mode=full -f pr_number="${PR_NUMBER}"
          for _ in $(seq 1 30); do
            RUN_JSON="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "Commit validation" --branch "${PR_BRANCH}" --event workflow_dispatch --limit 20 --json databaseId,headSha,status,url | jq -c --arg sha "${REBASED_HEAD}" '[.[] | select(.headSha == $sha)] | first // empty' || true)"
            if [ -n "$RUN_JSON" ]; then echo "$RUN_JSON"; exit 0; fi
            sleep 2
          done
          echo "::error::Dispatched validation but could not find its run for ${REBASED_HEAD}"
          exit 1
  agent-quality:
    name: Static, architecture, workflow, and security gates
    if: ${{ inputs.execution_mode != 'publication' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: timeout --signal=TERM --kill-after=5s 60s python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu "torch==2.8.0+cpu" -e ".[dev]"
      - name: Python and architecture checks
        run: |
          set -euo pipefail
          python -m compileall -q tests tools/ci
          git ls-files -z -- '*.py' '*.pyi' > "$RUNNER_TEMP/python-files.zlist"
          xargs -0 -r python -m ruff format --check < "$RUNNER_TEMP/python-files.zlist"
          xargs -0 -r python -m ruff check < "$RUNNER_TEMP/python-files.zlist"
          python tools/check_documentation_contract.py
          python tools/check_markdown_contract.py
          python tools/ci/timeout_contract.py
          python tools/ci/validate_ci_structure.py
          lint-imports
          python tools/ci/check_explicit_any_annotations.py
          python tools/ci/check_pydantic_models.py
          python tools/ci/check_no_source_rewriting.py
          python -m pytest -q tests/test_no_source_rewriting.py
          pyright -p pyrightconfig.json
          ast-grep test --skip-snapshot-tests --color never
          ast-grep scan --min-severity error --color never freecad_cloth
          ty check --output-format github freecad_cloth/simulation/DrapeFailureClassifier.py freecad_cloth/simulation/ClothBackend.py freecad_cloth/simulation/ClothSolver.py
          python tools/ci/check_changed_python_types.py
          # Scan the complete statically analyzable core surface on every run.
          python tools/check_dead_code.py
          python -m pytest -q tests/test_property_contracts.py tests/test_freecad_gui_startup_contract.py tests/test_freecad_input.py tests/test_explicit_any_annotations.py tests/test_changed_python_types.py tests/test_pydantic_models_policy.py tests/test_ui_design.py tests/test_readme_visual_contract.py
          crosshair check --analysis_kind asserts --per_path_timeout 15 --per_condition_timeout 10 tools/crosshair_contracts.py
      - name: Workflow linters
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files actionlint
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files zizmor
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files yamllint
      - name: PR duplication gate
        if: ${{ github.event_name == 'pull_request' }}
        uses: kucherenko/jscpd@b6f832c62cf02b574ea9cf24e013cfeb17366a35 # v5.4.0
        with:
          path: "freecad_cloth tests tools/ci"
          format: "python"
          min-lines: "8"
          min-tokens: "70"
          baseline-from-ref: "origin/${{ github.base_ref }}"
          fail-on-new-clones: "true"
          fail-on-empty: "true"
  local_runner_readiness:
    name: Selected runner readiness
    if: ${{ github.event_name != 'schedule' && inputs.execution_mode != 'fast' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) }}
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 2
    steps:
      - run: timeout --signal=TERM --kill-after=5s 20s docker info >/dev/null
  runner_watchdog:
    name: Local runner watchdog with hosted fallback
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.runner_mode != 'hosted' && inputs.execution_mode != 'fast' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - name: Prefer local, otherwise dispatch hosted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FALLBACK_WORKFLOW: ${{ inputs.execution_mode == 'publication' && 'main-publication.yml' || 'commit-validation.yml' }}
        run: timeout --signal=TERM --kill-after=5s 60s python3 tools/ci/runner_watchdog.py
  pbd_validation_image:
    name: Build/publish pinned PBD image
    if: ${{ github.event_name != 'schedule' && inputs.execution_mode != 'fast' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: image
        name: Derive immutable PBD image tag
        run: |
          set -euo pipefail
          digest="$(sha256sum < docker/freecad-ci/Dockerfile | cut -d' ' -f1)"
          short_digest="$(printf '%s' "$digest" | cut -c1-32)"
          echo "image=ghcr.io/uhrendoktor/freecad-cloth/pbd-validation:$short_digest" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/pbd-image
        with:
          image: ${{ steps.image.outputs.image }}
  diagnostic-pbd-contact:
    name: Diagnostic PBD contact controls
    if: ${{ inputs.execution_mode == 'full' && ((github.event_name == 'workflow_dispatch' && inputs.diagnostic_controls) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'cube-ladder-2481') || contains(github.event.pull_request.head.ref, 'avatar-ladder-2482')))) }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_pbd_contact_diagnostics.py
          log-file: artifacts/pbd-contact-diagnostics/app-run.log
          environment: |
            CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=1
            CLOTH_PBD_SUBSTEPS=1
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_cube_ladder.py
          log-file: artifacts/pbd-contact-diagnostics/cube-ladder-run.log
          environment: CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_avatar_ladder.py
          log-file: artifacts/pbd-contact-diagnostics/avatar-ladder-run.log
          validate-command: python3 tools/ci/validate_manifests.py diagnostic
          artifact-name: pbd-contact-diagnostics
          artifact-path: artifacts/pbd-contact-diagnostics/**
          environment: |
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  simulation-ladder:
    name: Simulation collision ladder
    if: ${{ inputs.execution_mode == 'full' && github.event_name != 'schedule' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          timeout-seconds: "360"
          test-script: tests/freecad_pbd_cube_ladder.py
          log-file: artifacts/simulation-ladder/cube-ladder-run.log
          environment: |
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_avatar_ladder.py
          log-file: artifacts/simulation-ladder/avatar-ladder-run.log
          validate-command: python3 tools/ci/validate_manifests.py simulation
          artifact-name: simulation-collision-ladder
          artifact-path: artifacts/simulation-ladder/**
          observation-root: artifacts/simulation-ladder
          observation-label: PBD simulation collision ladder
          observation-files: >-
            metrics=cube-ladder-manifest.json;metrics=avatar-ladder-manifest.json;
            visual=cube-ladder/rung-1-cube-pinned/step-000.png;
            visual=cube-ladder/rung-1-cube-pinned/step-090.png;
            visual=avatar-ladder/rung-6-avatar-pinned/step-090.png
          environment: |
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            CLOTH_SIMULATION_BACKEND=position-based-dynamics
            CLOTH_CI_ENABLE_PBD=1
            CLOTH_PBD_SUBSTEPS=8
            CLOTH_PBD_COLLISION_MODE=mesh
            CLOTH_PBD_COLLISION_TOLERANCE_MM=2

  python:
    name: Python validation (${{ matrix.group }})
    if: ${{ inputs.execution_mode == 'full' && github.event_name != 'schedule' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: [core, pattern, sewing, gui, pytest]
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run pure Python validation groups
        if: ${{ matrix.group != 'gui' }}
        uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-container@6d4c0ad13e2e267c48b746d5d09b9ffc3d059128
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          command: >-
            bash -lc 'set -o pipefail; mkdir -p artifacts; python3 tools/ci/python_validation.py "${{ matrix.group }}" 2>&1 | tee artifacts/python-validation.log'
          environment: CLOTH_CI_ENABLE_PBD=0
      - name: Run GUI Python validation
        if: ${{ matrix.group == 'gui' }}
        uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tools/ci/python_validation.py
          test-args: gui
          log-file: artifacts/python-validation.log
          artifact-name: python-validation-${{ matrix.group }}
          artifact-path: artifacts/python-validation.log
  gui-simple:
    name: GUI acceptance (${{ matrix.case }})
    if: ${{ inputs.execution_mode == 'full' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: sewing, script: tests/freecad_sewing_creation_smoke.py, log: artifacts/sewing-creation-smoke.log, artifact: sewing-creation-smoke, stage: "true", clean: "false", env: "CLOTH_SEWING_SMOKE_LOG=/workspace/artifacts/sewing-creation-smoke.log", pre: "python3 tests/freecad_tunic_audit.py --syntax-check", validate: ""}
          - {case: avatar-pose, script: tests/freecad_avatar_pose_ui_acceptance.py, log: artifacts/avatar-pose-ui.log, artifact: avatar-pose-ui, stage: "true", clean: "false", env: "", validate: "python3 tools/ci/validate_acceptance.py avatar-pose"}
          - {case: avatar-provider-lifecycle, script: tests/freecad_avatar_acceptance.py, log: artifacts/avatar-provider-lifecycle-run.log, artifact: avatar-provider-lifecycle, stage: "true", clean: "false", env: "FREECAD_CLOTH_ANNY_FIT_STEPS=18", validate: "python3 tools/ci/validate_acceptance.py avatar-provider-lifecycle"}
          - {case: avatar-shape-editor, script: tests/freecad_avatar_shape_editor_acceptance.py, log: artifacts/avatar-shape-editor.log, artifact: avatar-shape-editor, stage: "true", clean: "false", env: "FREECAD_CLOTH_ANNY_FIT_STEPS=18", validate: "python3 tools/ci/validate_acceptance.py avatar-shape-editor"}
          - {case: fitting, script: tests/freecad_interactive_arrange_acceptance.py, log: artifacts/interactive-arrange.log, artifact: interactive-arrange, stage: "true", clean: "false", env: "", validate: "python3 tools/ci/validate_acceptance.py fitting"}
          - {case: simulation-quality, script: tests/freecad_simulation_quality_acceptance.py, log: artifacts/simulation-quality-acceptance.log, artifact: simulation-quality-acceptance, stage: "true", clean: "false", env: "CLOTH_SIMULATION_QUALITY_ARTIFACT_DIR=/workspace/artifacts", pre: "", validate: "python3 tools/ci/validate_acceptance.py simulation-quality"}
          - {case: sketcher, script: tests/freecad_sketcher_acceptance.py, log: artifacts/sketcher-acceptance.log, artifact: sketcher-acceptance, stage: "true", clean: "true", env: "SKETCHER_STAGE_FILE=/workspace/artifacts/sketcher-stage.log", validate: ""}
          - {case: pattern-export, script: tests/freecad_pattern_export_smoke.py, log: artifacts/pattern-production-export.log, artifact: pattern-production-export, stage: "true", clean: "false", env: "CLOTH_PATTERN_EXPORT_LOG=/workspace/artifacts/pattern-production-export.log", validate: ""}
          - {case: surface-pen, script: tests/freecad_surface_pen_smoke.py, log: artifacts/surface-pen.log, artifact: surface-pen, stage: "true", clean: "false", env: "", validate: "python3 tools/ci/validate_acceptance.py surface-pen"}
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: ${{ matrix.script }}
          pre-command: ${{ matrix.pre }}
          log-file: ${{ matrix.log }}
          validate-command: ${{ matrix.validate }}
          artifact-name: ${{ matrix.artifact }}
          artifact-path: artifacts
          stage-workbench: ${{ matrix.stage }}
          clean-user: ${{ matrix.clean }}
          environment: ${{ matrix.env }}
  gui-tunic-visual:
    name: Full tunic visual and simulation audit
    if: ${{ inputs.execution_mode == 'full' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 15
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_realtime_benchmark.py
          pre-command: mkdir -p artifacts
          log-file: artifacts/freecad-realtime/freecad-realtime-benchmark.log
          environment: |
            CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
            CLOTH_PBD_SUBSTEPS=1
            CLOTH_REALTIME_FRAMES=120
            CLOTH_REALTIME_WARMUP_FRAMES=30
          artifact-name: realtime-preview-performance
          artifact-path: artifacts/freecad-realtime/**

      - name: Independently validate realtime performance metrics
        if: always()
        run: python3 tools/ci/validate_realtime_benchmark.py artifacts/freecad-realtime/metrics.json
      - uses: ./.github/actions/freecad-test
        if: always()
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_tunic_audit_production.py
          stage-workbench: "true"
          clean-user: "true"
          log-file: artifacts/tunic-audit/freecad-tunic-audit.log
          validate-command: timeout --signal=TERM --kill-after=5s 50s bash -lc 'python3 tools/ci/capture_pypbd_provenance.py "$FREECAD_PBD_IMAGE" artifacts/pypbd-provenance.txt && python3 tools/ci/validate_manifests.py tunic-production'
          artifact-name: tunic-visual-audit
          artifact-path: |
            docs/images/generated/**
            artifacts/garment-e2e.log
            artifacts/tunic-audit/**
            artifacts/freecad-realtime/**
            artifacts/pypbd-provenance.txt
          scene-report-command: python3 tools/ci/scene_understanding_report.py --progress docs/images/generated/gui-progress.log --output-root docs/images/generated
          observation-root: docs/images/generated
          observation-label: Tunic pattern-to-fitting scene diagnostics
          observation-files: >-
            summary=scene-understanding.json;visual=scene-understanding.svg
          # 8 mm bounds native SDF cost; 5 mm target thickness still controls clearance, and exact mesh projection retains the zero-penetration gate.
          environment: |
            FREECAD_CLOTH_ANNY_FIT_STEPS=18
            CLOTH_PBD_SUBSTEPS=16
            CLOTH_PBD_COLLISION_VOXEL_MM=8.0
            CLOTH_PBD_COLLISION_TOLERANCE_MM=2.0
            CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
  gui-turntables:
    name: README turntable evidence
    if: ${{ inputs.execution_mode == 'full' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 10
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: "${{ env.FREECAD_PBD_IMAGE }}"
          test-script: tests/freecad_avatar_screenshot.py
          clean-user: "true"
          log-file: artifacts/avatar-gui-progress.log
          environment: "CLOTH_CI_DISABLE_PBD=1\nCLOTH_AVATAR_SCREENSHOT_MODE=turntable-validation\nFREECAD_CLOTH_ANNY_FIT_STEPS=${{ env.CLOTH_TURNTABLE_AVATAR_FIT_STEPS }}\nCLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated"
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_simulation_turntable.py
          log-file: docs/images/generated/simulation-turntable-progress.log
          validate-command: timeout --signal=TERM --kill-after=5s 55s python3 tools/ci/validate_manifests.py turntables
          artifact-name: readme-turntables
          artifact-path: |
            docs/images/generated/*.png
            docs/images/generated/*.gif
            docs/images/generated/*.log
            docs/images/generated/*.txt
          environment: "CLOTH_PBD_SUBSTEPS=${{ env.CLOTH_TURNTABLE_PBD_SUBSTEPS }}\nCLOTH_BLANKET_STEPS=${{ env.CLOTH_BLANKET_STEPS }}\nCLOTH_TURNTABLE_FRAMES=${{ env.CLOTH_TURNTABLE_FRAMES }}\nCLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated"
  gui-visual-examples:
    name: Blanket visual example
    if: ${{ inputs.execution_mode == 'full' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_visual_examples.py
          stage-workbench: "true"
          clean-user: "true"
          log-file: docs/images/generated/blanket-example/blanket-visual.log
          validate-command: timeout --signal=TERM --kill-after=5s 55s python3 tools/ci/validate_manifests.py blanket
          artifact-name: blanket-visual-example
          artifact-path: docs/images/generated/**
          environment: CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
  publish-pr-simulation-evidence:
    name: Publish PR simulation evidence
    needs: [agent-quality, gui-tunic-visual]
    if: ${{ needs.gui-tunic-visual.result == 'success' && inputs.execution_mode == 'full' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/publish-visual-evidence@3bd8306b79b4274695176829edd7b750a0d8390d
        with:
          mode: pr
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          evidence-head: ${{ github.event.pull_request.head.sha || github.sha }}
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

  find-validation-artifacts:
    name: Locate validated artifacts for this exact source tree
    if: ${{ inputs.execution_mode == 'publication' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.runner_mode == 'hosted' && inputs.fallback_source_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
      validated_sha: ${{ steps.lookup.outputs.validated_sha }}
    steps:
      - id: lookup
        name: Find successful full validation with the same Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_tree="$(gh api "repos/${REPOSITORY}/git/commits/${SOURCE_SHA}" --jq '.tree.sha')"

          find_validated_run() {
            local workflow="$1"
            local event="$2"
            local gate_name="$3"
            local runs=""
            runs="$(gh run list --repo "${REPOSITORY}" --workflow "${workflow}" --event "${event}" --status success --limit 100 --json databaseId,headSha)"
            while read -r run_id head_sha; do
              [ -n "${run_id}" ] || continue
              gate_result="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" | jq --arg gate "${gate_name}" '[.jobs[] | select(.name == $gate and .conclusion == "success")] | length')"
              [ "${gate_result}" = "1" ] || continue
              candidate_tree="$(gh api "repos/${REPOSITORY}/git/commits/${head_sha}" --jq '.tree.sha' 2>/dev/null || true)"
              if [ -n "${candidate_tree}" ] && [ "${candidate_tree}" = "${source_tree}" ]; then
                printf "%s %s\n" "${run_id}" "${head_sha}"
                return 0
              fi
            done < <(printf "%s" "${runs}" | jq -r '.[] | [.databaseId, .headSha] | @tsv')
            return 1
          }

          # Preferred path: the dedicated merge-queue gate validated this exact tree.
          if matched="$(find_validated_run merge-validation.yml merge_group "Required pre-merge validation")"; then
            read -r run_id head_sha <<< "${matched}"
          # Alternate explicit path: the full suite ran for this exact PR tree.
          elif matched="$(find_validated_run commit-validation.yml pull_request "Explicit full validation / Required validation gate")"; then
            read -r run_id head_sha <<< "${matched}"
          else
            echo "::error::No successful full-validation run matched source tree ${source_tree}; refusing to publish unvalidated assets."
            exit 1
          fi
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "validated_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "validation-artifacts-run=${run_id} validated_sha=${head_sha} tree=${source_tree}"

  gui-documentation-assets:
    name: Main-only documentation stills and animation frames
    if: ${{ inputs.execution_mode == 'publication' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.runner_mode == 'hosted' && inputs.fallback_source_run != '')) }}
    needs: [find-validation-artifacts, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ inputs.runner_mode == 'hosted' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 12
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_avatar_screenshot.py
          clean-user: "true"
          log-file: artifacts/avatar-documentation-progress.log
          environment: "CLOTH_CI_DISABLE_PBD=1\nCLOTH_AVATAR_SCREENSHOT_MODE=documentation\nFREECAD_CLOTH_ANNY_FIT_STEPS=${{ env.CLOTH_DOC_AVATAR_FIT_STEPS }}\nCLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated"
          artifact-name: avatar-documentation-assets
          artifact-path: |
            docs/images/generated/cloth-avatar-*.png
            docs/images/generated/avatar-body-shape-gallery.png
            artifacts/avatar-documentation-progress.log
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_avatar_screenshot.py
          clean-user: "true"
          log-file: artifacts/avatar-turntable-documentation.log
          environment: "CLOTH_CI_DISABLE_PBD=1\nCLOTH_AVATAR_SCREENSHOT_MODE=documentation-turntable\nCLOTH_TURNTABLE_FRAMES=${{ env.CLOTH_TURNTABLE_FRAMES }}\nCLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated"
          artifact-name: avatar-turntable-documentation-frames
          artifact-path: |
            docs/images/generated/cloth-avatar-turntable-frames/**
            artifacts/avatar-turntable-documentation.log
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_simulation_turntable.py
          clean-user: "true"
          log-file: artifacts/simulation-turntable-documentation.log
          environment: "CLOTH_DOCUMENTATION_CAPTURE_ONLY=true\nCLOTH_PBD_SUBSTEPS=${{ env.CLOTH_TURNTABLE_PBD_SUBSTEPS }}\nCLOTH_BLANKET_STEPS=${{ env.CLOTH_BLANKET_STEPS }}\nCLOTH_TURNTABLE_FRAMES=${{ env.CLOTH_TURNTABLE_FRAMES }}\nCLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated"
          artifact-name: simulation-turntable-documentation-frames
          artifact-path: |
            docs/images/generated/cloth-simulation-arranged-turntable-frames/**
            docs/images/generated/cloth-simulation-draped-turntable-frames/**
            docs/images/generated/simulation-turntable-progress.log
            artifacts/simulation-turntable-documentation.log

  publish-readme-turntables:
    name: Publish README/wiki visual evidence
    concurrency:
      group: canonical-main-visual-publisher
      cancel-in-progress: false
    needs: [find-validation-artifacts, gui-documentation-assets]
    if: ${{ inputs.execution_mode == 'publication' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.runner_mode == 'hosted' && inputs.fallback_source_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - name: Install ImageMagick for main GIF publication
        if: ${{ github.ref == 'refs/heads/main' }}
        run: command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick; }
      - uses: ./.github/actions/publish-visual-evidence
        with:
          source-sha: ${{ github.sha }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          run-number: ${{ github.run_number }}
          artifact-run-id: ${{ needs.find-validation-artifacts.outputs.run_id }}

  maintenance-cleanup:
    name: Repository retention cleanup
    # One-shot manual activation: commit title starts with "RUN MAINTENANCE CLEANUP".
    if: "${{ (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}", persist-credentials: false}
      - name: Retention cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: timeout --signal=TERM --kill-after=5s 180s python3 tools/ci/maintenance_cleanup.py
  artifact-budget:
    name: Accumulated artifact budget
    if: ${{ always() && inputs.execution_mode != 'fast' && inputs.execution_mode != 'publication' && !startsWith(github.event.head_commit.message, 'RUN MAINTENANCE CLEANUP') }}
    needs: [agent-quality, diagnostic-pbd-contact, simulation-ladder, python, gui-simple, gui-tunic-visual, gui-visual-examples, gui-turntables, benchmark, publish-readme-turntables]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {actions: read, contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check visual assets and accumulated artifact size
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VISUAL_PUBLISH_RESULT: ${{ needs.publish-readme-turntables.result }}
          VISUAL_PUBLISH_REQUIRED: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.runner_mode == 'hosted' && inputs.fallback_source_run != '') }}
        run: python3 tools/ci/check_visual_assets_and_budget.py

  benchmark:
    name: Workbench benchmark (${{ matrix.workbench }})
    if: ${{ inputs.execution_mode == 'full' && github.event_name != 'schedule' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workbench: [Pattern, Sewing, Simulation]
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-test@deaefecf71ef3115134a2c01ef92956f72584c38
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_workbench_benchmark.py
          log-file: artifacts/workbench-benchmark.log
          artifact-name: workbench-benchmark-${{ matrix.workbench }}
          artifact-path: artifacts
          environment: |
            CLOTH_BENCHMARK_WORKBENCH=${{ matrix.workbench }}
            CLOTH_BENCHMARK_OUTPUT=artifacts/benchmark.json
            CLOTH_BENCHMARK_REPEATS=7
      - run: test -s artifacts/benchmark.json
      - run: python3 tools/ci/validate_workbench_benchmark.py artifacts/benchmark.json "${{ matrix.workbench }}"

  required-validation-gate:
    name: Required validation gate
    if: ${{ always() && inputs.execution_mode != 'publication' && inputs.execution_mode != 'scheduled' }}
    needs: [agent-quality, local_runner_readiness, pbd_validation_image, simulation-ladder, python, gui-simple, gui-tunic-visual, gui-turntables, gui-visual-examples, benchmark, artifact-budget]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Enforce checks selected by the execution mode
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode }}
          AGENT_QUALITY_RESULT: ${{ needs.agent-quality.result }}
          RUNNER_READINESS_RESULT: ${{ needs.local_runner_readiness.result }}
          PBD_IMAGE_RESULT: ${{ needs.pbd_validation_image.result }}
          SIMULATION_LADDER_RESULT: ${{ needs.simulation-ladder.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          GUI_SIMPLE_RESULT: ${{ needs.gui-simple.result }}
          TUNIC_AUDIT_RESULT: ${{ needs.gui-tunic-visual.result }}
          TURNTABLE_RESULT: ${{ needs.gui-turntables.result }}
          BLANKET_RESULT: ${{ needs.gui-visual-examples.result }}
          ARTIFACT_BUDGET_RESULT: ${{ needs.artifact-budget.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            local label="$1" result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$label must succeed for execution_mode=$EXECUTION_MODE (result=$result)"
              exit 1
            fi
          }
          require_success "Static/code validation" "$AGENT_QUALITY_RESULT"
          if [ "$EXECUTION_MODE" = "full" ]; then
            require_success "Runner readiness" "$RUNNER_READINESS_RESULT"
            require_success "PBD validation image" "$PBD_IMAGE_RESULT"
            require_success "Simulation collision ladder" "$SIMULATION_LADDER_RESULT"
            require_success "Python validation matrix" "$PYTHON_RESULT"
            require_success "GUI acceptance matrix" "$GUI_SIMPLE_RESULT"
            require_success "Tunic visual and simulation audit" "$TUNIC_AUDIT_RESULT"
            require_success "Avatar and simulation turntables" "$TURNTABLE_RESULT"
            require_success "Blanket visual fixture" "$BLANKET_RESULT"
            require_success "Workbench benchmark" "$BENCHMARK_RESULT"
            require_success "Visual evidence/artifact contract" "$ARTIFACT_BUDGET_RESULT"
          fi
          echo "required-validation=passed mode=$EXECUTION_MODE"
