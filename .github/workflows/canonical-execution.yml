name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  test:
    if: ${{ github.event_name != 'schedule' && github.event.action != 'closed' && !contains(github.event.head_commit.message, '[maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_meshpart_adapter.py
          python tests/test_xpbd.py
          python tests/test_cloth_solver.py
          python tests/test_side_tasks.py
          python tests/test_simulation_scene.py
          python tests/test_collisions.py
          python tests/test_freecad_objects.py
          python tests/test_gui_structure.py
          python tests/test_sewing_workbench.py
          python tests/test_sewing_show2d.py
          python tests/test_sewing_network.py
          python tests/test_sewing_network_gui.py
          python tests/test_avatar_fitting.py
          python tests/test_drape_quality.py
          python tests/test_pattern_sketch.py
          python tests/test_pattern_ir.py
          python tests/test_pattern_export_semantics.py
          python tests/test_sketch_authority.py
          python tests/test_simulation_quality.py
          python tests/test_sewing_network_gui_contract.py
      - name: Reference drape benchmark
        run: python tests/benchmark_drape.py
      - name: Upload reference drape benchmark
        uses: actions/upload-artifact@v4
        with:
          name: drape-benchmark-${{ matrix.python }}
          path: artifacts/drape-benchmark.json
          if-no-files-found: error
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
          test -f PatternGui.py
          test -f SimulationGui.py
          test -f SewingGui.py
          test -f SewingNetworkGui.py
          test -f SewingObjects.py

  freecad-smoke:
    if: ${{ github.event_name != 'schedule' && github.event.action != 'closed' && !contains(github.event.head_commit.message, '[maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real FreeCAD runtime in Debian trixie
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad
              freecadcmd --version
              freecadcmd tests/freecad_smoke.py
              freecadcmd tests/freecad_meshpart_smoke.py
              freecadcmd tests/freecad_sewing_smoke.py
            '

  gui-screenshots:
    if: ${{ github.event_name != 'schedule' && github.event.action != 'closed' && !contains(github.event.head_commit.message, '[maintenance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate FreeCAD GUI screenshots under Xvfb
        run: |
          set -euo pipefail
          mkdir -p "$PWD/docs/images/generated"
          docker run --rm \
            -e DISPLAY=:99 \
            -e QT_X11_NO_MITSHM=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e QT_QPA_PLATFORM=xcb \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -e CLOTH_E2E_DIR=/workspace/artifacts/freecad-e2e \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad xvfb openbox
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
              XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 &
              OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              sleep 2
              rm -f docs/images/generated/cloth-pattern-design.png docs/images/generated/cloth-sewing.png docs/images/generated/cloth-simulation.png docs/images/generated/cloth-simulation-arranged.png docs/images/generated/cloth-simulation-draped.png docs/images/generated/gui-progress.log docs/images/generated/gui-screenshot-manifest.txt
              printf "%s\n" "exec(compile(open(\"tests/freecad_screenshot.py\", encoding=\"utf-8\").read(), \"tests/freecad_screenshot.py\", \"exec\"))" > /tmp/cloth_screenshot.FCMacro
              timeout --signal=TERM --kill-after=5s 90s freecad /tmp/cloth_screenshot.FCMacro >/tmp/freecad-gui.log 2>&1 || {
                status=$?
                cat /tmp/freecad-gui.log || true
                cat docs/images/generated/gui-progress.log || true
                cat docs/images/generated/gui-screenshot-manifest.txt || true
                cat /tmp/xvfb.log || true
                cat /tmp/openbox.log || true
                echo "FreeCAD GUI screenshot process failed or timed out (status $status)"
                exit "$status"
              }
              cat docs/images/generated/gui-progress.log
              cat docs/images/generated/gui-screenshot-manifest.txt
              test -s docs/images/generated/gui-progress.log
              test -s docs/images/generated/gui-screenshot-manifest.txt
              python3 - <<'PY'
              import os, struct
              files = [
                  "cloth-pattern-design.png",
                  "cloth-sewing.png",
                  "cloth-simulation-arranged.png",
                  "cloth-simulation-draped.png",
              ]
              for name in files:
                  path = os.path.join("docs/images/generated", name)
                  if not os.path.isfile(path):
                      raise SystemExit(f"missing screenshot: {path}")
                  size = os.path.getsize(path)
                  if size < 20000:
                      raise SystemExit(f"screenshot too small: {path} ({size} bytes)")
                  with open(path, "rb") as handle:
                      if handle.read(8) != b"\\x89PNG\\r\\n\\x1a\\n":
                          raise SystemExit(f"not a PNG: {path}")
                      length = struct.unpack(">I", handle.read(4))[0]
                      if handle.read(4) != b"IHDR" or length < 8:
                          raise SystemExit(f"missing PNG IHDR: {path}")
                      width, height = struct.unpack(">II", handle.read(8))
                  if width != 1280 or height != 720:
                      raise SystemExit(f"unexpected screenshot dimensions: {path} {width}x{height}")
                  print(f"validated {path}: {width}x{height}, {size} bytes")
              PY
              mkdir -p artifacts/freecad-e2e
              rm -f artifacts/freecad-e2e/workflow.log
              printf "%s\n" "exec(compile(open(\"tests/freecad_e2e.py\", encoding=\"utf-8\").read(), \"tests/freecad_e2e.py\", \"exec\"))" > /tmp/cloth_e2e.FCMacro
              timeout --signal=TERM --kill-after=5s 90s freecad /tmp/cloth_e2e.FCMacro >/tmp/freecad-e2e.log 2>&1 || {
                status=$?
                cat /tmp/freecad-e2e.log || true
                cat artifacts/freecad-e2e/workflow.log || true
                cat /tmp/xvfb.log || true
                cat /tmp/openbox.log || true
                echo "FreeCAD canonical E2E process failed or timed out (status $status)"
                exit "$status"
              }
              cat artifacts/freecad-e2e/workflow.log
              test -s artifacts/freecad-e2e/workflow.log
            '
      - name: Upload GUI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
            artifacts/freecad-e2e/workflow.log
            /tmp/freecad-gui.log
            /tmp/freecad-e2e.log
            /tmp/xvfb.log
            /tmp/openbox.log
          if-no-files-found: ignore
      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error

  publish-merged-gui:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    concurrency:
      group: merged-gui-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Find the successful GUI screenshot run
        id: find-run
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(gh api --paginate \
            "/repos/${REPO}/actions/workflows/canonical-execution.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | .id' | head -n1)"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download GUI screenshots
        run: |
          set -euo pipefail
          rm -rf /tmp/cloth-gui-screenshots
          mkdir -p /tmp/cloth-gui-screenshots
          gh run download "${{ steps.find-run.outputs.run_id }}" \
            --repo "$REPO" \
            --name cloth-gui-screenshots \
            --dir /tmp/cloth-gui-screenshots
          test -s /tmp/cloth-gui-screenshots/cloth-pattern-design.png
          test -s /tmp/cloth-gui-screenshots/cloth-sewing.png
          test -s /tmp/cloth-gui-screenshots/cloth-simulation-arranged.png
          test -s /tmp/cloth-gui-screenshots/cloth-simulation-draped.png
      - name: Publish screenshots to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" /tmp/freecad-cloth
          cd /tmp/freecad-cloth
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          destination="docs/images/generated/merged-pr-${PR_NUMBER}"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp /tmp/cloth-gui-screenshots/*.png "$destination/"
          git add "$destination"
          if git diff --cached --quiet; then
            commit_sha="$(git rev-parse HEAD)"
          else
            git commit -m "Add GUI screenshots for merged PR #${PR_NUMBER}"
            git push origin HEAD:main
            commit_sha="$(git rev-parse HEAD)"
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
      - name: Post screenshots to the merged PR
        shell: bash
        run: |
          set -euo pipefail
          commit_sha="${{ steps.publish.outputs.commit_sha }}"
          base="../blob/${commit_sha}/docs/images/generated/merged-pr-${PR_NUMBER}"
          marker="<!-- cloth-gui-screenshots:pr-${PR_NUMBER} -->"
          body="${marker}
## GUI screenshots

These screenshots were generated by the FreeCAD GUI workflow for the merged PR.

![Pattern design](${base}/cloth-pattern-design.png?raw=true)

![Sewing](${base}/cloth-sewing.png?raw=true)

![Simulation arranged](${base}/cloth-simulation-arranged.png?raw=true)

![Simulation draped](${base}/cloth-simulation-draped.png?raw=true)"
          existing_id="$(gh api --paginate "/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)"
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "/repos/${REPO}/issues/comments/${existing_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "/repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

  maintenance:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - name: GPT-Tools cleanup of old Actions runs and stale closed-PR branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          repo = __import__('os').environ['REPO']
          cutoff = datetime.now(timezone.utc) - timedelta(hours=24)
          def gh(*args): return subprocess.check_output(['gh', 'api', *args], text=True)
          runs = []
          for page in range(1, 20):
              data = json.loads(gh(f'repos/{repo}/actions/runs?per_page=100&page={page}'))
              page_runs = data.get('workflow_runs', [])
              if not page_runs: break
              runs.extend(page_runs)
              if len(runs) >= data.get('total_count', len(runs)): break
          runs.sort(key=lambda r: r.get('created_at', ''), reverse=True)
          completed = [r for r in runs if r.get('conclusion')]
          deleted_runs = 0
          for run in completed[10:]:
              created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              if created >= cutoff: continue
              subprocess.run(['gh', 'api', '--method', 'DELETE', f"repos/{repo}/actions/runs/{run['id']}"], check=True)
              deleted_runs += 1
          default_branch = json.loads(gh(f'repos/{repo}'))['default_branch']
          open_prs = json.loads(gh(f'repos/{repo}/pulls?state=open&per_page=100'))
          open_heads = {(p.get('head') or {}).get('ref') for p in open_prs}
          closed_prs = []
          for page in range(1, 20):
              page_prs = json.loads(gh(f'repos/{repo}/pulls?state=closed&per_page=100&page={page}'))
              if not page_prs: break
              closed_prs.extend(page_prs)
              if len(page_prs) < 100: break
          deleted_branches = 0
          seen = set()
          for pr in closed_prs:
              head = (pr.get('head') or {}).get('ref')
              closed_at = pr.get('closed_at')
              if not head or head in seen or head == default_branch or head in open_heads or not closed_at: continue
              seen.add(head)
              closed = datetime.fromisoformat(closed_at.replace('Z', '+00:00'))
              if closed >= cutoff: continue
              ref = f'repos/{repo}/git/ref/heads/{head}'
              if subprocess.run(['gh', 'api', ref], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0: continue
              subprocess.run(['gh', 'api', '--method', 'DELETE', f'repos/{repo}/git/refs/heads/{head}'], check=True)
              deleted_branches += 1
          print(json.dumps({'deleted_runs': deleted_runs, 'deleted_closed_pr_branches': deleted_branches}, indent=2))
          PY
