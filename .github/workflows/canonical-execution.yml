name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      FREECAD_BIN: freecad
      CLOTH_TEST_JOBS: 8
      FREECAD_VERSION: 1.1.3
      FREECAD_APPIMAGE_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      QT_X11_NO_MITSHM: 1
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: 1
      FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Keep all cache paths: Actions cache for native fallback, runner-local
      # Docker image cache, GHCR image fallback, and BuildKit registry cache.
      - name: Restore cached FreeCAD runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: |
            freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-

      - name: Detect runner capabilities
        id: runner
        shell: bash
        run: |
          set -u
          missing=()
          for tool in Xvfb xvfb-run openbox xargs timeout; do command -v "$tool" >/dev/null 2>&1 || missing+=("$tool"); done
          if command -v "$FREECAD_BIN" >/dev/null 2>&1 && ((${#missing[@]} == 0)); then
            echo mode=native >> "$GITHUB_OUTPUT"
          elif command -v docker >/dev/null 2>&1; then
            echo mode=docker >> "$GITHUB_OUTPUT"
          else
            echo "No usable native FreeCAD runtime and Docker is unavailable." >&2
            exit 1
          fi
          echo "missing=${missing[*]:-none}"

      - name: Prepare pinned FreeCAD CI image
        if: steps.runner.outputs.mode == 'docker'
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Using runner-local cached image: $IMAGE"
            exit 0
          fi
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1 && timeout 60s docker pull "$IMAGE"; then
            echo "Pulled pinned image from GHCR"
            exit 0
          fi
          echo "GHCR image unavailable; building with registry cache fallback"
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load \
            --tag "$IMAGE" \
            --cache-from type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache \
            --cache-to type=registry,ref=ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:buildcache,mode=max \
            docker/freecad-ci

      - name: Run native tests
        if: steps.runner.outputs.mode == 'native'
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated
          tests=(tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py tests/test_simulation_scene.py tests/test_collisions.py tests/test_freecad_objects.py tests/test_gui_structure.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_avatar_fitting.py tests/test_drape_quality.py tests/test_pattern_sketch.py tests/test_pattern_ir.py tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_simulation_quality.py tests/test_sewing_network_gui_contract.py)
          printf '%s\n' "${tests[@]}" | xargs -P "$CLOTH_TEST_JOBS" -n 1 python3
          python3 -m compileall -q .
          for t in tests/freecad_smoke.py tests/freecad_meshpart_smoke.py tests/freecad_sewing_smoke.py; do
            echo "FREECAD START $t"
            timeout --signal=TERM --kill-after=5s 60s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' bash -lc 'openbox >/tmp/freecad-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; exec "$0" "$1"' "$FREECAD_BIN" "$t"
            echo "FREECAD PASS $t"
          done
          echo "SCREENSHOT START timeout=120s"
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' bash -lc 'openbox >/tmp/freecad-screenshot-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; exec "$0" tests/freecad_screenshot.py' "$FREECAD_BIN"
          echo "SCREENSHOT PASS"

      - name: Run Docker tests
        if: steps.runner.outputs.mode == 'docker'
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated artifacts/freecad-e2e
          CID=""
          cleanup() {
            set +e
            [[ -z "$CID" ]] && return
            docker cp "$CID:/workspace/docs/images/generated/." docs/images/generated/ 2>/dev/null || true
            docker cp "$CID:/workspace/artifacts/freecad-e2e/." artifacts/freecad-e2e/ 2>/dev/null || true
            docker logs "$CID" > artifacts/freecad-e2e/docker-console.log 2>&1 || true
            docker inspect "$CID" > artifacts/freecad-e2e/docker-inspect.json 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          CID="$(docker create --init --entrypoint /bin/bash --shm-size=1g \
            -e DISPLAY=:99 -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated -e CLOTH_E2E_DIR=/workspace/artifacts/freecad-e2e \
            -e PYTHONPATH=/workspace -w /workspace "$IMAGE" \
            -euo pipefail -c '
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              sleep 1
              tests=(tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py tests/test_simulation_scene.py tests/test_collisions.py tests/test_freecad_objects.py tests/test_gui_structure.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_avatar_fitting.py tests/test_drape_quality.py tests/test_pattern_sketch.py tests/test_pattern_ir.py tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_simulation_quality.py tests/test_sewing_network_gui_contract.py)
              for t in "${tests[@]}"; do python3 "$t"; done
              python3 -m compileall -q .
              # Historical workflow ran these directly. Keep that execution
              # path; the timeout is only a bounded hang guard on the runner.
              for t in tests/freecad_smoke.py tests/freecad_meshpart_smoke.py tests/freecad_sewing_smoke.py; do
                echo "FREECAD START $t"
                timeout --signal=TERM --kill-after=5s 60s freecad "$t"
                echo "FREECAD PASS $t"
              done
              echo "SCREENSHOT START timeout=120s"
              timeout --signal=TERM --kill-after=5s 120s freecad tests/freecad_screenshot.py
              echo "SCREENSHOT PASS"
              test -s docs/images/generated/cloth-pattern-design.png
              test -s docs/images/generated/cloth-sewing.png
              test -s docs/images/generated/cloth-simulation.png
            '
          )"
          echo "Copying repository into Docker test container"
          docker cp "$PWD/." "$CID:/workspace/"
          docker start "$CID" >/dev/null
          START_TS=$(date +%s)
          while :; do
            STATE=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || echo missing)
            EXIT_CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null || echo '?')
            ELAPSED=$(( $(date +%s) - START_TS ))
            echo "[host] $(date -Is) state=$STATE exit=$EXIT_CODE elapsed=${ELAPSED}s"
            if [[ "$STATE" == running ]]; then
              # Outer watchdog only: normal runs should finish well before this.
              if (( ELAPSED >= 180 )); then
                echo "Docker test container exceeded 180s watchdog" >&2
                docker logs "$CID" || true
                exit 124
              fi
              sleep 5
            elif [[ "$STATE" == exited ]]; then
              docker logs "$CID" || true
              [[ "$EXIT_CODE" == 0 ]]
              break
            else
              docker inspect "$CID" || true
              exit 125
            fi
          done

      - name: Upload GUI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
          compression-level: 1

      - name: Upload GUI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
            artifacts/freecad-e2e/docker-console.log
            artifacts/freecad-e2e/docker-inspect.json
          if-no-files-found: ignore
          compression-level: 1
