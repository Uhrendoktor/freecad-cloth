name: Canonical execution

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  gui-tunic-smoke:
    name: Fast tunic visual smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Render single draped tunic frame
        env:
          CLOTH_SIMULATION_BACKEND: tissu
          CLOTH_TUNIC_PARTICLE_DISTANCE_MM: 18.0
          CLOTH_TUNIC_SOLVER_ITERATIONS: 8
          CLOTH_TUNIC_SOLVER_SUBSTEPS: 2
          CLOTH_TUNIC_STEPS: 120
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          cat > pr_tunic_smoke.py <<'PY'
          import os
          import types
          import FreeCAD as App
          import FreeCADGui as Gui
          from PySide import QtWidgets

          source = open("/workspace/tests/freecad_simulation_turntable.py", encoding="utf-8").read()
          source = source.split("\ntry:\n    main()", 1)[0]
          mod = types.ModuleType("turntable")
          exec(compile(source, "/workspace/tests/freecad_simulation_turntable.py", "exec"), mod.__dict__, mod.__dict__)
          os.makedirs("/workspace/docs/images/generated", exist_ok=True)
          window = Gui.getMainWindow()
          window.show(); mod.events()
          if "ClothPatternWorkbench" not in Gui.listWorkbenches():
              init_gui = "/workspace/InitGui.py"
              exec(compile(open(init_gui, encoding="utf-8").read(), init_gui, "exec"), globals(), globals())
          mod.events()
          doc = App.newDocument("ClothTunicSmoke")
          try:
              scene, avatar, panels, seam_records, authored, pieces = mod.build_simulation_state(doc)
              authored.ViewObject.Visibility = False
              steps = int(os.environ.get("CLOTH_TUNIC_STEPS", "120"))
              scene.Steps = steps
              doc.recompute(); mod.events()
              if int(scene.Steps) != steps or float(scene.SimulatedTime) <= 0.0 or not bool(scene.FiniteState):
                  raise RuntimeError("simulation did not reach a finite %d-step state" % steps)
              if any(panel.Mesh.CountFacets <= 100 for panel in panels):
                  raise RuntimeError("draped tunic panel mesh is too coarse")
              seam_gap = mod._seam_endpoint_gap(panels, seam_records)
              front, back = pieces
              simulated = {
                  front.Name: mod._boundary_points(panels[0], len(mod._outline(front))),
                  back.Name: mod._boundary_points(panels[1], len(mod._outline(back))),
              }
              mod._seam_overlay(doc, "TunicSeamsSimulated", seam_records, simulated)
              backend = getattr(getattr(scene, "Proxy", None), "_base_or_restore", lambda: None)()
              backend_name = getattr(getattr(backend, "backend", None), "name", "unknown") if backend is not None else "unknown"
              bounds = []
              for panel in panels:
                  box = panel.Mesh.BoundBox
                  bounds.append((float(box.XMin), float(box.XMax), float(box.YMin), float(box.YMax), float(box.ZMin), float(box.ZMax)))
              mod.log("smoke-state backend=%s particles=%d facets=(%d,%d) seam_max_gap_mm=%.2f bounds=%s" % (
                  backend_name, int(scene.ParticleCount), panels[0].Mesh.CountFacets, panels[1].Mesh.CountFacets, seam_gap, bounds,
              ))
              if backend_name != "tissu":
                  raise RuntimeError("visual smoke did not use the Tissu backend")
              view = Gui.activeDocument().activeView()
              view.setCameraType("Orthographic")
              view.viewFront(); view.fitAll(); view.zoomIn(); mod.events()
              avatar.ViewObject.Visibility = False
              mod.save_png(view, "/workspace/docs/images/generated/cloth-simulation-cloth-only.png", "cloth-only diagnostic")
              avatar.ViewObject.Visibility = True
              mod.events()
              mod.save_png(view, "/workspace/docs/images/generated/cloth-simulation-draped-tunic-smoke.png", "draped tunic smoke")
              if seam_gap > 35.0:
                  mod.log("simulation-turntable-fail seam_gap_mm=%.2f" % seam_gap)
              else:
                  mod.log("simulation-turntable-pass")
          finally:
              if doc.Name in App.listDocuments():
                  App.closeDocument(doc.Name)
              mod.events(); window.close()
              app = QtWidgets.QApplication.instance()
              if app is not None:
                  app.quit()
          PY
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 \
            -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" \
            -e CLOTH_TUNIC_PARTICLE_DISTANCE_MM="$CLOTH_TUNIC_PARTICLE_DISTANCE_MM" \
            -e CLOTH_TUNIC_SOLVER_ITERATIONS="$CLOTH_TUNIC_SOLVER_ITERATIONS" \
            -e CLOTH_TUNIC_SOLVER_SUBSTEPS="$CLOTH_TUNIC_SOLVER_SUBSTEPS" \
            -e CLOTH_TUNIC_STEPS="$CLOTH_TUNIC_STEPS" \
            -e CLOTH_TUNIC_CLEARANCE_MM=10.0 -e CLOTH_TUNIC_STITCH_SAMPLES=8 \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 12); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=5s 50s /opt/freecad/AppRun /workspace/pr_tunic_smoke.py
            '
      - name: Validate tunic smoke export
        run: |
          set -euo pipefail
          test -s docs/images/generated/simulation-turntable-progress.log
          grep -q 'smoke-state backend=tissu' docs/images/generated/simulation-turntable-progress.log
          test -s docs/images/generated/cloth-simulation-draped-tunic-smoke.png
          test -s docs/images/generated/cloth-simulation-cloth-only.png
          if grep -q 'simulation-turntable-fail' docs/images/generated/simulation-turntable-progress.log; then
            echo 'Visual artifact captured, but seam convergence gate failed.'
            exit 1
          fi
          grep -q 'simulation-turntable-pass' docs/images/generated/simulation-turntable-progress.log
      - name: Upload tunic visual smoke
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tunic-visual-smoke
          path: |
            docs/images/generated/cloth-simulation-draped-tunic-smoke.png
            docs/images/generated/cloth-simulation-cloth-only.png
            docs/images/generated/simulation-turntable-progress.log
          if-no-files-found: error
          compression-level: 1