name: Canonical execution
run-name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Trusted execution mode; local prefers the self-hosted Docker runner, hosted uses GitHub-hosted runners."
        required: false
        type: choice
        default: local
        options: [local, hosted]
      fallback_source_run:
        description: "Original run ID when invoked as an automatic hosted fallback."
        required: false
        type: string
        default: ""
  schedule:
    - cron: '0 3 * * *'

concurrency:
  # Keep only the newest PR run for each PR; older pushes are obsolete.
  group: ${{ github.event_name == 'pull_request' && format('canonical-pr-{0}', github.event.pull_request.number) || format('canonical-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  CLOTH_CI_RUNNER_MODE: ${{ inputs.runner_mode || (github.event_name == 'pull_request' && 'hosted' || 'local') }}
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  local_runner_readiness:
    name: Selected runner readiness
    if: ${{ github.event_name != 'schedule' }}
    # This is the sole runner-start sentinel. Every substantive workload depends on it.
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 2
    steps:
      - name: Record selected execution mode
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run-id=$GITHUB_RUN_ID"
            echo "runner=$RUNNER_NAME"
            echo "runner-os=$RUNNER_OS"
          } | tee artifacts/runner-mode.txt
      - name: Verify Docker capability on the selected runner
        run: timeout --signal=TERM --kill-after=5s 20s docker info >/dev/null
      - name: Upload selected execution mode evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runner-mode
          path: artifacts/runner-mode.txt
          if-no-files-found: error
          compression-level: 1
  runner_watchdog:
    name: Local runner watchdog with hosted fallback
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.runner_mode != 'hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prefer the local runner, otherwise dispatch hosted mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grace_seconds=45
          interval_seconds=5
          deadline=$((SECONDS + grace_seconds))
          echo "runner-watchdog=local-preferred grace_seconds=$grace_seconds source_run=$GITHUB_RUN_ID"
          while [ "$SECONDS" -lt "$deadline" ]; do
            jobs="$(gh api --paginate "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
            state="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].status // "missing"')"
            conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].conclusion // ""')"
            case "$state/$conclusion" in
              in_progress/*|completed/success)
                echo "runner-watchdog=local-started sentinel_status=$state sentinel_conclusion=$conclusion"
                exit 0
                ;;
              completed/*)
                echo "runner-watchdog=local-start-failed sentinel_status=$state sentinel_conclusion=$conclusion"
                break
                ;;
            esac
            echo "runner-watchdog=waiting sentinel_status=$state sentinel_conclusion=${conclusion:-none} seconds_remaining=$((deadline - SECONDS))"
            sleep "$interval_seconds"
          done

          echo "runner-watchdog=fallback reason=local-sentinel-not-started"
          ref="$GITHUB_REF_NAME"
          gh workflow run canonical-execution.yml \
            --repo "$REPO" \
            --ref "$ref" \
            -f runner_mode=hosted \
            -f fallback_source_run="$GITHUB_RUN_ID"
          echo "runner-watchdog=hosted-dispatch ref=$ref source_run=$GITHUB_RUN_ID"
          sleep 2
          gh api --method POST "repos/$REPO/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null || true
          echo "runner-watchdog=local-run-cancel-requested source_run=$GITHUB_RUN_ID"

  python:
    name: Python and FreeCAD non-GUI tests
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 20
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report canonical runner mode
        run: echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run code validation
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g \
            -e PYTHONPATH=/workspace -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              test "$(python3 -c "import sys; print(sys.version_info[:2])")" = "(3, 12)"
              python3 -m compileall -q .
              for test in \
                tests/test_core.py \
                tests/test_mesh.py \
                tests/test_meshpart_adapter.py \
                tests/test_mesh_validation.py \
                tests/test_avatar_visual_sanity.py \
                tests/test_drape_visual_sanity.py \
                tests/test_xpbd.py \
                tests/test_cloth_solver.py \
                tests/test_side_tasks.py \
                tests/test_collisions.py \
                tests/test_pattern_sketch.py \
                tests/test_pattern_ir.py \
                tests/test_pattern_export_semantics.py \
                tests/test_sketch_authority.py \
                tests/test_sewing_workbench.py \
                tests/test_sewing_correspondence.py \
                tests/test_sewing_commands.py \
                tests/test_sewing_creation_session.py \
                tests/test_sewing_show2d.py \
                tests/test_sewing_network.py \
                tests/test_sewing_network_gui.py \
                tests/test_sewing_network_gui_contract.py \
                tests/test_gui_structure.py \
                tests/test_simulation_scene.py \
                tests/test_simulation_quality.py \
                tests/test_simulation_quality_runtime.py \
                tests/test_avatar_fitting.py \
                tests/test_avatar_shoulder_pose.py \
                tests/test_avatar_hierarchical_pose.py \
                tests/test_humanoid_mesh.py \
                tests/test_drape_quality.py \
                tests/test_freecad_objects.py \
                tests/test_project_structure.py \
                tests/test_cloth_diagnostics.py \
                tests/test_pattern_simulation_adapter.py \
                tests/test_seam_graph.py \
                tests/test_workbench_icons.py \
                tests/test_tunic_audit_contract.py \
                tests/test_readme_visual_contract.py \
                tests/test_freecad_gui_startup_contract.py \
                tests/test_sketcher_bootstrap_contract.py; do
                python3 "$test"
              done
            ')"
          cleanup() {
            set +e
            docker cp "$CID:/tmp/triangle-install.log" artifacts/triangle-install.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  gui-sewing-creation:
    name: Sewing staged creation smoke
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 10
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate generated tunic audit source
        run: |
          set -euo pipefail
          python3 tests/freecad_tunic_audit.py --syntax-check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run staged creation smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SEWING_SMOKE_LOG=/workspace/artifacts/sewing-creation-smoke.log \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_sewing_creation_smoke.py
              test -s /workspace/artifacts/sewing-creation-smoke.log
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Inspect smoke evidence
        run: |
          set -euo pipefail
          grep -q 'preview-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'selection-count-rejection=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-same-piece-preview=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-mn-partition-preview=passed' artifacts/sewing-creation-smoke.log
          grep -q 'curved-sampling=passed' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn=passed members=2,2 segments=3 physical-length=proportional' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn-reversal=passed segments=3' artifacts/sewing-creation-smoke.log
          grep -q 'correspondence-gui-evidence=passed severity=info' artifacts/sewing-creation-smoke.log
          grep -q 'seam-visual-3d=passed' artifacts/sewing-creation-smoke.log
          grep -q 'seam-visual-2d=passed top-view=true' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn-save-reload=passed same-endpoint-pairs=true' artifacts/sewing-creation-smoke.log
          grep -q 'stale-endpoint-invalidation=passed commit-blocked=true' artifacts/sewing-creation-smoke.log
      - name: Upload sewing creation smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sewing-creation-smoke
          path: artifacts/sewing-creation-smoke.log
          if-no-files-found: error
          compression-level: 1

  gui-sketcher-acceptance:
    name: Native Sketcher seam presentation acceptance
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 10
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run native Sketcher acceptance
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e FREECAD_USER_HOME=/tmp/freecad-user \
            -e FREECAD_USER_DATA=/tmp/freecad-user-data \
            -e FREECAD_USER_TEMP=/tmp/freecad-user-temp \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e SKETCHER_STAGE_FILE=/workspace/artifacts/sketcher-stage.log \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /tmp "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              rm -rf "$FREECAD_USER_HOME" "$FREECAD_USER_DATA" "$FREECAD_USER_TEMP"
              mkdir -p "$FREECAD_USER_HOME" "$FREECAD_USER_DATA" "$FREECAD_USER_TEMP" "$XDG_RUNTIME_DIR" /workspace/artifacts
              rm -rf /tmp/freecad-mod
              mkdir -p /tmp/freecad-mod/freecad-cloth
              cp -a /workspace/package.xml /workspace/resources /workspace/freecad_cloth /workspace/freecad /tmp/freecad-mod/freecad-cloth/
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_sketcher_acceptance.py > /workspace/artifacts/sketcher-acceptance.log 2>&1
              grep -q "native Sketcher acceptance passed" /workspace/artifacts/sketcher-acceptance.log
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Inspect Sketcher evidence
        run: |
          set -euo pipefail
          test -s artifacts/sketcher-acceptance.log
          grep -q "native Sketcher acceptance passed" artifacts/sketcher-acceptance.log
      - name: Upload Sketcher acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sketcher-acceptance
          path: |
            artifacts/sketcher-acceptance.log
            artifacts/sketcher-stage.log
          if-no-files-found: error
          compression-level: 1
  gui-pattern-export:
    name: Pattern production export smoke
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 10
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run public export smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g             -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth             -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1             -e CLOTH_PATTERN_EXPORT_LOG=/workspace/artifacts/pattern-production-export.log             -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_pattern_export_smoke.py
              test -s /workspace/artifacts/pattern-production-export.log
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Inspect export evidence
        run: |
          set -euo pipefail
          grep -q 'pattern-export=passed formats=SVG,DXF' artifacts/pattern-production-export.log
          grep -q 'pattern-export-smoke=completed' artifacts/pattern-production-export.log
      - name: Upload pattern export evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pattern-production-export
          path: artifacts/pattern-production-export.log
          if-no-files-found: error
          compression-level: 1

  gui-tunic-visual:
    name: Full tunic visual and simulation audit
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 20
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build patched FreeCAD image for tunic validation
        run: |
          set -euo pipefail
          docker build --pull -t freecad-ci:tissu-patched docker/freecad-ci
          echo "FREECAD_IMAGE=freecad-ci:tissu-patched" >> "$GITHUB_ENV"
      - name: Verify patched Tissu provenance
        run: |
          set -euo pipefail
          docker run --rm freecad-ci:tissu-patched cat /opt/tissu-provenance.txt
          grep -q 'tissu-source-commit=c28a3c7504ddc782bef844ab5bd4cd0bde14b628' <(docker run --rm freecad-ci:tissu-patched cat /opt/tissu-provenance.txt)
          grep -q 'tissu-cpp-regression-result=passed' <(docker run --rm freecad-ci:tissu-patched cat /opt/tissu-provenance.txt)
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run native-Sketcher tunic audit
        env:
          CLOTH_SIMULATION_BACKEND: tissu
          CLOTH_TISSU_SUBSTEPS: 1
          CLOTH_TISSU_COLLISION_MODE: mesh
          CLOTH_TISSU_COLLISION_TRIANGLES: 2048
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" \
            -e CLOTH_TISSU_SUBSTEPS="$CLOTH_TISSU_SUBSTEPS" \
            -e CLOTH_TISSU_COLLISION_MODE="$CLOTH_TISSU_COLLISION_MODE" \
            -e CLOTH_TISSU_COLLISION_TRIANGLES="$CLOTH_TISSU_COLLISION_TRIANGLES" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 12); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_tunic_audit_production.py
              timeout --signal=TERM --kill-after=10s 60s /opt/freecad/AppRun /workspace/tests/freecad_realtime_benchmark.py
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Validate visual and simulation evidence
        run: |
          set -euo pipefail
          test -s docs/images/generated/gui-progress.log
          test -s artifacts/freecad-realtime/metrics.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/freecad-realtime/metrics.json").read_text(encoding="utf-8"))
          assert m["finite"], m
          assert m["mean_frame_ms"] <= m["frame_budget_ms"], m
          assert m["p95_frame_ms"] <= 50.0, m
          print("realtime-performance=passed mean_frame_ms=%.2f p95_frame_ms=%.2f fps=%.2f particles=%d" % (m["mean_frame_ms"], m["p95_frame_ms"], m["fps_mean"], m["particles"]))
          PY
          grep -q 'scenario-pass' docs/images/generated/gui-progress.log
          grep -q 'realtime-preview=passed backend=tissu' docs/images/generated/gui-progress.log
          grep -q 'drape-metrics=' docs/images/generated/gui-progress.log
          test -s docs/images/generated/cloth-simulation-draped.png
          test -s docs/images/generated/cloth-simulation-draped-front.png
          test -s docs/images/generated/cloth-simulation-draped-rear.png
          test -s docs/images/generated/cloth-simulation-draped-left.png
          test -s docs/images/generated/cloth-simulation-draped-right.png
          test -s docs/images/generated/cloth-simulation-draped-top.png
          test -s docs/images/generated/cloth-simulation-draped-bottom.png
          test -s docs/images/generated/cloth-simulation-draped-diagnostics.png
          grep -q 'diagnostic-map=passed metric=stress' docs/images/generated/gui-progress.log
          grep -q 'diagnostic-stale-guard=passed' docs/images/generated/gui-progress.log
          test -s artifacts/garment-e2e.log
          grep -q 'staged-selection=passed' artifacts/garment-e2e.log
          grep -q 'sewing-mn=passed sides=2,2 segments=2' artifacts/garment-e2e.log
          grep -q 'sewing-mn-physical=passed curved-edge=true proportional=true' artifacts/garment-e2e.log
          grep -q 'seam-markers=passed 3d-and-2d=true' artifacts/garment-e2e.log
          grep -q 'arrangement=passed pieces=4' artifacts/garment-e2e.log
          grep -q 'garment-hierarchy=passed groups=Patterns,Sewing,Fabric,Avatar,Simulation' artifacts/garment-e2e.log
          grep -q 'material-presentation=passed native=true' artifacts/garment-e2e.log
          grep -q 'drape-target=passed type=Mannequin' artifacts/garment-e2e.log
          grep -q 'diagnostics=passed metric=stress' artifacts/garment-e2e.log
          grep -q 'save-reload=passed pieces=4 seam=1to1 network=2segment' artifacts/garment-e2e.log
          grep -q 'invalidation=passed seam=' artifacts/garment-e2e.log
          grep -q 'invalidation-restore=passed seam=Valid' artifacts/garment-e2e.log
          grep -q 'stale-export=blocked' artifacts/garment-e2e.log
          grep -q 'diagnostics-after-invalidation=passed metric=stress' artifacts/garment-e2e.log
          grep -q 'determinism-signature=passed' artifacts/garment-e2e.log
          grep -q 'pattern-export=passed formats=SVG,DXF' artifacts/garment-e2e.log
          grep -q 'canonical garment end-to-end acceptance passed' artifacts/garment-e2e.log
      - name: Upload tunic visual audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tunic-visual-audit
          path: |
            docs/images/generated/cloth-simulation-draped*.png
            docs/images/generated/drape-visual-metrics.json
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
            artifacts/garment-e2e.log
          if-no-files-found: error
          compression-level: 1

  gui-turntables:
    name: README simulation turntable
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 25
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Render avatar and blanket turntable frames
        env:
          CLOTH_SIMULATION_BACKEND: tissu
          CLOTH_TISSU_SUBSTEPS: 10
          CLOTH_TISSU_COLLISION_MODE: mesh
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" \
            -e CLOTH_TISSU_SUBSTEPS="$CLOTH_TISSU_SUBSTEPS" -e CLOTH_TISSU_COLLISION_MODE="$CLOTH_TISSU_COLLISION_MODE" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /tmp "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_avatar_screenshot.py
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_simulation_turntable.py
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Validate turntable frame counts on restored workspace
        run: |
          set -euo pipefail
          test "$(find docs/images/generated/cloth-avatar-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-simulation-arranged-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-simulation-draped-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73

      - name: Validate blanket motion and camera evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          log = Path("docs/images/generated/simulation-turntable-progress.log").read_text(encoding="utf-8")
          for marker in (
              "stage=scene-build-pass",
              "stage=arranged-render-pass",
              "stage=simulation-pass",
              "stage=validation-pass",
              "stage=draped-render-pass",
              "stage=total-pass",
          ):
            if marker not in log: raise SystemExit("missing timing marker: "+marker)
          if "stage=validation-pass state=structurally-plausible" not in log:
            raise SystemExit("drape gate did not remain structurally-plausible")
          m = re.findall(r"blanket-motion-diagnostic max_centroid_displacement_mm=([+-]?[0-9.]+).*min_z_mm=([+-]?[0-9.]+).*cube_top_z_mm=([+-]?[0-9.]+)", log)
          if not m: raise SystemExit("missing blanket motion diagnostic")
          displacement, minimum_z, cube_top = (float(x) for x in m[-1])
          if displacement < 40.0: raise SystemExit("blanket displacement below 40 mm")
          if minimum_z > cube_top + 35.0: raise SystemExit("blanket did not approach cube")
          if "blanket-turntable-pass" not in log: raise SystemExit("blanket turntable incomplete")
          if "mesh-quality=passed" not in log: raise SystemExit("blanket mesh-quality evidence missing")
          for directory in ("cloth-avatar-turntable-frames","cloth-simulation-arranged-turntable-frames","cloth-simulation-draped-turntable-frames"):
            hashes=[]
            frames=sorted((Path("docs/images/generated")/directory).glob("frame-*.png"))
            if len(frames) != 73: raise SystemExit("unexpected frame count for "+directory)
            for frame_path in frames:
              hashes.append(hashlib.sha256(frame_path.read_bytes()).hexdigest())
            if len(set(hashes)) != 73: raise SystemExit("all 73 frames are not distinct for "+directory)
            checkpoints=[]
            for frame in (0,18,36,54):
              p=Path("docs/images/generated")/directory/("frame-%03d.png"%frame)
              if not p.is_file(): raise SystemExit("missing "+str(p))
              checkpoints.append(hashlib.sha256(p.read_bytes()).hexdigest())
            if len(set(checkpoints)) != 4: raise SystemExit("camera checkpoints not distinct for "+directory)
          PY
      - name: Build README turntable GIFs
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then IM=(magick)
          elif command -v convert >/dev/null 2>&1; then IM=(convert)
          else sudo apt-get update && sudo apt-get install -y imagemagick && IM=(convert)
          fi
          for spec in \
            "cloth-avatar-turntable-frames cloth-avatar-turntable.gif" \
            "cloth-simulation-arranged-turntable-frames cloth-simulation-arranged-turntable.gif" \
            "cloth-simulation-draped-turntable-frames cloth-simulation-draped-turntable.gif"; do
            read -r frame_dir gif <<< "$spec"
            "${IM[@]}" -delay 8 "docs/images/generated/$frame_dir"/frame-*.png \
              -loop 0 -colors 128 \
              "docs/images/generated/$gif"
            test -s "docs/images/generated/$gif"
            frame_delays="$(identify -format '%T\n' "docs/images/generated/$gif" | sort -u)"
            test "$frame_delays" = "8"
          done
          for gif in \
            docs/images/generated/cloth-avatar-turntable.gif \
            docs/images/generated/cloth-simulation-arranged-turntable.gif \
            docs/images/generated/cloth-simulation-draped-turntable.gif; do
            identify -format '%n\n' "$gif" | head -n 1 | grep -qx '73'
          done
      - name: Upload README turntable evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: readme-turntables
          path: |
            docs/images/generated/cloth-avatar-turntable.gif
            docs/images/generated/cloth-simulation-arranged-turntable.gif
            docs/images/generated/cloth-simulation-draped-turntable.gif
            docs/images/generated/cloth-avatar-turntable-frames/frame-000.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-018.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-036.png
            docs/images/generated/cloth-avatar-turntable-frames/frame-054.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-000.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-018.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-036.png
            docs/images/generated/cloth-simulation-arranged-turntable-frames/frame-054.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-000.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-018.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-036.png
            docs/images/generated/cloth-simulation-draped-turntable-frames/frame-054.png
            docs/images/generated/avatar-gui-progress.log
            docs/images/generated/simulation-turntable-progress.log
          if-no-files-found: ignore
          compression-level: 1


