name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  PIXELFLUX_WAYLAND: false
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

jobs:
  python:
    name: Python and FreeCAD non-GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && timeout 90s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" docker/freecad-ci
      - name: Run Python tests in Docker
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            python3 -m compileall -q .
            for test in tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_mesh_validation.py tests/test_avatar_visual_sanity.py tests/test_drape_visual_sanity.py tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py tests/test_collisions.py tests/test_pattern_sketch.py tests/test_pattern_ir.py tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_sewing_network_gui_contract.py tests/test_gui_structure.py tests/test_simulation_scene.py tests/test_simulation_quality.py tests/test_avatar_fitting.py tests/test_avatar_shoulder_pose.py tests/test_avatar_hierarchical_pose.py tests/test_humanoid_mesh.py tests/test_drape_quality.py tests/test_freecad_objects.py tests/test_project_structure.py; do python3 "$test"; done
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  gui-screenshot:
    name: FreeCAD GUI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && timeout 90s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" docker/freecad-ci
      - name: Launch FreeCAD GUI and export screenshots in Docker
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          rm -rf docs/images/generated artifacts/freecad-gui
          mkdir -p docs/images/generated artifacts/freecad-gui
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            export PATH="/opt/freecad/bin:$PATH"
            mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
            Xvfb :99 -screen 0 1600x1200x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
            XVFB_PID=$!
            trap "kill $XVFB_PID >/dev/null 2>&1 || true" EXIT
            for i in $(seq 1 40); do
              if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
              sleep 0.25
            done
            python3 tests/freecad_avatar_screenshot.py
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
          docker cp "$CID:/workspace/docs/images/generated/." docs/images/generated/
      - name: Validate exported screenshots
        run: python3 tests/validate_generated_screenshots.py docs/images/generated
      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: freecad-gui-screenshots
          path: docs/images/generated
          if-no-files-found: error
      - name: Upload GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freecad-gui-diagnostics
          path: /tmp/xvfb.log
          if-no-files-found: ignore
