name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      FREECAD_BIN: freecad
      CLOTH_TEST_JOBS: 8
      FREECAD_VERSION: 1.1.3
      FREECAD_APPIMAGE_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
      QT_X11_NO_MITSHM: 1
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore cached FreeCAD runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/freecad-cloth/${{ env.FREECAD_VERSION }}
          key: freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-${{ env.FREECAD_APPIMAGE_SHA256 }}
          restore-keys: |
            freecad-${{ runner.os }}-${{ runner.arch }}-${{ env.FREECAD_VERSION }}-

      - name: Prepare self-hosted FreeCAD runtime
        run: |
          set -euo pipefail
          for tool in Xvfb xvfb-run openbox curl xargs timeout sha256sum; do
            command -v "$tool" >/dev/null || { echo "Missing runner utility: $tool" >&2; exit 1; }
          done
          if command -v "$FREECAD_BIN" >/dev/null 2>&1; then
            echo "Using runner-provided FreeCAD: $(command -v "$FREECAD_BIN")"
            echo "FREECAD_SOURCE=runner" >> "$GITHUB_ENV"
          else
            cache_root="$HOME/.cache/freecad-cloth/$FREECAD_VERSION"
            appimage="$cache_root/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
            appdir="$cache_root/squashfs-root"
            mkdir -p "$cache_root"
            if [[ ! -x "$appdir/AppRun" ]]; then
              if [[ ! -f "$appimage" ]]; then
                echo "Downloading pinned FreeCAD $FREECAD_VERSION AppImage"
                curl --fail --location --retry 3 --retry-delay 2 -o "$appimage" "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
              fi
              echo "$FREECAD_APPIMAGE_SHA256  $appimage" | sha256sum -c -
              rm -rf "$appdir" "$cache_root/.squashfs-root.tmp"
              mkdir -p "$cache_root/.squashfs-root.tmp"
              (cd "$cache_root/.squashfs-root.tmp" && "$appimage" --appimage-extract >/dev/null)
              mv "$cache_root/.squashfs-root.tmp/squashfs-root" "$appdir"
              rm -rf "$cache_root/.squashfs-root.tmp"
            fi
            echo "FREECAD_BIN=$appdir/AppRun" >> "$GITHUB_ENV"
            echo "FREECAD_SOURCE=actions-cache" >> "$GITHUB_ENV"
          fi
          if command -v python3 >/dev/null 2>&1; then
            echo "PYTHON_TEST_MODE=system" >> "$GITHUB_ENV"
          else
            echo "PYTHON_TEST_MODE=freecad" >> "$GITHUB_ENV"
          fi

      - name: Validate self-hosted runtime
        run: |
          set -euo pipefail
          for tool in Xvfb xvfb-run openbox xargs timeout; do command -v "$tool" >/dev/null || exit 1; done
          command -v "$FREECAD_BIN" >/dev/null || { echo "Missing FreeCAD: $FREECAD_BIN" >&2; exit 1; }
          echo "Runner: $(hostname)"
          echo "FreeCAD source: $FREECAD_SOURCE"
          echo "Python test mode: $PYTHON_TEST_MODE"
          echo "FreeCAD: $(command -v "$FREECAD_BIN")"
          "$FREECAD_BIN" --version || true
          if [[ "$PYTHON_TEST_MODE" == "system" ]]; then
            python3 --version
          else
            "$FREECAD_BIN" --console <<'PY'
            import sys
            print("Embedded Python:", sys.version)
            PY
          fi

      - name: Run Python and FreeCAD smoke tests
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated artifacts/freecad-e2e
          rm -f docs/images/generated/*.png docs/images/generated/gui-progress.log docs/images/generated/gui-screenshot-manifest.txt
          tests=(
            tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py
            tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py
            tests/test_simulation_scene.py tests/test_collisions.py tests/test_freecad_objects.py
            tests/test_gui_structure.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py
            tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_avatar_fitting.py
            tests/test_drape_quality.py tests/test_pattern_sketch.py tests/test_pattern_ir.py
            tests/test_pattern_export_semantics.py tests/test_sketch_authority.py
            tests/test_simulation_quality.py tests/test_sewing_network_gui_contract.py
          )
          if [[ "$PYTHON_TEST_MODE" == "system" ]]; then
            printf '%s\n' "${tests[@]}" | xargs -P "${CLOTH_TEST_JOBS}" -n 1 python3
            python3 -m compileall -q .
          else
            for t in "${tests[@]}"; do
              echo "PYTHON/FREECAD START $t"
              timeout --signal=TERM --kill-after=5s 60s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' bash -lc 'openbox >/tmp/freecad-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; exec "$0" "$1"' "$FREECAD_BIN" "$t"
              echo "PYTHON/FREECAD PASS $t"
            done
            timeout --signal=TERM --kill-after=5s 60s "$FREECAD_BIN" --console <<'PY'
            import compileall, sys
            sys.exit(0 if compileall.compile_dir('.', quiet=1) else 1)
            PY
          fi
          for t in tests/freecad_smoke.py tests/freecad_meshpart_smoke.py tests/freecad_sewing_smoke.py; do
            echo "FREECAD START $t"
            timeout --signal=TERM --kill-after=5s 60s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' bash -lc 'openbox >/tmp/freecad-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; exec "$0" "$1"' "$FREECAD_BIN" "$t"
            echo "FREECAD PASS $t"
          done

      - name: Run GUI screenshots
        if: ${{ always() }}
        env:
          CLOTH_REPO_ROOT: ${{ github.workspace }}
          CLOTH_SCREENSHOT_DIR: ${{ github.workspace }}/docs/images/generated
        run: |
          set -euo pipefail
          mkdir -p "$CLOTH_SCREENSHOT_DIR"
          screenshot_script="$RUNNER_TEMP/freecad_screenshot.py"
          sed "s#REPO_ROOT = \"/workspace\"#REPO_ROOT = os.environ.get(\"CLOTH_REPO_ROOT\", os.getcwd())#" tests/freecad_screenshot.py > "$screenshot_script"
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a -s '-screen 0 1280x720x24 -nolisten tcp' bash -lc 'openbox >/tmp/freecad-screenshot-openbox.log 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; exec "$0" "$1"' "$FREECAD_BIN" "$screenshot_script"
          test -s "$CLOTH_SCREENSHOT_DIR/cloth-pattern-design.png"
          test -s "$CLOTH_SCREENSHOT_DIR/cloth-sewing.png"
          test -s "$CLOTH_SCREENSHOT_DIR/cloth-simulation.png"

      - name: Upload GUI screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
          compression-level: 1

      - name: Upload GUI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
            artifacts/freecad-e2e/workflow.log
            /tmp/freecad-openbox.log
            /tmp/freecad-screenshot-openbox.log
          if-no-files-found: ignore
          compression-level: 1
