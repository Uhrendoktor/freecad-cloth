name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  PIXELFLUX_WAYLAND: false
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

jobs:
  python:
    name: Python and FreeCAD non-GUI tests
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && timeout 90s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" docker/freecad-ci
      - name: Run Python tests in Docker
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e PYTHONPATH=/workspace -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            python3 -m compileall -q .
            for test in tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py tests/test_collisions.py tests/test_pattern_sketch.py tests/test_pattern_ir.py tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_sewing_network_gui_contract.py tests/test_gui_structure.py tests/test_simulation_scene.py tests/test_simulation_quality.py tests/test_avatar_fitting.py tests/test_drape_quality.py tests/test_freecad_objects.py; do python3 "$test"; done
          ')"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  gui-screenshot:
    name: FreeCAD GUI screenshots
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && timeout 90s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" docker/freecad-ci
      - name: Launch FreeCAD GUI and export screenshots in Docker
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          rm -rf docs/images/generated artifacts/freecad-gui
          mkdir -p docs/images/generated artifacts/freecad-gui
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
            Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
            openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
            trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display :99 >/dev/null 2>&1
            timeout --signal=TERM --kill-after=10s 60s /opt/freecad/AppRun tests/freecad_screenshot.py
            test -s docs/images/generated/cloth-pattern-design.png
            test -s docs/images/generated/cloth-sewing.png
            test -s docs/images/generated/cloth-simulation-arranged.png
            test -s docs/images/generated/cloth-simulation-draped.png
          ')"
          cleanup() { set +e; docker cp "$CID:/workspace/docs/images/generated/." docs/images/generated/ 2>/dev/null || true; docker rm -f "$CID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
      - name: Validate exported screenshots
        run: |
          set -euo pipefail
          for image in docs/images/generated/*.png; do python3 -c 'import os,struct,sys; p=sys.argv[1]; d=open(p,"rb").read(24); assert d[:8]==b"\x89PNG\r\n\x1a\n"; w,h=struct.unpack(">II",d[16:24]); assert (w,h)==(1280,720); assert os.path.getsize(p)>=20000' "$image"; done
      - name: Upload GUI screenshots
        if: ${{ success() && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v6
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
          compression-level: 1
      - name: Upload GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloth-gui-diagnostics
          path: artifacts/freecad-gui
          if-no-files-found: ignore
          compression-level: 1

  publish-merged-pr-screenshots:
    name: Publish merged PR GUI screenshots
    needs: gui-screenshot
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 10
    steps:
      - name: Locate merged PR for main commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          number="$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | .[0].number // empty')"
          if [ -z "$number" ]; then
            echo "No merged PR is associated with main commit $SHA; nothing to publish."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Download canonical GUI screenshots
        if: ${{ steps.pr.outputs.number != '' }}
        uses: actions/download-artifact@v6
        with:
          name: cloth-gui-screenshots
          path: gui-screenshots
      - name: Validate screenshot set
        if: ${{ steps.pr.outputs.number != '' }}
        run: |
          set -euo pipefail
          for image in cloth-pattern-design.png cloth-sewing.png cloth-simulation-arranged.png cloth-simulation-draped.png; do
            test -s "gui-screenshots/$image"
          done
      - name: Publish screenshots to PR-specific branch
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" screenshot-repo
          cd screenshot-repo
          branch="ci/pr-${PR_NUMBER}-screenshots"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p docs/images/generated
          cp ../gui-screenshots/*.png docs/images/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/generated/*.png
          git commit -m "ci: publish PR ${PR_NUMBER} GUI screenshots" || true
          git push --force origin "HEAD:$branch"
      - name: Comment merged PR with rendered screenshots
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          branch="ci/pr-${PR_NUMBER}-screenshots"
          raw_base="$SERVER_URL/$REPO/raw/refs/heads/$branch/docs/images/generated"
          marker="<!-- canonical-gui-screenshots:${PR_NUMBER} -->"
          body=$(cat <<EOF
          $marker
          ## Canonical GUI screenshots

          The merged PR passed the canonical FreeCAD/Xvfb GUI acceptance run. The generated screenshots are rendered below.

          ### Pattern design
          ![cloth-pattern-design.png]($raw_base/cloth-pattern-design.png)

          ### Sewing
          ![cloth-sewing.png]($raw_base/cloth-sewing.png)

          ### Simulation arranged
          ![cloth-simulation-arranged.png]($raw_base/cloth-simulation-arranged.png)

          ### Simulation draped
          ![cloth-simulation-draped.png]($raw_base/cloth-simulation-draped.png)
          EOF
          )
          existing="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json comments --jq '.comments[].body' | grep -F "$marker" || true)"
          if [ -n "$existing" ]; then
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
