name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_meshpart_adapter.py
          python tests/test_xpbd.py
          python tests/test_cloth_solver.py
          python tests/test_side_tasks.py
          python tests/test_simulation_scene.py
          python tests/test_collisions.py
          python tests/test_freecad_objects.py
          python tests/test_gui_structure.py
          python tests/test_sewing_workbench.py
          python tests/test_avatar_fitting.py
          python tests/test_drape_quality.py
          python tests/test_pattern_sketch.py
      - name: Reference drape benchmark
        run: python tests/benchmark_drape.py
      - name: Upload reference drape benchmark
        uses: actions/upload-artifact@v4
        with:
          name: drape-benchmark-${{ matrix.python }}
          path: artifacts/drape-benchmark.json
          if-no-files-found: error
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
          test -f PatternGui.py
          test -f SimulationGui.py
          test -f SewingGui.py
          test -f SewingObjects.py

  freecad-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real FreeCAD runtime in Debian trixie
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad
              freecadcmd --version
              freecadcmd tests/freecad_smoke.py
              freecadcmd tests/freecad_meshpart_smoke.py
            '

  gui-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate FreeCAD GUI screenshots under Xvfb
        run: |
          mkdir -p "$PWD/docs/images/generated"
          docker run --rm \
            -e DISPLAY=:99 \
            -e QT_X11_NO_MITSHM=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e QT_QPA_PLATFORM=xcb \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad xvfb openbox
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
              XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 &
              OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              sleep 2
              printf "%s\n" "exec(compile(open(\"tests/freecad_screenshot.py\", encoding=\"utf-8\").read(), \"tests/freecad_screenshot.py\", \"exec\"))" > /tmp/cloth_screenshot.FCMacro
              freecad /tmp/cloth_screenshot.FCMacro >/tmp/freecad-gui.log 2>&1 &
              FREECAD_PID=$!
              for i in $(seq 1 30); do
                if test -s docs/images/generated/cloth-pattern.png && test -s docs/images/generated/cloth-simulation.png; then
                  break
                fi
                if ! kill -0 $FREECAD_PID 2>/dev/null; then
                  cat /tmp/freecad-gui.log
                  cat /tmp/xvfb.log || true
                  cat /tmp/openbox.log || true
                  exit 1
                fi
                sleep 1
              done
              if ! test -s docs/images/generated/cloth-pattern.png || ! test -s docs/images/generated/cloth-simulation.png; then
                echo "FreeCAD remained alive but did not generate both screenshots within 30 seconds"
                cat /tmp/freecad-gui.log || true
                exit 1
              fi
              test -s docs/images/generated/cloth-pattern.png
              test -s docs/images/generated/cloth-simulation.png
              kill $FREECAD_PID 2>/dev/null || true
              wait $FREECAD_PID 2>/dev/null || true
            '
      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error

  cleanup-merged-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test, freecad-smoke, gui-screenshots]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete recently merged PR source branches after green main validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state merged --base main --limit 20 --json headRefName --jq '.[].headRefName' |
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            [ "$branch" = "main" ] && continue
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "deleted merged source branch: $branch"
            fi
          done
