          cp ../blanket/blanket-motion.gif docs/images/generated/cloth-blanket-motion.gif
          cp ../tunic/docs/images/generated/cloth-tunic-mannequin-motion.gif docs/images/generated/cloth-tunic-mannequin-motion.gif
          cp ../tunic/docs/images/generated/cloth-pattern-design.png docs/images/generated/cloth-pattern-design.png
          cp ../tunic/docs/images/generated/cloth-sewing.png docs/images/generated/cloth-sewing.png
