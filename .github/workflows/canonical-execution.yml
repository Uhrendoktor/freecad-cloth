name: Canonical execution
run-name: Canonical execution

on:
  # PR synchronize is the canonical gate for feature branches; push is reserved for main.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Trusted execution mode; local prefers the self-hosted Docker runner, hosted uses GitHub-hosted runners."
        required: false
        type: choice
        default: local
        options: [local, hosted]
      fallback_source_run:
        description: "Original run ID when invoked as an automatic hosted fallback."
        required: false
        type: string
        default: ""
      diagnostic_controls:
        description: "Run diagnostic-only PositionBasedDynamics contact controls; never part of release-gate dependencies."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

concurrency:
  # One agent owns a PR; superseded runs are stale evidence and may be cancelled.
  group: ${{ github.event_name == 'pull_request' && format('canonical-pr-{0}', github.event.pull_request.number) || format('canonical-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  CLOTH_CI_RUNNER_MODE: ${{ inputs.runner_mode || (github.event_name == 'pull_request' && 'hosted' || 'local') }}
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  agent-quality:
    name: Agent-oriented static and property gates
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development toolchain
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run agent-oriented static gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python tools/check_documentation_contract.py
          lint-imports
          pyright -p pyrightconfig.agent-strict.json
          mapfile -t changed_python < <(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py')
          if ((${#changed_python[@]})); then
            python tools/check_dead_code.py "${changed_python[@]}"
          fi
          python -m pytest -q tests/test_property_contracts.py
          crosshair check --analysis_kind asserts tools/crosshair_contracts.py

  duplication:
    name: New Python duplication gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject newly introduced clones
        uses: kucherenko/jscpd@v5
        with:
          path: "freecad_cloth tools"
          format: "python"
          min-lines: "8"
          min-tokens: "70"
          baseline-from-ref: "origin/${{ github.base_ref }}"
          fail-on-new-clones: "true"
          fail-on-empty: "true"

  python:
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 20
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report canonical runner mode
        run: echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run code validation
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g \
            -e PYTHONPATH=/workspace -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 hypothesis==6.168.3 >/tmp/triangle-install.log 2>&1
              python3 -c "import triangle, hypothesis; print(triangle.__file__); print(hypothesis.__version__)" >>/tmp/triangle-install.log 2>&1
              test "$(python3 -c "import sys; print(sys.version_info[:2])")" = "(3, 12)"
              python3 -m compileall -q .
              python3 -m pytest --version

              # Files with explicit script entry points retain direct execution.
              for test in \
                tests/test_core.py \
                tests/test_mesh.py \
                tests/test_meshpart_adapter.py \
                tests/test_mesh_validation.py \
                tests/test_avatar_visual_sanity.py \
                tests/test_drape_visual_sanity.py \
                tests/test_cloth_solver.py \
                tests/test_pattern_sketch.py \
                tests/test_pattern_ir.py \
                tests/test_sketch_authority.py \
                tests/test_sewing_workbench.py \
                tests/test_sewing_creation_session.py \
                tests/test_sewing_show2d.py \
                tests/test_sewing_network.py \
                tests/test_sewing_network_gui.py \
                tests/test_sewing_network_gui_contract.py \
                tests/test_simulation_quality.py \
                tests/test_avatar_fitting.py \
                tests/test_avatar_shoulder_pose.py \
                tests/test_avatar_hierarchical_pose.py \
                tests/test_humanoid_mesh.py \
                tests/test_freecad_objects.py \
                tests/test_pattern_simulation_adapter.py \
                tests/test_freecad_gui_startup_contract.py; do
                echo "running-script-test=$test"
              python3 "$test"
              done

              # Pytest-style modules have no script runner; execute the tests explicitly.
              echo "running-pytest-suite"
              python3 -m pytest -q \
                tests/test_side_tasks.py \
                tests/test_pattern_export_semantics.py \
                tests/test_sewing_correspondence.py \
                tests/test_sewing_commands.py \
                tests/test_gui_structure.py \
                tests/test_simulation_scene.py \
                tests/test_simulation_quality_runtime.py \
                tests/test_project_structure.py \
                tests/test_agent_context_contract.py \
                tests/test_cloth_diagnostics.py \
                tests/test_seam_graph.py \
                tests/test_workbench_icons.py \
                tests/test_tunic_audit_contract.py \
                tests/test_readme_visual_contract.py \
                tests/test_sketcher_bootstrap_contract.py \
                tests/test_canonical_python_validation_contract.py \
                tests/test_pbd_contact_diagnostics_contract.py \
                tests/test_pbd_avatar_ladder_contract.py \
                tests/test_property_contracts.py
            ')"
          cleanup() {
            set +e
            docker cp "$CID:/tmp/triangle-install.log" artifacts/triangle-install.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  local_runner_readiness:
    name: Selected runner readiness
    if: ${{ github.event_name != 'schedule' }}
    # This is the sole runner-start sentinel. Every substantive workload depends on it.
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 2
    steps:
      - name: Record selected execution mode
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run-id=$GITHUB_RUN_ID"
            echo "runner=$RUNNER_NAME"
            echo "runner-os=$RUNNER_OS"
          } | tee artifacts/runner-mode.txt
      - name: Verify Docker capability on the selected runner
        run: timeout --signal=TERM --kill-after=5s 20s docker info >/dev/null
      - name: Upload selected execution mode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mode
          path: artifacts/runner-mode.txt
          if-no-files-found: error
          compression-level: 1
  runner_watchdog:
    name: Local runner watchdog with hosted fallback
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.runner_mode != 'hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prefer the local runner, otherwise dispatch hosted mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grace_seconds=45
          interval_seconds=5
          deadline=$((SECONDS + grace_seconds))
          echo "runner-watchdog=local-preferred grace_seconds=$grace_seconds source_run=$GITHUB_RUN_ID"
          while [ "$SECONDS" -lt "$deadline" ]; do
            jobs="$(gh api --paginate "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
            state="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].status // "missing"')"
            conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].conclusion // ""')"
            case "$state/$conclusion" in
              in_progress/*|completed/success)
                echo "runner-watchdog=local-started sentinel_status=$state sentinel_conclusion=$conclusion"
                exit 0
                ;;
              completed/*)
                echo "runner-watchdog=local-start-failed sentinel_status=$state sentinel_conclusion=$conclusion"
                break
                ;;
            esac
            echo "runner-watchdog=waiting sentinel_status=$state sentinel_conclusion=${conclusion:-none} seconds_remaining=$((deadline - SECONDS))"
            sleep "$interval_seconds"
          done

          echo "runner-watchdog=fallback reason=local-sentinel-not-started"
          ref="$GITHUB_REF_NAME"
          gh workflow run canonical-execution.yml \
            --repo "$REPO" \
            --ref "$ref" \
            -f runner_mode=hosted \
            -f fallback_source_run="$GITHUB_RUN_ID"
          echo "runner-watchdog=hosted-dispatch ref=$ref source_run=$GITHUB_RUN_ID"
          sleep 2
          gh api --method POST "repos/$REPO/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null || true
          echo "runner-watchdog=local-run-cancel-requested source_run=$GITHUB_RUN_ID"

  pbd_validation_image:
    name: Build/publish pinned PositionBasedDynamics validation image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Derive immutable PositionBasedDynamics image tag
        id: image
        run: |
          set -euo pipefail
          digest="$(sha256sum < docker/freecad-ci/Dockerfile | cut -d' ' -f1)"
          echo "image=ghcr.io/uhrendoktor/freecad-cloth/pbd-validation:${digest:0:32}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for published PositionBasedDynamics image
        id: image_cache
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "PositionBasedDynamics image already published: $IMAGE"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "PositionBasedDynamics image missing; source build required: $IMAGE"
          fi
      - name: Set up Docker Buildx
        if: ${{ steps.image_cache.outputs.hit != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish pinned PositionBasedDynamics validation image
        if: ${{ steps.image_cache.outputs.hit != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/freecad-ci/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=freecad-cloth-pbd-validation
          cache-to: type=gha,mode=max,scope=freecad-cloth-pbd-validation,ignore-error=true
      - name: Pull pinned PositionBasedDynamics validation image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

  diagnostic-pbd-contact:
    name: Diagnostic PositionBasedDynamics contact controls
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_controls) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'cube-ladder-2481') || contains(github.event.pull_request.head.ref, 'avatar-ladder-2482'))) }}
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
      CLOTH_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Log selected execution mode
        run: |
          set -euo pipefail
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned PositionBasedDynamics validation image
        run: docker pull "$FREECAD_PBD_IMAGE"
      - name: Run one-step contact controls
        run: |
          set -euo pipefail
          mkdir -p artifacts/pbd-contact-diagnostics
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=1 \
            -e CLOTH_PBD_SUBSTEPS=1 -e CLOTH_PBD_COLLISION_MODE=mesh \
            -e CLOTH_PBD_COLLISION_TRIANGLES=2048 \
            -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/pbd-contact-diagnostics
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              rm -f /workspace/artifacts/pbd-contact-diagnostics/app-run.log
              setsid /opt/freecad/AppRun /workspace/tests/freecad_pbd_contact_diagnostics.py > /workspace/artifacts/pbd-contact-diagnostics/app-run.log 2>&1 &
              APP_PID=$!
              APP_DEADLINE=$((SECONDS + 300))
              echo "diagnostic-contact-supervisor=started pid=$APP_PID deadline_seconds=300"
              while kill -0 "$APP_PID" 2>/dev/null; do
                if [ "$SECONDS" -ge "$APP_DEADLINE" ]; then
                  echo "diagnostic-contact-supervisor=timeout pid=$APP_PID elapsed_seconds=300" | tee -a /workspace/artifacts/pbd-contact-diagnostics/app-run.log
                  kill -TERM -- "-$APP_PID" 2>/dev/null || kill -TERM "$APP_PID" 2>/dev/null || true
                  sleep 5
                  kill -KILL -- "-$APP_PID" 2>/dev/null || kill -KILL "$APP_PID" 2>/dev/null || true
                  break
                fi
                sleep 1
              done
              set +e
              wait "$APP_PID"
              APP_STATUS=$?
              set -e
              echo "diagnostic-contact-supervisor=finished status=$APP_STATUS" | tee -a /workspace/artifacts/pbd-contact-diagnostics/app-run.log
              exit "$APP_STATUS"
            '
      - name: Run cube complexity ladder
        run: |
          set -euo pipefail
          rm -rf artifacts/pbd-contact-diagnostics/cube-ladder
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=0 \
            -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics \
            -e CLOTH_HEAD_SHA="$CLOTH_HEAD_SHA" \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/pbd-contact-diagnostics
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 600s /opt/freecad/AppRun /workspace/tests/freecad_pbd_cube_ladder.py 2>&1 | tee /workspace/artifacts/pbd-contact-diagnostics/cube-ladder-run.log
            '
      - name: Validate cube ladder artifact
        run: |
          set -euo pipefail
          test -s artifacts/pbd-contact-diagnostics/cube-ladder-manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/pbd-contact-diagnostics")
          data = json.loads((root / "cube-ladder-manifest.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1, data
          assert data["purpose"] == "simulation-collision-ladder", data
          assert data["release_gate_effect"] == "gate", data
          assert data["source_head_sha"] == os.environ["CLOTH_HEAD_SHA"], data
          assert data["checkpoint_steps"] == [0, 1, 5, 15, 45, 90], data
          assert len(data["cases"]) == 5, data
          expected = [
              ("rung-1-cube-pinned", 1, 1, "Automatic", "none"),
              ("rung-2-cube-unpinned", 2, 1, "None", "none"),
              ("rung-3-cube-two-piece-no-seam", 3, 2, "None", "none"),
              ("rung-4-cube-two-piece-small-seam", 4, 2, "None", "small"),
              ("rung-5-cube-two-piece-large-seam", 5, 2, "None", "large"),
          ]
          for record, spec in zip(data["cases"], expected):
              case = record["case"]
              assert (case["id"], case["rung"], case["piece_count"], case["pin_mode"], case["seam_mode"]) == spec, record
              assert record["finite"], record
              assert record["solver"]["backend"] == "pbd", record
              assert record["solver"]["iterations"] == 1, record
              assert record["solver"]["substeps"] == 1, record
              assert abs(record["solver"]["timestep_s"] - 1/120) < 1e-12, record
              assert record["solver"]["gravity_z_mm_s2"] == 0.0, record
              assert len(record["checkpoints"]) == 6, record
              assert [x["step"] for x in record["checkpoints"]] == [0, 1, 5, 15, 45, 90], record
              for image in record["images"]:
                  assert (root / "cube-ladder" / image.split("/", 1)[-1]).is_file(), image
          small = data["cases"][3]["pre_step"]["seam_world_spans_mm"]
          large = data["cases"][4]["pre_step"]["seam_world_spans_mm"]
          assert len(small) == 1 and len(large) == 1, data
          assert large[0]["max_span_mm"] > small[0]["max_span_mm"] + 20.0, (small, large)
          assert data["structural_validation"]["first_failing_rung"] in {None, 1, 2, 3, 4, 5}
          print("cube-ladder-artifact=passed")
          PY
      - name: Run avatar complexity ladder
        run: |
          set -euo pipefail
          rm -rf artifacts/pbd-contact-diagnostics/avatar-ladder
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_COLLISION_MODE=mesh -e CLOTH_PBD_COLLISION_TRIANGLES=2048 \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=0 \
            -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics \
            -e CLOTH_HEAD_SHA="$CLOTH_HEAD_SHA" \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/pbd-contact-diagnostics
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 600s /opt/freecad/AppRun /workspace/tests/freecad_pbd_avatar_ladder.py 2>&1 | tee /workspace/artifacts/pbd-contact-diagnostics/avatar-ladder-run.log
            '
      - name: Validate avatar ladder artifact
        run: |
          set -euo pipefail
          test -s artifacts/pbd-contact-diagnostics/avatar-ladder-manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/pbd-contact-diagnostics")
          data = json.loads((root / "avatar-ladder-manifest.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1, data
          assert data["purpose"] == "simulation-avatar-ladder", data
          assert data["release_gate_effect"] == "gate", data
          assert data["source_head_sha"] == os.environ["CLOTH_HEAD_SHA"], data
          assert data["checkpoint_steps"] == [0, 1, 5, 15, 45, 90], data
          assert len(data["cases"]) == 5, data
          expected = [
              ("rung-6-avatar-pinned", 6, 1, "Automatic", "none"),
              ("rung-7-avatar-unpinned", 7, 1, "None", "none"),
              ("rung-8-avatar-two-piece-no-seam", 8, 2, "None", "none"),
              ("rung-9-avatar-two-piece-small-seam", 9, 2, "None", "small"),
              ("rung-10-avatar-two-piece-large-seam", 10, 2, "None", "large"),
          ]
          for record, spec in zip(data["cases"], expected):
              case = record["case"]
              assert (case["id"], case["rung"], case["piece_count"], case["pin_mode"], case["seam_mode"]) == spec, record
              assert record["finite"], record
              assert record["solver"]["backend"] == "pbd", record
              assert record["solver"]["iterations"] == 1, record
              assert record["solver"]["substeps"] == 1, record
              assert abs(record["solver"]["timestep_s"] - 1/120) < 1e-12, record
              assert record["solver"]["gravity_z_mm_s2"] == 0.0, record
              assert record["collision"]["source_triangles"] > 10000, record
              assert record["collision"]["solver_triangles"] == 2048, record
              assert record["collision"]["target_topology_summary"]["vertices"] > 10000, record
              assert len(record["checkpoints"]) == 6, record
              assert [x["step"] for x in record["checkpoints"]] == [0, 1, 5, 15, 45, 90], record
              for image in record["images"]:
                  assert (root / image).is_file(), image

          assert data["cases"][0]["collision"]["source_triangles"] == data["cases"][1]["collision"]["source_triangles"], data
          assert data["cases"][0]["collision"]["solver_triangles"] == data["cases"][4]["collision"]["solver_triangles"] == 2048, data
          assert data["cases"][0]["control"]["placement_offsets_mm"]["right_x"] is None, data
          assert data["cases"][1]["control"]["placement_offsets_mm"]["right_x"] is None, data
          assert data["cases"][2]["control"]["placement_offsets_mm"]["right_x"] == 0.5, data
          assert data["cases"][3]["control"]["placement_offsets_mm"]["right_x"] == 0.5, data
          assert data["cases"][4]["control"]["placement_offsets_mm"]["right_x"] == 80.0, data
          small = data["cases"][3]["pre_step"]["seam_world_spans_mm"]
          large = data["cases"][4]["pre_step"]["seam_world_spans_mm"]
          assert len(small) == 1 and len(large) == 1, data
          assert small[0]["pair_count"] == 6 and large[0]["pair_count"] == 6, data
          assert small[0]["min_span_mm"] < 1.0, small
          assert small[0]["max_span_mm"] < 1.0, small
          assert 79.0 <= large[0]["min_span_mm"] <= 81.0, large
          assert 79.0 <= large[0]["max_span_mm"] <= 81.0, large
          assert large[0]["seam_id"] == small[0]["seam_id"] == "avatar-seam", (small, large)
          assert large[0]["max_span_mm"] > small[0]["max_span_mm"] + 20.0, (small, large)
          assert data["structural_validation"]["first_failing_rung"] in {None, 6, 7, 8, 9, 10}, data
          print("avatar-ladder-artifact=passed")
          PY
      - name: Capture provenance
        run: |
          set -euo pipefail
          docker run --rm "$FREECAD_PBD_IMAGE" bash -lc "cat /opt/pypbd-provenance.txt" > artifacts/pypbd-provenance.txt
          test -s artifacts/pypbd-provenance.txt

      - name: Validate diagnostic artifact
        run: |
          set -euo pipefail
          test -s artifacts/pbd-contact-diagnostics/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/pbd-contact-diagnostics/manifest.json").read_text(encoding="utf-8"))
          assert data["schema"] == 1, data
          assert data["release_gate_effect"] == "none", data
          assert {case["case"]["id"] for case in data["cases"]} == {"control-0-cube", "control-0a-avatar"}, data
          for case in data["cases"]:
              assert case["solver"]["backend"] == "pbd", case
              assert case["solver"]["iterations"] == 1, case
              assert case["solver"]["substeps"] == 1, case
              assert case["solver"]["gravity_z_mm_s2"] == 0.0, case
              assert case["collision"]["source_triangles"] > 0, case
              assert case["collision"]["solver_triangles"] > 0, case
              assert len(case["checkpoints"]) == 2, case
              assert [checkpoint["step"] for checkpoint in case["checkpoints"]] == [0, 1], case
              assert case["finite"], case
              assert case["checkpoints"][0]["finite"], case
              assert case["checkpoints"][1]["finite"], case
              for image in case["images"]:
                  assert Path("artifacts/pbd-contact-diagnostics", image).is_file(), image
          print("diagnostic-contact-artifact=passed")
          PY
      - name: Upload contact diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pbd-contact-diagnostics
          path: |
            artifacts/pbd-contact-diagnostics/**
            artifacts/pypbd-provenance.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
  simulation-ladder:
    name: Simulation collision ladder
    needs: [local_runner_readiness, pbd_validation_image]
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
      CLOTH_PBD_SUBSTEPS: 8
      CLOTH_PBD_COLLISION_MODE: mesh
      CLOTH_PBD_COLLISION_TRIANGLES: 2048
      CLOTH_PBD_COLLISION_VOXEL_MM: 8
      CLOTH_PBD_COLLISION_TOLERANCE_MM: 2
      CLOTH_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned PositionBasedDynamics validation image
        run: docker pull "$FREECAD_PBD_IMAGE"
      - name: Run cube collision ladder
        run: |
          set -euo pipefail
          rm -rf artifacts/simulation-ladder
          mkdir -p artifacts/simulation-ladder
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_SUBSTEPS="$CLOTH_PBD_SUBSTEPS" -e CLOTH_PBD_COLLISION_MODE="$CLOTH_PBD_COLLISION_MODE" \
            -e CLOTH_PBD_COLLISION_TRIANGLES="$CLOTH_PBD_COLLISION_TRIANGLES" -e CLOTH_PBD_COLLISION_VOXEL_MM="$CLOTH_PBD_COLLISION_VOXEL_MM" \
            -e CLOTH_PBD_COLLISION_TOLERANCE_MM="$CLOTH_PBD_COLLISION_TOLERANCE_MM" -e CLOTH_HEAD_SHA="$CLOTH_HEAD_SHA" \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=0 -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/simulation-ladder
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 600s /opt/freecad/AppRun /workspace/tests/freecad_pbd_cube_ladder.py 2>&1 | tee /workspace/artifacts/simulation-ladder/cube-ladder-run.log
            '
      - name: Run mannequin collision ladder
        run: |
          set -euo pipefail
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=position-based-dynamics -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_SUBSTEPS="$CLOTH_PBD_SUBSTEPS" -e CLOTH_PBD_COLLISION_MODE="$CLOTH_PBD_COLLISION_MODE" \
            -e CLOTH_PBD_COLLISION_TRIANGLES="$CLOTH_PBD_COLLISION_TRIANGLES" -e CLOTH_PBD_COLLISION_VOXEL_MM="$CLOTH_PBD_COLLISION_VOXEL_MM" \
            -e CLOTH_PBD_COLLISION_TOLERANCE_MM="$CLOTH_PBD_COLLISION_TOLERANCE_MM" -e CLOTH_HEAD_SHA="$CLOTH_HEAD_SHA" \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=0 -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/simulation-ladder
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 600s /opt/freecad/AppRun /workspace/tests/freecad_pbd_avatar_ladder.py 2>&1 | tee /workspace/artifacts/simulation-ladder/avatar-ladder-run.log
            '
      - name: Validate simulation ladder
        run: |
          set -euo pipefail
          test -s artifacts/simulation-ladder/cube-ladder-manifest.json
          test -s artifacts/simulation-ladder/avatar-ladder-manifest.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("artifacts/simulation-ladder")
          specs = (
              ("cube", root / "cube-ladder-manifest.json", 5, 3.0, "diagnostic-only-cube-complexity-ladder"),
              ("avatar", root / "avatar-ladder-manifest.json", 5, 8.0, "diagnostic-only-avatar-complexity-ladder"),
          )
          for name, path, count, max_penetration, purpose in specs:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["schema"] == 1, data
              assert data["purpose"] == purpose, data
              assert data["source_head_sha"] == os.environ["CLOTH_HEAD_SHA"], data
              assert data["release_gate_effect"] == "none", data
              assert len(data["cases"]) == count, data
              for case in data["cases"]:
                  assert case["finite"], case
                  assert case["solver"]["backend"] == "pbd", case
                  assert len(case["checkpoints"]) == 6, case
                  assert case["max_penetration_mm"] <= max_penetration + 1e-6, (name, case["case"]["id"], case["max_penetration_mm"], max_penetration)
                  for image in case["images"]:
                      assert (root / image).is_file(), image
              assert data["structural_validation"]["first_failing_rung"] is None, data
              print(f"{name}-collision-ladder=passed max_penetration_mm<={max_penetration}")
          print("simulation-collision-ladder=passed")
          PY
      - name: Upload simulation ladder evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-collision-ladder
          path: artifacts/simulation-ladder/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
  gui-sewing-creation:
    name: Sewing staged creation smoke
    needs: [local_runner_readiness]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 10
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate generated tunic audit source
        run: |
          set -euo pipefail
          python3 tests/freecad_tunic_audit.py --syntax-check
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run staged creation smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SEWING_SMOKE_LOG=/workspace/artifacts/sewing-creation-smoke.log \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_sewing_creation_smoke.py
              test -s /workspace/artifacts/sewing-creation-smoke.log
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Inspect smoke evidence
        run: |
          set -euo pipefail
          grep -q 'preview-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'selection-count-rejection=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-same-piece-preview=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-mn-partition-preview=passed' artifacts/sewing-creation-smoke.log
          grep -q 'curved-sampling=passed' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn=passed members=2,2 segments=3 physical-length=proportional' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn-reversal=passed segments=3' artifacts/sewing-creation-smoke.log
          grep -q 'correspondence-gui-evidence=passed severity=info' artifacts/sewing-creation-smoke.log
          grep -q 'seam-visual-3d=passed' artifacts/sewing-creation-smoke.log
          grep -q 'seam-visual-2d=passed top-view=true' artifacts/sewing-creation-smoke.log
          grep -q 'curved-mn-save-reload=passed same-endpoint-pairs=true' artifacts/sewing-creation-smoke.log
          grep -q 'stale-endpoint-invalidation=passed commit-blocked=true' artifacts/sewing-creation-smoke.log
      - name: Upload sewing creation smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sewing-creation-smoke
          path: artifacts/sewing-creation-smoke.log
          if-no-files-found: error
          compression-level: 1

