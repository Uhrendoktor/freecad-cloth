name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_xpbd.py
          python tests/test_cloth_solver.py
          python tests/test_side_tasks.py
          python tests/test_simulation_scene.py
          python tests/test_collisions.py
          python tests/test_freecad_objects.py
          python tests/test_gui_structure.py
          python tests/test_sewing_workbench.py
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
          test -f PatternGui.py
          test -f SimulationGui.py
          test -f SewingGui.py
          test -f SewingObjects.py

  freecad-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real FreeCAD runtime in Debian trixie
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad
              freecadcmd --version
              freecadcmd tests/freecad_smoke.py
            '

  one-shot-branch-cleanup:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: one-shot stale branch cleanup' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete confirmed stale branches idempotently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          stale_branches=(
            'agent-seam-backend-20260828'
          )
          for branch in "${stale_branches[@]}"; do
            echo "Checking $branch"
            code=$(curl --silent --show-error --output /tmp/ref.json --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}/git/ref/heads/${branch}")
            case "$code" in
              200) ;;
              404) echo "$branch is already absent; continuing"; continue ;;
              *) echo "Unexpected GET status $code for $branch"; cat /tmp/ref.json; exit 1 ;;
            esac

            echo "Deleting $branch"
            delete_code=$(curl --silent --show-error --output /tmp/delete.json --write-out '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${repo}/git/refs/heads/${branch}")
            case "$delete_code" in
              204) echo "$branch deleted" ;;
              404|422) echo "$branch disappeared before deletion; continuing" ;;
              *) echo "Unexpected DELETE status $delete_code for $branch"; cat /tmp/delete.json; exit 1 ;;
            esac
          done
