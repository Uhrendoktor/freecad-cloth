name: Canonical execution

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  gui-tunic-smoke:
    name: Fast tunic visual smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Render single draped tunic frame
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          sed -i \
            -e 's/scene.ParticleDistance = 18.0/scene.ParticleDistance = 60.0/' \
            -e 's/scene.SolverIterations = 16/scene.SolverIterations = 2/' \
            -e 's/scene.SolverSubsteps = 4/scene.SolverSubsteps = 1/' \
            -e 's/scene.TimeStep = 1.0 \/ 240.0/scene.TimeStep = 1.0 \/ 120.0/' \
            -e 's/scene.StitchSamples = int(os.environ.get("CLOTH_TUNIC_STITCH_SAMPLES", "16"))/scene.StitchSamples = int(os.environ.get("CLOTH_TUNIC_STITCH_SAMPLES", "4"))/' \
            -e 's/scene.Steps = 30/scene.Steps = 2/' \
            -e 's/int(scene.Steps) != 30/int(scene.Steps) != 2/' \
            -e 's/finite 30-step state/finite 2-step state/' \
            -e 's/after 30 real steps/after 2 real steps/' \
            tests/freecad_simulation_turntable.py
          cat > pr_tunic_smoke.py <<'PY'
          import os
          import types
          import FreeCAD as App
          import FreeCADGui as Gui
          from PySide import QtWidgets

          source = open("/workspace/tests/freecad_simulation_turntable.py", encoding="utf-8").read()
          source = source.split("\ntry:\n    main()", 1)[0]
          mod = types.ModuleType("turntable")
          exec(compile(source, "/workspace/tests/freecad_simulation_turntable.py", "exec"), mod.__dict__, mod.__dict__)
          os.makedirs("/workspace/docs/images/generated", exist_ok=True)
          window = Gui.getMainWindow()
          window.show(); mod.events()
          if "ClothPatternWorkbench" not in Gui.listWorkbenches():
              init_gui = "/workspace/InitGui.py"
              exec(compile(open(init_gui, encoding="utf-8").read(), init_gui, "exec"), globals(), globals())
          mod.events()
          doc = App.newDocument("ClothTunicSmoke")
          try:
              scene, avatar, panels, seam_records, authored, pieces = mod.build_simulation_state(doc)
              authored.ViewObject.Visibility = False
              doc.recompute(); mod.events()
              if int(scene.Steps) != 2 or float(scene.SimulatedTime) <= 0.0 or not bool(scene.FiniteState):
                  raise RuntimeError("simulation did not reach a finite 2-step state")
              if any(panel.Mesh.CountFacets <= 10 for panel in panels):
                  raise RuntimeError("draped tunic panel mesh is empty")
              front, back = pieces
              simulated = {
                  front.Name: mod._boundary_points(panels[0], len(mod._outline(front))),
                  back.Name: mod._boundary_points(panels[1], len(mod._outline(back))),
              }
              mod._seam_overlay(doc, "TunicSeamsSimulated", seam_records, simulated)
              view = Gui.activeDocument().activeView()
              view.setCameraType("Orthographic")
              view.viewFront(); view.fitAll(); view.zoomIn(); mod.events()
              mod.save_png(view, "/workspace/docs/images/generated/cloth-simulation-draped-tunic-smoke.png", "draped tunic smoke")
              mod.log("simulation-turntable-pass")
          finally:
              if doc.Name in App.listDocuments():
                  App.closeDocument(doc.Name)
              mod.events(); window.close()
              app = QtWidgets.QApplication.instance()
              if app is not None:
                  app.quit()
          PY
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 \
            -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND=xpbd-cpu -e CLOTH_TUNIC_CLEARANCE_MM=12.0 -e CLOTH_TUNIC_STITCH_SAMPLES=4 \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 12); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=5s 50s /opt/freecad/AppRun /workspace/pr_tunic_smoke.py
            '
      - name: Validate tunic smoke export
        run: |
          set -euo pipefail
          test -s docs/images/generated/simulation-turntable-progress.log
          grep -q 'simulation-turntable-pass' docs/images/generated/simulation-turntable-progress.log
          test -s docs/images/generated/cloth-simulation-draped-tunic-smoke.png
      - name: Upload tunic visual smoke
        uses: actions/upload-artifact@v6
        with:
          name: tunic-visual-smoke
          path: docs/images/generated/cloth-simulation-draped-tunic-smoke.png
          if-no-files-found: error
          compression-level: 1
