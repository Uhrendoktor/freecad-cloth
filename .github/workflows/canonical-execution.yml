name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: .

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_meshpart_adapter.py
          python tests/test_xpbd.py
          python tests/test_cloth_solver.py
          python tests/test_side_tasks.py
          python tests/test_simulation_scene.py
          python tests/test_collisions.py
          python tests/test_freecad_objects.py
          python tests/test_gui_structure.py
          python tests/test_sewing_workbench.py
          python tests/test_sewing_show2d.py
          python tests/test_sewing_network.py
          python tests/test_sewing_network_gui.py
          python tests/test_avatar_fitting.py
          python tests/test_drape_quality.py
          python tests/test_pattern_sketch.py
          python tests/test_pattern_ir.py
          python tests/test_pattern_export_semantics.py
          python tests/test_sketch_authority.py
      - name: Reference drape benchmark
        run: python tests/benchmark_drape.py
      - name: Upload reference drape benchmark
        uses: actions/upload-artifact@v4
        with:
          name: drape-benchmark-${{ matrix.python }}
          path: artifacts/drape-benchmark.json
          if-no-files-found: error
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
          test -f PatternGui.py
          test -f SimulationGui.py
          test -f SewingGui.py
          test -f SewingNetworkGui.py
          test -f SewingObjects.py

  freecad-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run real FreeCAD runtime in Debian trixie
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad
              freecadcmd --version
              freecadcmd tests/freecad_smoke.py
              freecadcmd tests/freecad_meshpart_smoke.py
              freecadcmd tests/freecad_sewing_smoke.py
            '

  gui-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate FreeCAD GUI screenshots under Xvfb
        run: |
          mkdir -p "$PWD/docs/images/generated"
          docker run --rm \
            -e DISPLAY=:99 \
            -e QT_X11_NO_MITSHM=1 \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e QT_QPA_PLATFORM=xcb \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -e CLOTH_E2E_DIR=/workspace/artifacts/freecad-e2e \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq freecad xvfb openbox
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
              XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 &
              OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              sleep 2
              rm -f docs/images/generated/cloth-pattern-design.png docs/images/generated/cloth-sewing.png docs/images/generated/cloth-simulation.png docs/images/generated/gui-progress.log
              printf "%s\n" "exec(compile(open(\"tests/freecad_screenshot.py\", encoding=\"utf-8\").read(), \"tests/freecad_screenshot.py\", \"exec\"))" > /tmp/cloth_screenshot.FCMacro
              timeout --signal=TERM --kill-after=5s 60s freecad /tmp/cloth_screenshot.FCMacro >/tmp/freecad-gui.log 2>&1 || {
                status=$?
                cat /tmp/freecad-gui.log || true
                cat docs/images/generated/gui-progress.log || true
                cat /tmp/xvfb.log || true
                cat /tmp/openbox.log || true
                echo "FreeCAD GUI screenshot process failed or timed out (status $status)"
                exit "$status"
              }
              cat docs/images/generated/gui-progress.log || true
              test -s docs/images/generated/cloth-pattern-design.png
              test -s docs/images/generated/cloth-sewing.png
              test -s docs/images/generated/cloth-simulation.png
              mkdir -p artifacts/freecad-e2e
              rm -f artifacts/freecad-e2e/workflow.log
              printf "%s\n" "exec(compile(open(\"tests/freecad_e2e.py\", encoding=\"utf-8\").read(), \"tests/freecad_e2e.py\", \"exec\"))" > /tmp/cloth_e2e.FCMacro
              timeout --signal=TERM --kill-after=5s 90s freecad /tmp/cloth_e2e.FCMacro >/tmp/freecad-e2e.log 2>&1 || {
                status=$?
                cat /tmp/freecad-e2e.log || true
                cat artifacts/freecad-e2e/workflow.log || true
                cat /tmp/xvfb.log || true
                cat /tmp/openbox.log || true
                echo "FreeCAD canonical E2E process failed or timed out (status $status)"
                exit "$status"
              }
              cat artifacts/freecad-e2e/workflow.log
              test -s artifacts/freecad-e2e/workflow.log
            '
      - name: Upload GUI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            artifacts/freecad-e2e/workflow.log
            /tmp/freecad-gui.log
            /tmp/freecad-e2e.log
            /tmp/xvfb.log
            /tmp/openbox.log
          if-no-files-found: ignore
      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
