  gui-visual-examples:
    name: Basic blanket visual example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run blanket visual example
        run: |
          set -euo pipefail
          rm -rf docs/images/generated/blanket-example
          mkdir -p docs/images/generated/blanket-example
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated/blanket-example
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 8m /opt/freecad/AppRun /workspace/tests/freecad_visual_examples.py
            '
          test -s docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'blanket-visual-acceptance=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'mesh=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'movement=passed' docs/images/generated/blanket-example/blanket-visual.log
          grep -q 'material-presentation=passed viewport=true' docs/images/generated/blanket-example/blanket-visual.log
          test "$(find docs/images/generated/blanket-example -maxdepth 1 -name 'checkpoint-*.png' | wc -l)" -eq 5
          test "$(find docs/images/generated/blanket-example -maxdepth 1 -name 'motion-*.png' | wc -l)" -eq 16
      - name: Build blanket motion GIF
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=(magick)
          elif command -v convert >/dev/null 2>&1; then
            IM=(convert)
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=(convert)
          fi
          "${IM[@]}" docs/images/generated/blanket-example/motion-*.png \
            -delay 10 -loop 0 -colors 128 -layers Optimize \