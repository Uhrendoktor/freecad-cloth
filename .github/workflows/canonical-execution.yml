name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Core and geometry tests
        run: |
          python tests/test_core.py
          python tests/test_mesh.py
          python tests/test_xpbd.py
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Package structure validation
        run: |
          test -f package.xml
          test -f Init.py
          test -f InitGui.py
      - name: FreeCAD smoke test when available
        shell: bash
        run: |
          set -euo pipefail
          if command -v freecadcmd >/dev/null 2>&1; then
            freecadcmd -c 'import sys; sys.path.insert(0, "."); import InitGui; import PatternModel; import PatternMesh; import XPBD; print("FreeCAD workbench import smoke test passed")'
          else
            echo 'freecadcmd not installed; FreeCAD-specific smoke test skipped.'
          fi
