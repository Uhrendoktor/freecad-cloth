name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full_gui:
        description: "Run the heavyweight FreeCAD GUI visual validation"
        required: false
        default: false
        type: boolean

concurrency:
  group: canonical-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  python:
    name: Python and FreeCAD non-GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run Python tests in Docker
        run: |
          set -euo pipefail
          docker run --rm --security-opt seccomp=unconfined --shm-size=1g \
            -e PYTHONPATH=/workspace -e CLOTH_SIMULATION_BACKEND=tissu \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -e
              python3 -m compileall -q .
              python3 -c "import tissu, pytest"
              for test in \
                tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py tests/test_mesh_validation.py \
                tests/test_avatar_visual_sanity.py tests/test_drape_visual_sanity.py tests/test_xpbd.py tests/test_cloth_solver.py \
                tests/test_side_tasks.py tests/test_collisions.py tests/test_pattern_sketch.py tests/test_pattern_ir.py \
                tests/test_pattern_export_semantics.py tests/test_sketch_authority.py tests/test_sewing_workbench.py \
                tests/test_sewing_show2d.py tests/test_sewing_network.py tests/test_sewing_network_gui.py \
                tests/test_sewing_network_gui_contract.py tests/test_gui_structure.py tests/test_simulation_scene.py \
                tests/test_simulation_quality.py tests/test_avatar_fitting.py tests/test_avatar_shoulder_pose.py \
                tests/test_avatar_hierarchical_pose.py tests/test_humanoid_mesh.py tests/test_drape_quality.py \
                tests/test_freecad_objects.py tests/test_project_structure.py tests/test_backend_adapter.py \
                tests/test_backend_authority.py tests/test_realtime_preview.py; do
                python3 "$test"
              done
            '

  realtime-benchmark:
    name: Production realtime benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image once
        run: docker pull "$FREECAD_IMAGE"
      - name: Benchmark XPBD and Tissu
        run: |
          set -euo pipefail
          mkdir -p artifacts/realtime
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/realtime
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              for backend in xpbd-cpu tissu; do
                export CLOTH_SIMULATION_BACKEND="$backend"
                export CLOTH_REALTIME_FRAMES=30
                export CLOTH_REALTIME_DIR="/workspace/artifacts/realtime/$backend"
                export CLOTH_TISSU_SUBSTEPS=1
                rm -rf "$CLOTH_REALTIME_DIR"
                mkdir -p "$CLOTH_REALTIME_DIR"
                /opt/freecad/AppRun tests/freecad_realtime_benchmark.py
                cp "$CLOTH_REALTIME_DIR/metrics.json" "/workspace/artifacts/realtime/${backend}-metrics.json"
              done
            '
      - name: Validate realtime metrics
        run: |
          set -euo pipefail
          for backend in xpbd-cpu tissu; do
            python3 - "$backend" <<'PY'
          import json, pathlib, sys
          backend=sys.argv[1]
          p=pathlib.Path(f"artifacts/realtime/{backend}-metrics.json")
          d=json.loads(p.read_text())
          assert d["finite"], d
          assert d["mean_frame_ms"] <= d["frame_budget_ms"], d
          assert d["p95_frame_ms"] <= 50.0, d
          print(backend, "mean=%.2fms p95=%.2fms fps=%.1f" % (d["mean_frame_ms"], d["p95_frame_ms"], d["fps_mean"]))
          PY
          done
      - name: Upload realtime metrics
        uses: actions/upload-artifact@v6
        with:
          name: realtime-benchmark
          path: artifacts/realtime
          if-no-files-found: error
          compression-level: 1

  gui-screenshot:
    name: Full FreeCAD visual validation
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_gui) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Render FreeCAD screenshots
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND=tissu \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -e
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=15s 600s /opt/freecad/AppRun tests/freecad_screenshot.py
              timeout --signal=TERM --kill-after=15s 300s /opt/freecad/AppRun tests/freecad_avatar_screenshot.py
              timeout --signal=TERM --kill-after=15s 600s /opt/freecad/AppRun tests/freecad_simulation_turntable.py
            '
      - name: Validate GUI exports
        run: |
          set -euo pipefail
          test -s docs/images/generated/cloth-simulation-draped.png
          test "$(find docs/images/generated/cloth-simulation-draped-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-avatar-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test "$(find docs/images/generated/cloth-simulation-arranged-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v6
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated
          if-no-files-found: error
          compression-level: 1
