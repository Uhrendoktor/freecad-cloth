name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: write
  packages: write

jobs:
  python:
    name: Python and FreeCAD non-GUI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run code validation
        run: |
          set -euo pipefail
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e PYTHONPATH=/workspace -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              test "$(python3 -c "import sys; print(sys.version_info[:2])")" = "(3, 12)"
              python3 -m compileall -q .
              for test in \
                tests/test_core.py \
                tests/test_mesh.py \
                tests/test_meshpart_adapter.py \
                tests/test_mesh_validation.py \
                tests/test_avatar_visual_sanity.py \
                tests/test_drape_visual_sanity.py \
                tests/test_xpbd.py \
                tests/test_cloth_solver.py \
                tests/test_side_tasks.py \
                tests/test_collisions.py \
                tests/test_pattern_sketch.py \
                tests/test_pattern_ir.py \
                tests/test_pattern_export_semantics.py \
                tests/test_sketch_authority.py \
                tests/test_sewing_workbench.py \
                tests/test_sewing_correspondence.py \
                tests/test_sewing_commands.py \
                tests/test_sewing_creation_session.py \
                tests/test_sewing_show2d.py \
                tests/test_sewing_network.py \
                tests/test_sewing_network_gui.py \
                tests/test_sewing_network_gui_contract.py \
                tests/test_gui_structure.py \
                tests/test_simulation_scene.py \
                tests/test_simulation_quality.py \
                tests/test_avatar_fitting.py \
                tests/test_avatar_shoulder_pose.py \
                tests/test_avatar_hierarchical_pose.py \
                tests/test_humanoid_mesh.py \
                tests/test_drape_quality.py \
                tests/test_freecad_objects.py \
                tests/test_project_structure.py \
                tests/test_cloth_diagnostics.py \
                tests/test_tunic_audit_contract.py; do
                python3 "$test"
              done
            '

  gui-sewing-creation:
    name: Sewing staged creation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run staged creation smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SEWING_SMOKE_LOG=/workspace/artifacts/sewing-creation-smoke.log \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 8m /opt/freecad/AppRun /workspace/tests/freecad_sewing_creation_smoke.py
              test -s /workspace/artifacts/sewing-creation-smoke.log
            '
      - name: Inspect smoke evidence
        run: |
          set -euo pipefail
          grep -q 'preview-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-1to1=passed' artifacts/sewing-creation-smoke.log
          grep -q 'selection-count-rejection=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-mn=passed' artifacts/sewing-creation-smoke.log
          grep -q 'preview-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'commit-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'cancel-free=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-same-piece-preview=passed' artifacts/sewing-creation-smoke.log
          grep -q 'invalid-mn-partition-preview=passed' artifacts/sewing-creation-smoke.log
      - name: Upload sewing creation smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sewing-creation-smoke
          path: artifacts/sewing-creation-smoke.log
          if-no-files-found: error
          compression-level: 1

  gui-garment-e2e:
    name: Canonical garment end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run canonical garment end-to-end smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          printf 'e2e-launch=starting\n' > artifacts/canonical-garment-e2e.log
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              python3 -c '\''import triangle; print("triangle-import=passed", flush=True)'\''
              printf "freecad-launch=starting\\n" >> /workspace/artifacts/canonical-garment-e2e.log
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              printf "%s\\n" "import InitGui" "import runpy" "runpy.run_path(\"/workspace/tests/freecad_garment_e2e_smoke.py\", run_name=\"__main__\")" >/tmp/run-canonical-garment-e2e.py
              timeout --signal=TERM --kill-after=15s 8m /opt/freecad/AppRun /tmp/run-canonical-garment-e2e.py 2>&1 | tee -a /workspace/artifacts/canonical-garment-e2e.log
              test -s /workspace/artifacts/canonical-garment-e2e.log
            '
      - name: Inspect canonical end-to-end evidence
        run: |
          set -euo pipefail
          grep -q 'triangle-import=passed' artifacts/canonical-garment-e2e.log
          grep -q 'staged-selection=passed' artifacts/canonical-garment-e2e.log
          grep -q 'sewing-1to1=passed type=curved' artifacts/canonical-garment-e2e.log
          grep -q 'sewing-mn=passed sides=2,2 segments=2' artifacts/canonical-garment-e2e.log
          grep -q 'sewing-operation=passed' artifacts/canonical-garment-e2e.log
          grep -q 'arrangement=passed pieces=4' artifacts/canonical-garment-e2e.log
          grep -q 'garment-hierarchy=passed groups=Patterns,Sewing,Fabric,Avatar,Simulation' artifacts/canonical-garment-e2e.log
          grep -q 'drape-target=passed' artifacts/canonical-garment-e2e.log
          grep -q 'diagnostics=passed metric=stress' artifacts/canonical-garment-e2e.log
          grep -q 'save-reload=passed pieces=4 seam=1to1 network=2segment' artifacts/canonical-garment-e2e.log
          grep -q 'invalidation=passed seam=' artifacts/canonical-garment-e2e.log
          grep -q 'invalidation-restore=passed seam=Valid' artifacts/canonical-garment-e2e.log
          grep -q 'stale-export=blocked' artifacts/canonical-garment-e2e.log
          grep -q 'diagnostics-after-invalidation=passed metric=stress' artifacts/canonical-garment-e2e.log
          grep -q 'determinism-signature=passed ' artifacts/canonical-garment-e2e.log
          grep -q 'pattern-export=passed formats=SVG,DXF' artifacts/canonical-garment-e2e.log
          grep -q 'pattern-e2e=passed pieces=4' artifacts/canonical-garment-e2e.log
          grep -q 'canonical garment end-to-end acceptance passed' artifacts/canonical-garment-e2e.log
      - name: Upload canonical end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canonical-garment-e2e
          path: artifacts/canonical-garment-e2e.log
          if-no-files-found: error
          compression-level: 1

  gui-pattern-export:
    name: Pattern production export smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run public export smoke
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g             -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth             -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1             -e CLOTH_PATTERN_EXPORT_LOG=/workspace/artifacts/pattern-production-export.log             -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 5m /opt/freecad/AppRun /workspace/tests/freecad_pattern_export_smoke.py
              test -s /workspace/artifacts/pattern-production-export.log
            '
      - name: Inspect export evidence
        run: |
          set -euo pipefail
          grep -q 'pattern-export=passed formats=SVG,DXF' artifacts/pattern-production-export.log
          grep -q 'pattern-export-smoke=completed' artifacts/pattern-production-export.log
      - name: Upload pattern export evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pattern-production-export
          path: artifacts/pattern-production-export.log
          if-no-files-found: error
          compression-level: 1

  gui-tunic-visual:
    name: Full tunic visual and simulation audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run native-Sketcher tunic audit
        env:
          CLOTH_SIMULATION_BACKEND: tissu
          CLOTH_TISSU_SUBSTEPS: 10
          CLOTH_TISSU_COLLISION_MODE: torso-envelope
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" \
            -e CLOTH_TISSU_SUBSTEPS="$CLOTH_TISSU_SUBSTEPS" \
            -e CLOTH_TISSU_COLLISION_MODE="$CLOTH_TISSU_COLLISION_MODE" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 12); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=10s 300s /opt/freecad/AppRun /workspace/tests/freecad_tunic_audit_production.py
            '
      - name: Validate visual and simulation evidence
        run: |
          set -euo pipefail
          test -s docs/images/generated/gui-progress.log
          grep -q 'scenario-pass' docs/images/generated/gui-progress.log
          grep -q 'realtime-preview=passed backend=tissu' docs/images/generated/gui-progress.log
          grep -q 'drape-metrics=' docs/images/generated/gui-progress.log
          test -s docs/images/generated/cloth-simulation-draped.png
          test -s docs/images/generated/cloth-simulation-draped-front.png
          test -s docs/images/generated/cloth-simulation-draped-rear.png
          test -s docs/images/generated/cloth-simulation-draped-left.png
          test -s docs/images/generated/cloth-simulation-draped-right.png
          test -s docs/images/generated/cloth-simulation-draped-top.png
          test -s docs/images/generated/cloth-simulation-draped-bottom.png
          test -s docs/images/generated/cloth-simulation-draped-diagnostics.png
          grep -q 'diagnostic-map=passed metric=stress' docs/images/generated/gui-progress.log
          grep -q 'diagnostic-stale-guard=passed' docs/images/generated/gui-progress.log
      - name: Upload tunic visual audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tunic-visual-audit
          path: |
            docs/images/generated/cloth-simulation-draped*.png
            docs/images/generated/drape-visual-metrics.json
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
          if-no-files-found: error
          compression-level: 1

  gui-turntables:
    name: README turntables
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Render turntable frames
        env:
          CLOTH_SIMULATION_BACKEND: tissu
        run: |
          set -euo pipefail
          rm -rf docs/images/generated
          mkdir -p docs/images/generated
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              timeout --signal=TERM --kill-after=15s 300s /opt/freecad/AppRun tests/freecad_avatar_screenshot.py
              timeout --signal=TERM --kill-after=15s 300s /opt/freecad/AppRun tests/freecad_simulation_turntable.py
            '
          test -d docs/images/generated/cloth-avatar-turntable-frames
          test "$(find docs/images/generated/cloth-avatar-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test -d docs/images/generated/cloth-simulation-arranged-turntable-frames
          test "$(find docs/images/generated/cloth-simulation-arranged-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
          test -d docs/images/generated/cloth-simulation-draped-turntable-frames
          test "$(find docs/images/generated/cloth-simulation-draped-turntable-frames -maxdepth 1 -name 'frame-*.png' | wc -l)" -eq 73
      - name: Build turntable GIFs
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IM=(magick)
          elif command -v convert >/dev/null 2>&1; then
            IM=(convert)
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IM=(convert)
          fi
          for spec in \
            "cloth-avatar-turntable-frames cloth-avatar-turntable.gif" \
            "cloth-simulation-arranged-turntable-frames cloth-simulation-arranged-turntable.gif" \
            "cloth-simulation-draped-turntable-frames cloth-simulation-draped-turntable.gif"; do
            set -- $spec
            "${IM[@]}" "docs/images/generated/$1"/frame-*.png \
              -delay 8 -loop 0 -colors 128 -layers Optimize \
              "docs/images/generated/$2"
            test -s "docs/images/generated/$2"
          done
      - name: Validate turntable GIFs
        run: |
          set -euo pipefail
          for gif in cloth-avatar-turntable.gif cloth-simulation-arranged-turntable.gif cloth-simulation-draped-turntable.gif; do
            identify -format '%n\n' "docs/images/generated/$gif" | head -n 1 | grep -qx '73'
            python3 -c 'import os,sys; p=sys.argv[1]; d=open(p,"rb").read(6); assert d in (b"GIF87a", b"GIF89a"); assert os.path.getsize(p)>=50000' "docs/images/generated/$gif"
          done
      - name: Upload README turntables
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: readme-turntables
          path: |
            docs/images/generated/cloth-avatar-turntable.gif
            docs/images/generated/cloth-simulation-arranged-turntable.gif
            docs/images/generated/cloth-simulation-draped-turntable.gif
            docs/images/generated/avatar-gui-progress.log
            docs/images/generated/simulation-turntable-progress.log
          if-no-files-found: ignore
          compression-level: 1

  publish-readme-turntables:
    name: Publish README turntables
    needs: [gui-tunic-visual, gui-turntables]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download turntables
        uses: actions/download-artifact@v6
        with:
          name: readme-turntables
          path: turntables
      - name: Update stable README asset branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" screenshot-repo
          cd screenshot-repo
          branch="docs/screenshots"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -b "$branch"
          fi
          mkdir -p docs/images/generated
          cp ../turntables/cloth-avatar-turntable.gif docs/images/generated/
          cp ../turntables/cloth-simulation-arranged-turntable.gif docs/images/generated/
          cp ../turntables/cloth-simulation-draped-turntable.gif docs/images/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/generated/cloth-avatar-turntable.gif \
            docs/images/generated/cloth-simulation-arranged-turntable.gif \
            docs/images/generated/cloth-simulation-draped-turntable.gif
          if git diff --cached --quiet; then
            echo "README turntables are already current."
            exit 0
          fi
          git commit -m "ci: publish stable README turntables"
          git push origin "HEAD:$branch"
  benchmark:
    name: Measured FreeCAD workbench benchmark
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Pull published FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1
          timeout --signal=TERM --kill-after=30s 10m docker pull "$IMAGE"
      - name: Run isolated FreeCAD workbench measurements
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -uo pipefail
          rm -rf artifacts/workbench-benchmark
          mkdir -p artifacts/workbench-benchmark
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=tissu -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            python3 -c "import tissu, pytest; print(\"Tissu\", tissu.__file__); print(\"pytest\", pytest.__version__)"
            mkdir -p "$XDG_RUNTIME_DIR"
            Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
            openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
            trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display :99 >/dev/null 2>&1
            for wb in Pattern Sewing Simulation; do
              echo "=== benchmark: $wb ==="
              rm -f /tmp/cloth-benchmark-trace.log
              CLOTH_BENCHMARK_WORKBENCH="$wb" CLOTH_BENCHMARK_OUTPUT="artifacts/workbench-benchmark/$wb.json" CLOTH_BENCHMARK_REPEATS=7 timeout --signal=TERM --kill-after=10s 180s /opt/freecad/AppRun tests/freecad_workbench_benchmark.py
              test -s "artifacts/workbench-benchmark/$wb.json"
            done
          ')"
          cleanup() {
            set +e
            docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/ 2>/dev/null || true
            docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
            docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
            docker cp "$CID:/tmp/openbox.log" artifacts/workbench-benchmark/openbox.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "FreeCAD benchmark failed with status $status"
            exit "$status"
          fi
          docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/
          docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
          docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/workbench-benchmark")
          names = ["Pattern", "Sewing", "Simulation"]
          data = [json.loads((root / f"{name}.json").read_text()) for name in names]
          merged = {
              "schema": data[0]["schema"],
              "python": data[0]["python"],
              "freecad_version": data[0]["freecad_version"],
              "repeats": data[0]["repeats"],
              "workbenches": {},
          }
          for item in data:
              merged["workbenches"].update(item["workbenches"])
          (root / "benchmark.json").write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n")
          PY
      - name: Install plotting dependency
        run: python3 -m pip install --disable-pip-version-check matplotlib
      - name: Generate benchmark plots
        run: python3 tools/plot_workbench_benchmark.py artifacts/workbench-benchmark/benchmark.json artifacts/workbench-benchmark/plots
      - name: Upload benchmark measurements and plots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-benchmark
          path: artifacts/workbench-benchmark
          if-no-files-found: warn
          compression-level: 1
