name: Canonical execution

on:
  push:
    branches: [main, ci/self-hosted-native-freecad]
  pull_request:
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FREECAD_BIN: freecad
      CLOTH_TEST_JOBS: 8
      DISPLAY: :99
      QT_X11_NO_MITSHM: 1
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: 1
      FREECAD_VERSION: 1.1.3
      FREECAD_CACHE_DIR: ${{ runner.temp }}/freecad-cloth-cache
      FREECAD_APPIMAGE_SHA256: 3a853eb69ee595f779f2255dbf80a765926981d8ff68903cefee4dfb03a8f5ef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Self-hosted runners are persistent, so this is a one-time bootstrap:
      # after the first successful run, the apt packages and extracted FreeCAD
      # stay on the runner. A pre-provisioned FreeCAD executable still wins.
      - name: Bootstrap self-hosted FreeCAD runtime
        run: |
          set -euo pipefail

          missing=()
          for tool in python3 xvfb-run openbox curl xargs; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if ((${#missing[@]})); then
            sudo -n true || {
              echo "Runner needs passwordless sudo for one-time bootstrap: ${missing[*]}" >&2
              exit 1
            }
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 xvfb openbox curl
          fi

          # Prefer a runner-provided FreeCAD. Otherwise install the official
          # FreeCAD 1.1.3 x86_64 AppImage once into the runner's persistent
          # temp/cache area and extract it so later invocations do not require
          # FUSE or repeat AppImage extraction.
          if command -v "$FREECAD_BIN" >/dev/null 2>&1; then
            echo "Using pre-provisioned FreeCAD: $(command -v "$FREECAD_BIN")"
          else
            root="$FREECAD_CACHE_DIR/$FREECAD_VERSION"
            appimage="$root/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
            appdir="$root/squashfs-root"
            mkdir -p "$root"

            if [[ ! -x "$appdir/AppRun" ]]; then
              if [[ ! -f "$appimage" ]]; then
                curl --fail --location --retry 3 --retry-delay 2 \
                  -o "$appimage" \
                  "https://github.com/FreeCAD/FreeCAD/releases/download/${FREECAD_VERSION}/FreeCAD_${FREECAD_VERSION}-Linux-x86_64-py311.AppImage"
              fi
              echo "$FREECAD_APPIMAGE_SHA256  $appimage" | sha256sum -c -
              rm -rf "$appdir"
              tmp_extract="$root/.squashfs-root.tmp"
              rm -rf "$tmp_extract"
              mkdir -p "$tmp_extract"
              (cd "$tmp_extract" && "$appimage" --appimage-extract >/dev/null)
              mv "$tmp_extract/squashfs-root" "$appdir"
              rm -rf "$tmp_extract"
            fi
            echo "FREECAD_BIN=$appdir/AppRun" >> "$GITHUB_ENV"
          fi

      - name: Validate self-hosted runtime
        run: |
          set -euo pipefail
          for tool in python3 xvfb-run openbox xargs; do
            command -v "$tool" >/dev/null || { echo "Missing required runner utility: $tool" >&2; exit 1; }
          done
          command -v "$FREECAD_BIN" >/dev/null || { echo "Missing FreeCAD: $FREECAD_BIN" >&2; exit 1; }
          echo "Runner: $(hostname)"
          echo "CPU threads: $(nproc)"
          echo "FreeCAD: $(command -v "$FREECAD_BIN")"
          "$FREECAD_BIN" --version || true
          python3 --version

      - name: Run Python tests and FreeCAD smoke/GUI tests
        run: |
          set -euo pipefail
          mkdir -p docs/images/generated artifacts/freecad-e2e
          rm -f docs/images/generated/*.png docs/images/generated/gui-progress.log

          # These tests are independent Python processes. The 24-thread
          # self-hosted runner can execute several at once; FreeCAD GUI/smoke
          # tests remain serial because they use shared GUI/runtime state.
          printf '%s\n' \
            tests/test_core.py tests/test_mesh.py tests/test_meshpart_adapter.py \
            tests/test_xpbd.py tests/test_cloth_solver.py tests/test_side_tasks.py \
            tests/test_simulation_scene.py tests/test_collisions.py tests/test_freecad_objects.py \
            tests/test_gui_structure.py tests/test_sewing_workbench.py tests/test_sewing_show2d.py \
            tests/test_sewing_network.py tests/test_sewing_network_gui.py tests/test_avatar_fitting.py \
            tests/test_drape_quality.py tests/test_pattern_sketch.py tests/test_pattern_ir.py \
            tests/test_pattern_export_semantics.py tests/test_sketch_authority.py \
            tests/test_simulation_quality.py tests/test_sewing_network_gui_contract.py \
            | xargs -P "${CLOTH_TEST_JOBS}" -n 1 python3

          python3 -m compileall -q .
          "$FREECAD_BIN" tests/freecad_smoke.py
          "$FREECAD_BIN" tests/freecad_meshpart_smoke.py
          "$FREECAD_BIN" tests/freecad_sewing_smoke.py
          timeout --signal=TERM --kill-after=5s 120s "$FREECAD_BIN" tests/freecad_screenshot.py

          test -s docs/images/generated/cloth-pattern-design.png
          test -s docs/images/generated/cloth-sewing.png
          test -s docs/images/generated/cloth-simulation.png

      - name: Upload GUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots
          path: docs/images/generated/*.png
          if-no-files-found: error
          compression-level: 1

      - name: Upload GUI diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics
          path: |
            docs/images/generated/gui-progress.log
            artifacts/freecad-e2e/workflow.log
          if-no-files-found: ignore
          compression-level: 1
