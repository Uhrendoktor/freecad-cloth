name: Canonical execution
run-name: Canonical execution

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner_mode:
        description: Trusted execution mode; local prefers self-hosted Docker, hosted uses GitHub-hosted runners.
        required: false
        type: choice
        default: local
        options: [local, hosted]
      fallback_source_run:
        description: Original run ID when invoked as an automatic hosted fallback.
        required: false
        type: string
        default: ""
      diagnostic_controls:
        description: Run diagnostic-only PBD contact controls.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('canonical-pr-{0}', github.event.pull_request.number) || format('canonical-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  XDG_RUNTIME_DIR: /tmp/runtime-cloth
  CLOTH_SIMULATION_BACKEND: position-based-dynamics
  CLOTH_CI_ENABLE_PBD: 1
  CLOTH_PBD_SUBSTEPS: 8
  CLOTH_PBD_COLLISION_MODE: mesh
  CLOTH_PBD_COLLISION_TRIANGLES: 2048
  CLOTH_PBD_COLLISION_VOXEL_MM: 8
  CLOTH_PBD_COLLISION_TOLERANCE_MM: 2
  CLOTH_CI_RUNNER_MODE: ${{ inputs.runner_mode || (github.event_name == 'pull_request' && 'hosted' || 'local') }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  agent-quality:
    name: Static, architecture, workflow, and security gates
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: timeout --signal=TERM --kill-after=5s 60s python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Python and architecture checks
        run: |
          set -euo pipefail
          python -m ruff check tools/ci
          python -m ruff format --check tools/ci
          python tools/check_documentation_contract.py
          python tools/ci/validate_ci_structure.py
          lint-imports
          pyright -p pyrightconfig.agent-strict.json
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py' > "$RUNNER_TEMP/changed-python.txt" || true
          if [ -s "$RUNNER_TEMP/changed-python.txt" ]; then xargs -r python tools/check_dead_code.py < "$RUNNER_TEMP/changed-python.txt"; fi
          python -m pytest -q tests/test_property_contracts.py
          crosshair check --analysis_kind asserts tools/crosshair_contracts.py
      - name: Workflow linters
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files actionlint
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files zizmor
          timeout --signal=TERM --kill-after=5s 60s python -m pre_commit run --all-files yamllint
      - name: PR duplication gate
        if: ${{ github.event_name == 'pull_request' }}
        uses: kucherenko/jscpd@b6f832c62cf02b574ea9cf24e013cfeb17366a35 # v5.4.0
        with:
          path: "freecad_cloth tools/ci"
          format: "python"
          min-lines: "8"
          min-tokens: "70"
          baseline-from-ref: "origin/${{ github.base_ref }}"
          fail-on-new-clones: "true"
          fail-on-empty: "true"

  local_runner_readiness:
    name: Selected runner readiness
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 2
    steps:
      - run: timeout --signal=TERM --kill-after=5s 20s docker info >/dev/null

  runner_watchdog:
    name: Local runner watchdog with hosted fallback
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.runner_mode != 'hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prefer local, otherwise dispatch hosted
        env:
          REPO: ${{ github.repository }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
        run: timeout --signal=TERM --kill-after=5s 60s python3 tools/ci/runner_watchdog.py

  pbd_validation_image:
    name: Build/publish pinned PBD image
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: image
        name: Derive immutable PBD image tag
        run: |
          set -euo pipefail
          digest="$(sha256sum < docker/freecad-ci/Dockerfile | cut -d' ' -f1)"
          short_digest="$(printf '%s' "$digest" | cut -c1-32)"
          echo "image=ghcr.io/uhrendoktor/freecad-cloth/pbd-validation:$short_digest" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/pbd-image
        with:
          image: ${{ steps.image.outputs.image }}

  diagnostic-pbd-contact:
    name: Diagnostic PBD contact controls
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_controls) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'cube-ladder-2481') || contains(github.event.pull_request.head.ref, 'avatar-ladder-2482'))) }}
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_pbd_contact_diagnostics.py
          timeout-seconds: "55"
          log-file: artifacts/pbd-contact-diagnostics/app-run.log
          environment: |
            CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=1
            CLOTH_PBD_SUBSTEPS=1
            CLOTH_PBD_COLLISION_TRIANGLES=2048
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_cube_ladder.py
          timeout-seconds: "55"
          log-file: artifacts/pbd-contact-diagnostics/cube-ladder-run.log
          environment: |
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/pbd-contact-diagnostics
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_avatar_ladder.py
          timeout-seconds: "55"
          log-file: artifacts/pbd-contact-diagnostics/avatar-ladder-run.log
          validate-command: python3 tools/ci/validate_manifests.py diagnostic
          artifact-name: pbd-contact-diagnostics
          artifact-path: artifacts/pbd-contact-diagnostics/**
          environment: |
            CLOTH_PBD_COLLISION_TRIANGLES=2048
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  simulation-ladder:
    name: Simulation collision ladder
    if: ${{ github.event_name != 'schedule' }}
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 8
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_pbd_cube_ladder.py
          timeout-seconds: "55"
          log-file: artifacts/simulation-ladder/cube-ladder-run.log
          environment: |
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_pbd_avatar_ladder.py
          timeout-seconds: "55"
          log-file: artifacts/simulation-ladder/avatar-ladder-run.log
          validate-command: python3 tools/ci/validate_manifests.py simulation
          artifact-name: simulation-collision-ladder
          artifact-path: artifacts/simulation-ladder/**
          environment: |
            CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/simulation-ladder
            CLOTH_HEAD_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  python:
    name: Python validation (${{ matrix.group }})
    if: ${{ github.event_name != 'schedule' }}
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        group: [core, pattern, sewing, gui, pytest]
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tools/ci/python_validation.py
          timeout-seconds: "55"
          test-args: ${{ matrix.group }}
          log-file: artifacts/python-validation.log
          artifact-name: python-validation-${{ matrix.group }}
          artifact-path: artifacts/python-validation.log

  gui-simple:
    name: GUI acceptance (${{ matrix.case }})
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: sewing, script: tests/freecad_sewing_creation_smoke.py, log: artifacts/sewing-creation-smoke.log, artifact: sewing-creation-smoke, stage: "false", clean: "false", env: "CLOTH_SEWING_SMOKE_LOG=/workspace/artifacts/sewing-creation-smoke.log", pre: "python3 tests/freecad_tunic_audit.py --syntax-check"}
          - {case: avatar-pose, script: tests/freecad_avatar_pose_ui_acceptance.py, log: artifacts/avatar-pose-ui.log, artifact: avatar-pose-ui, stage: "false", clean: "false", env: ""}
          - {case: fitting, script: tests/freecad_interactive_arrange_acceptance.py, log: artifacts/interactive-arrange.log, artifact: interactive-arrange, stage: "false", clean: "false", env: ""}
          - {case: sketcher, script: tests/freecad_sketcher_acceptance.py, log: artifacts/sketcher-acceptance.log, artifact: sketcher-acceptance, stage: "true", clean: "true", env: "SKETCHER_STAGE_FILE=/workspace/artifacts/sketcher-stage.log"}
          - {case: pattern-export, script: tests/freecad_pattern_export_smoke.py, log: artifacts/pattern-production-export.log, artifact: pattern-production-export, stage: "false", clean: "false", env: "CLOTH_PATTERN_EXPORT_LOG=/workspace/artifacts/pattern-production-export.log"}
          - {case: avatar, script: tests/freecad_avatar_acceptance.py, log: artifacts/avatar-acceptance.log, artifact: avatar-acceptance, stage: "true", clean: "true", env: ""}
          - {case: surface-pen, script: tests/freecad_surface_pen_smoke.py, log: artifacts/surface-pen.log, artifact: surface-pen, stage: "true", clean: "true", env: ""}
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: ${{ matrix.script }}
          timeout-seconds: "55"
          pre-command: ${{ matrix.pre }}
          log-file: ${{ matrix.log }}
          validate-command: python3 tools/ci/validate_acceptance.py ${{ matrix.case }}
          artifact-name: ${{ matrix.artifact }}
          artifact-path: artifacts
          stage-workbench: ${{ matrix.stage }}
          clean-user: ${{ matrix.clean }}
          environment: ${{ matrix.env }}

  gui-tunic-visual:
    name: Full tunic visual and simulation audit
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_tunic_audit_production.py
          timeout-seconds: "55"
          stage-workbench: "true"
          clean-user: "true"
          log-file: artifacts/tunic-audit/freecad-tunic-audit.log
          environment: |
            CLOTH_PBD_SUBSTEPS=8
            CLOTH_PBD_COLLISION_TRIANGLES=8192
            CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_realtime_benchmark.py
          timeout-seconds: "55"
          log-file: artifacts/freecad-realtime/freecad-realtime-benchmark.log
          validate-command: timeout --signal=TERM --kill-after=5s 50s bash -lc 'python3 tools/ci/capture_pypbd_provenance.py "$FREECAD_PBD_IMAGE" artifacts/pypbd-provenance.txt && python3 tools/ci/validate_manifests.py tunic'
          artifact-name: tunic-visual-audit
          artifact-path: |
            docs/images/generated/**
            artifacts/garment-e2e.log
            artifacts/tunic-audit/**
            artifacts/freecad-realtime/**
            artifacts/pypbd-provenance.txt
          environment: CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated

  gui-turntables:
    name: README turntable evidence
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_avatar_screenshot.py
          timeout-seconds: "55"
          clean-user: "true"
          log-file: artifacts/avatar-gui-progress.log
          environment: CLOTH_CI_DISABLE_PBD=1
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          checkout: "false"
          test-script: tests/freecad_simulation_turntable.py
          timeout-seconds: "55"
          log-file: docs/images/generated/simulation-turntable-progress.log
          validate-command: timeout --signal=TERM --kill-after=5s 55s bash -lc 'python3 tools/ci/validate_manifests.py turntables && python3 tools/ci/build_visual_gifs.py turntables'
          artifact-name: readme-turntables
          artifact-path: docs/images/generated/**
          environment: |
            CLOTH_PBD_SUBSTEPS=10
            CLOTH_PBD_COLLISION_TRIANGLES=8192
            CLOTH_BLANKET_STEPS=180
            CLOTH_TURNTABLE_FRAMES=72
            CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated

  gui-visual-examples:
    name: Blanket visual example
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 6
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_visual_examples.py
          timeout-seconds: "55"
          stage-workbench: "true"
          clean-user: "true"
          log-file: docs/images/generated/blanket-example/blanket-visual.log
          validate-command: timeout --signal=TERM --kill-after=5s 55s bash -lc 'python3 tools/ci/validate_manifests.py blanket && python3 tools/ci/build_visual_gifs.py blanket'
          artifact-name: blanket-visual-example
          artifact-path: docs/images/generated/blanket-example/**
          environment: CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated

  publish-pr-simulation-evidence:
    name: Publish PR simulation evidence
    needs: [gui-tunic-visual]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/publish-visual-evidence
        with:
          mode: pr
          source-sha: ${{ github.event.pull_request.head.sha }}
          evidence-head: ${{ github.event.pull_request.head.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

  publish-readme-turntables:
    name: Publish README/wiki visual evidence
    needs: [gui-tunic-visual, gui-turntables, gui-visual-examples, gui-simple]
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.runner_mode == 'hosted' && inputs.fallback_source_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/publish-visual-evidence
        with:
          source-sha: ${{ github.sha }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          run-number: ${{ github.run_number }}

  maintenance-cleanup:
    name: Repository retention cleanup
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: write
    steps:
      - name: Retention cleanup
        env:
          REPO: ${{ github.repository }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
        run: timeout --signal=TERM --kill-after=5s 60s python3 tools/ci/maintenance_cleanup.py

  benchmark:
    name: Workbench benchmark (${{ matrix.workbench }})
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workbench: [Pattern, Sewing, Simulation]
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/freecad-test
        with:
          image: ${{ env.FREECAD_PBD_IMAGE }}
          test-script: tests/freecad_workbench_benchmark.py
          timeout-seconds: "55"
