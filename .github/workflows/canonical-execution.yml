  gui-tunic-visual:
    name: Full tunic visual and simulation audit
    needs: [local_runner_readiness, pbd_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 20
    env:
      FREECAD_PBD_IMAGE: ${{ needs.pbd_validation_image.outputs.image }}
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned PositionBasedDynamics validation image
        run: docker pull "$FREECAD_PBD_IMAGE"
      - name: Capture PositionBasedDynamics provenance
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker run --rm "$FREECAD_PBD_IMAGE" bash -lc 'cat /opt/pypbd-provenance.txt' > artifacts/pypbd-provenance.txt
          test -s artifacts/pypbd-provenance.txt

      - name: Stage workspace in Docker volume
        run: |
          set -euo pipefail
          volume="gha-workspace-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          carrier="$(docker create --entrypoint /bin/bash -v "${volume}:/workspace" "$FREECAD_PBD_IMAGE" -lc 'true')"
          echo "DOCKER_WORKSPACE_VOLUME=$volume" >> "$GITHUB_ENV"
          echo "DOCKER_WORKSPACE_CARRIER=$carrier" >> "$GITHUB_ENV"
          docker cp "$PWD/." "$carrier:/workspace/"

      - name: Run native-Sketcher tunic audit
        env:
          CLOTH_SIMULATION_BACKEND: position-based-dynamics
          CLOTH_PBD_SUBSTEPS: 8
          CLOTH_PBD_COLLISION_MODE: mesh
          CLOTH_PBD_COLLISION_TRIANGLES: 2048
          CLOTH_PBD_COLLISION_VOXEL_MM: 8
          CLOTH_PBD_COLLISION_TOLERANCE_MM: 2
        run: |
          set -euo pipefail
          rm -rf docs/images/generated artifacts/tunic-audit
          mkdir -p docs/images/generated artifacts/tunic-audit
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONUNBUFFERED=1 -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            -e CLOTH_SIMULATION_BACKEND="$CLOTH_SIMULATION_BACKEND" -e CLOTH_CI_ENABLE_PBD=1 \
            -e CLOTH_PBD_SUBSTEPS="$CLOTH_PBD_SUBSTEPS" \
            -e CLOTH_PBD_COLLISION_MODE="$CLOTH_PBD_COLLISION_MODE" \
            -e CLOTH_PBD_COLLISION_TRIANGLES="$CLOTH_PBD_COLLISION_TRIANGLES" \
            -e CLOTH_PBD_COLLISION_VOXEL_MM="$CLOTH_PBD_COLLISION_VOXEL_MM" \
            -e CLOTH_PBD_COLLISION_TOLERANCE_MM="$CLOTH_PBD_COLLISION_TOLERANCE_MM" \
            -e CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated \
            -v "${DOCKER_WORKSPACE_VOLUME}:/workspace" -w /workspace "$FREECAD_PBD_IMAGE" bash -lc '
              set -u -o pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/docs/images/generated /workspace/artifacts/tunic-audit
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1

              app_log=/workspace/artifacts/tunic-audit/freecad-tunic-audit.log
              : > "$app_log"
              echo "tunic-audit-supervisor=starting"
              echo "tunic-audit-command=/opt/freecad/AppRun /workspace/tests/freecad_tunic_audit_production.py"
              echo "tunic-audit-display=$DISPLAY"
              echo "tunic-audit-backend=$CLOTH_SIMULATION_BACKEND"
              echo "tunic-audit-substeps=$CLOTH_PBD_SUBSTEPS"
              echo "tunic-audit-collision-mode=$CLOTH_PBD_COLLISION_MODE"
              echo "tunic-audit-collision-triangles=$CLOTH_PBD_COLLISION_TRIANGLES"

              set +e
              setsid /opt/freecad/AppRun /workspace/tests/freecad_tunic_audit_production.py > "$app_log" 2>&1 &
              APP_PID=$!
              TIMED_OUT=0
              APP_DEADLINE=$((SECONDS + 300))
              echo "tunic-audit-supervisor=started pid=$APP_PID deadline_seconds=300"
              while kill -0 "$APP_PID" 2>/dev/null; do
                if [ "$SECONDS" -ge "$APP_DEADLINE" ]; then
                  TIMED_OUT=1
                  echo "tunic-audit-supervisor=timeout pid=$APP_PID elapsed_seconds=300" | tee -a "$app_log"
                  kill -TERM -- "-$APP_PID" 2>/dev/null || kill -TERM "$APP_PID" 2>/dev/null || true
                  sleep 5
                  kill -KILL -- "-$APP_PID" 2>/dev/null || kill -KILL "$APP_PID" 2>/dev/null || true
                  break
                fi
                sleep 1
              done
              wait "$APP_PID"
              APP_STATUS=$?
              set -e

              {
                echo "tunic-audit-supervisor=finished status=$APP_STATUS"
                if [ "$TIMED_OUT" -eq 1 ]; then
                  echo "tunic-audit-termination=timeout"
                elif [ "$APP_STATUS" -ge 128 ]; then
                  echo "tunic-audit-termination=signal signal=$((APP_STATUS - 128))"
                else
                  echo "tunic-audit-termination=process-exit exit_code=$APP_STATUS"
                fi
                echo "--- freecad process snapshot ---"
                ps -efww | grep -E "(/opt/freecad|FreeCAD|freecad_tunic)" | grep -v grep || true
                echo "--- Xvfb log ---"
                cat /tmp/xvfb.log || true
                echo "--- openbox log ---"
                cat /tmp/openbox.log || true
                echo "--- triangle install log ---"
                cat /tmp/triangle-install.log || true
                echo "--- FreeCAD audit log ---"
                cat "$app_log" || true
              } | tee /workspace/artifacts/tunic-audit/runtime-diagnostics.log

              if [ "$APP_STATUS" -ne 0 ]; then
                exit "$APP_STATUS"
              fi

              echo "tunic-audit-supervisor=running-realtime-benchmark"
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 60s /opt/freecad/AppRun /workspace/tests/freecad_realtime_benchmark.py > /workspace/artifacts/tunic-audit/freecad-realtime-benchmark.log 2>&1
              BENCHMARK_STATUS=$?
              cat /workspace/artifacts/tunic-audit/freecad-realtime-benchmark.log
              if [ "$BENCHMARK_STATUS" -ne 0 ]; then
                exit "$BENCHMARK_STATUS"
              fi
            '
      - name: Restore workspace from Docker volume
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_WORKSPACE_CARRIER:-}" ]; then
            exit 0
          fi
          docker cp "$DOCKER_WORKSPACE_CARRIER:/workspace/." "$PWD/"
          docker rm -f "$DOCKER_WORKSPACE_CARRIER" >/dev/null 2>&1 || true
          docker volume rm "$DOCKER_WORKSPACE_VOLUME" >/dev/null 2>&1 || true

      - name: Report tunic audit diagnostics
        if: ${{ always() }}
        run: |
          set +e
          echo "=== native-Sketcher tunic audit runtime diagnostics ==="
          if [ -f artifacts/tunic-audit/runtime-diagnostics.log ]; then
            cat artifacts/tunic-audit/runtime-diagnostics.log
          else
            echo "runtime-diagnostics.log was not produced"
          fi
          echo "=== native-Sketcher tunic audit application log ==="
          if [ -f artifacts/tunic-audit/freecad-tunic-audit.log ]; then
            cat artifacts/tunic-audit/freecad-tunic-audit.log
          else
            echo "freecad-tunic-audit.log was not produced"
          fi
          exit 0
      - name: Validate visual and simulation evidence
        run: |
          set -euo pipefail
          test -s docs/images/generated/gui-progress.log
          test -s artifacts/freecad-realtime/metrics.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("artifacts/freecad-realtime/metrics.json").read_text(encoding="utf-8"))
          assert m["finite"], m
          assert m["mean_frame_ms"] <= m["frame_budget_ms"], m
          assert m["p95_frame_ms"] <= 50.0, m
          print("realtime-performance=passed mean_frame_ms=%.2f p95_frame_ms=%.2f fps=%.2f particles=%d" % (m["mean_frame_ms"], m["p95_frame_ms"], m["fps_mean"], m["particles"]))
          PY
          grep -q 'scenario-pass' docs/images/generated/gui-progress.log
          grep -q 'realtime-preview=passed backend=position-based-dynamics' docs/images/generated/gui-progress.log
          grep -q 'drape-metrics=' docs/images/generated/gui-progress.log
          test -s docs/images/generated/cloth-simulation-draped.png
          test -s docs/images/generated/cloth-simulation-draped-front.png
          test -s docs/images/generated/cloth-simulation-draped-rear.png
          test -s docs/images/generated/cloth-simulation-draped-left.png
          test -s docs/images/generated/cloth-simulation-draped-right.png
          test -s docs/images/generated/cloth-simulation-draped-top.png
          test -s docs/images/generated/cloth-simulation-draped-bottom.png
          test -s docs/images/generated/cloth-simulation-draped-diagnostics.png
          test -s docs/images/generated/cloth-pattern-design.png
          test -s docs/images/generated/cloth-sewing.png
          test "$(find docs/images/generated/cloth-tunic-mannequin-motion-frames -maxdepth 1 -name 'motion-*.png' | wc -l)" -eq 10
          grep -q 'diagnostic-map=passed metric=stress' docs/images/generated/gui-progress.log
          grep -q 'diagnostic-stale-guard=passed' docs/images/generated/gui-progress.log
          test -s artifacts/garment-e2e.log
          grep -q 'staged-selection=passed' artifacts/garment-e2e.log
          grep -q 'sewing-mn=passed sides=2,2 segments=2' artifacts/garment-e2e.log
          grep -q 'sewing-mn-physical=passed curved-edge=true proportional=true' artifacts/garment-e2e.log
          grep -q 'seam-markers=passed 3d-and-2d=true' artifacts/garment-e2e.log
          grep -q 'arrangement=passed pieces=4' artifacts/garment-e2e.log
          grep -q 'garment-hierarchy=passed groups=Patterns,Sewing,Fabric,Avatar,Simulation' artifacts/garment-e2e.log
          grep -q 'material-presentation=passed native=true' artifacts/garment-e2e.log
          grep -q 'drape-target=passed type=Mannequin' artifacts/garment-e2e.log
          grep -q 'diagnostics=passed metric=stress' artifacts/garment-e2e.log
          grep -q 'save-reload=passed pieces=4 seam=1to1 network=2segment' artifacts/garment-e2e.log
          grep -q 'invalidation=passed seam=' artifacts/garment-e2e.log
          grep -q 'invalidation-restore=passed seam=Valid' artifacts/garment-e2e.log
          grep -q 'stale-export=blocked' artifacts/garment-e2e.log
          grep -q 'diagnostics-after-invalidation=passed metric=stress' artifacts/garment-e2e.log
          grep -q 'determinism-signature=passed' artifacts/garment-e2e.log
          grep -q 'pattern-export=passed formats=SVG,DXF' artifacts/garment-e2e.log
          grep -q 'canonical garment end-to-end acceptance passed' artifacts/garment-e2e.log
      - name: Upload tunic visual audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunic-visual-audit
          path: |
            docs/images/generated/cloth-pattern-design.png
            docs/images/generated/cloth-sewing.png
            docs/images/generated/cloth-simulation-draped*.png
            docs/images/generated/cloth-tunic-mannequin-motion-frames/*.png
            docs/images/generated/drape-visual-metrics.json
            docs/images/generated/gui-progress.log
            docs/images/generated/gui-screenshot-manifest.txt
            artifacts/garment-e2e.log
            artifacts/pypbd-provenance.txt
            artifacts/tunic-audit/freecad-tunic-audit.log
            artifacts/tunic-audit/freecad-realtime-benchmark.log
            artifacts/tunic-audit/runtime-diagnostics.log
          if-no-files-found: error
          compression-level: 1

  publish-pr-simulation-evidence:
    name: Publish PR simulation evidence
    needs: [gui-tunic-visual]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tunic visual audit artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tunic-visual-audit
          path: tunic

      - name: Publish rendered evidence without executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          review_root="tunic"
          evidence_branch="simulation-evidence/pr-$PR_NUMBER"
          worktree="$RUNNER_TEMP/simulation-evidence"
          rm -rf "$worktree"
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/$REPOSITORY.git" "$worktree"
          git -C "$worktree" fetch origin main
          git -C "$worktree" checkout --detach origin/main
          if git -C "$worktree" show-ref --verify --quiet "refs/remotes/origin/$evidence_branch"; then
            git -C "$worktree" fetch origin "refs/heads/$evidence_branch:refs/remotes/origin/$evidence_branch"
            git -C "$worktree" checkout --detach "refs/remotes/origin/$evidence_branch"
          else
            git -C "$worktree" switch --orphan "$evidence_branch"
            git -C "$worktree" rm -rf . >/dev/null 2>&1 || true
          fi
          dest="$worktree/pr-$PR_NUMBER/run-$RUN_ID"
          mkdir -p "$dest"
          mapfile -t images < <(find "$review_root" -type f -iname '*.png' | sort | grep -Ei '(tunic|draped|step-(015|045|090)|front|rear|right|left|top|bottom|diagnostic)' | head -n 18 || true)
          if [ ${#images[@]} -eq 0 ]; then
            mapfile -t images < <(find "$review_root" -type f -iname '*.png' | sort | head -n 18 || true)
          fi
          for image in "${images[@]}"; do
            cp "$image" "$dest/"
          done
          printf '%s\n' '# Simulation visual evidence' '' "PR #$PR_NUMBER, canonical workflow run $RUN_ID." "Source PR HEAD: $EVIDENCE_HEAD." '' 'Human review starts with the rendered PNGs. Logs and manifests are secondary evidence.' > "$dest/README.md"
          if [ ${#images[@]} -eq 0 ]; then
            body="$RUNNER_TEMP/simulation-review.md"
            printf '%s\n\n%s\n' '<!-- simulation-evidence -->' "No PNG evidence was produced for PR #$PR_NUMBER. This simulation run is not human-reviewable." > "$body"
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$body"
            exit 1
          fi
          git -C "$worktree" add "pr-$PR_NUMBER/run-$RUN_ID"
          git -C "$worktree" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "simulation evidence PR #$PR_NUMBER run $RUN_ID"
          git -C "$worktree" push origin "HEAD:$evidence_branch"
          body="$RUNNER_TEMP/simulation-review.md"
          {
            echo '<!-- simulation-evidence -->'
            echo "## Simulation visual evidence — PR #$PR_NUMBER / run $RUN_ID"
            echo
            echo 'Inspect the rendered images before reading the logs.'
            for image in "${images[@]:0:8}"; do
              name=$(basename "$image")
              url="https://raw.githubusercontent.com/$REPOSITORY/$evidence_branch/pr-$PR_NUMBER/run-$RUN_ID/$name"
              echo
              echo "**$name**"
              echo "![${name}]($url)"
            done
            echo
            echo "[Open complete evidence bundle](https://github.com/$REPOSITORY/tree/$evidence_branch/pr-$PR_NUMBER/run-$RUN_ID)"
          } > "$body"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$body"
