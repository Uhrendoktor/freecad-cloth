name: Canonical execution
run-name: Canonical execution

on:
  # PR synchronize is the canonical gate for feature branches; push is reserved for main.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Trusted execution mode; local prefers the self-hosted Docker runner, hosted uses GitHub-hosted runners."
        required: false
        type: choice
        default: local
        options: [local, hosted]
      fallback_source_run:
        description: "Original run ID when invoked as an automatic hosted fallback."
        required: false
        type: string
        default: ""
      diagnostic_controls:
        description: "Run diagnostic-only Tissu contact controls; never part of release-gate dependencies."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

concurrency:
  # One agent owns a PR; superseded runs are stale evidence and may be cancelled.
  group: ${{ github.event_name == 'pull_request' && format('canonical-pr-{0}', github.event.pull_request.number) || format('canonical-{0}-{1}-{2}', github.workflow, github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r3
  QT_X11_NO_MITSHM: 1
  QT_QPA_PLATFORM: xcb
  LIBGL_ALWAYS_SOFTWARE: 1
  CLOTH_CI_RUNNER_MODE: ${{ inputs.runner_mode || (github.event_name == 'pull_request' && 'hosted' || 'local') }}
  XDG_RUNTIME_DIR: /tmp/runtime-cloth

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  agent-quality:
    name: Agent-oriented static and property gates
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development toolchain
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run agent-oriented static gates
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m ruff format --check .
          python tools/check_documentation_contract.py
          lint-imports
          pyright -p pyrightconfig.agent-strict.json
          python tools/check_dead_code.py $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*.py')
          python -m pytest -q tests/test_property_contracts.py
          crosshair check --analysis_kind asserts tools/crosshair_contracts.py

  duplication:
    name: New Python duplication gate
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject newly introduced clones
        uses: kucherenko/jscpd@v5
        with:
          path: "freecad_cloth tools"
          format: "python"
          min-lines: "8"
          min-tokens: "70"
          baseline-from-ref: "origin/${{ github.base_ref }}"
          fail-on-new-clones: "true"
          fail-on-empty: "true"

  python:
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 20
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Report canonical runner mode
        run: echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull FreeCAD image
        run: docker pull "$FREECAD_IMAGE"
      - name: Run code validation
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g \
            -e PYTHONPATH=/workspace -w /workspace "$FREECAD_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 hypothesis==6.168.3 >/tmp/triangle-install.log 2>&1
              python3 -c "import triangle, hypothesis; print(triangle.__file__); print(hypothesis.__version__)" >>/tmp/triangle-install.log 2>&1
              test "$(python3 -c "import sys; print(sys.version_info[:2])")" = "(3, 12)"
              python3 -m compileall -q .
              python3 -m pytest --version

              # Files with explicit script entry points retain direct execution.
              for test in \
                tests/test_core.py \
                tests/test_mesh.py \
                tests/test_meshpart_adapter.py \
                tests/test_mesh_validation.py \
                tests/test_avatar_visual_sanity.py \
                tests/test_drape_visual_sanity.py \
                tests/test_cloth_solver.py \
                tests/test_pattern_sketch.py \
                tests/test_pattern_ir.py \
                tests/test_sketch_authority.py \
                tests/test_sewing_workbench.py \
                tests/test_sewing_creation_session.py \
                tests/test_sewing_show2d.py \
                tests/test_sewing_network.py \
                tests/test_sewing_network_gui.py \
                tests/test_sewing_network_gui_contract.py \
                tests/test_simulation_quality.py \
                tests/test_avatar_fitting.py \
                tests/test_avatar_shoulder_pose.py \
                tests/test_avatar_hierarchical_pose.py \
                tests/test_humanoid_mesh.py \
                tests/test_freecad_objects.py \
                tests/test_pattern_simulation_adapter.py \
                tests/test_freecad_gui_startup_contract.py; do
                echo "running-script-test=$test"
              python3 "$test"
              done

              # Pytest-style modules have no script runner; execute the tests explicitly.
              echo "running-pytest-suite"
              python3 -m pytest -q \
                tests/test_side_tasks.py \
                tests/test_pattern_export_semantics.py \
                tests/test_sewing_correspondence.py \
                tests/test_sewing_commands.py \
                tests/test_gui_structure.py \
                tests/test_simulation_scene.py \
                tests/test_simulation_quality_runtime.py \
                tests/test_project_structure.py \
                tests/test_agent_context_contract.py \
                tests/test_cloth_diagnostics.py \
                tests/test_seam_graph.py \
                tests/test_workbench_icons.py \
                tests/test_tunic_audit_contract.py \
                tests/test_readme_visual_contract.py \
                tests/test_sketcher_bootstrap_contract.py \
                tests/test_canonical_python_validation_contract.py \
                tests/test_tissu_contact_diagnostics_contract.py \
                tests/test_tissu_avatar_ladder_contract.py \
                tests/test_property_contracts.py
            ')"
          cleanup() {
            set +e
            docker cp "$CID:/tmp/triangle-install.log" artifacts/triangle-install.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"

  local_runner_readiness:
    name: Selected runner readiness
    if: ${{ github.event_name != 'schedule' }}
    # This is the sole runner-start sentinel. Every substantive workload depends on it.
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 2
    steps:
      - name: Record selected execution mode
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run-id=$GITHUB_RUN_ID"
            echo "runner=$RUNNER_NAME"
            echo "runner-os=$RUNNER_OS"
          } | tee artifacts/runner-mode.txt
      - name: Verify Docker capability on the selected runner
        run: timeout --signal=TERM --kill-after=5s 20s docker info >/dev/null
      - name: Upload selected execution mode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-mode
          path: artifacts/runner-mode.txt
          if-no-files-found: error
          compression-level: 1
  runner_watchdog:
    name: Local runner watchdog with hosted fallback
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.runner_mode != 'hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    steps:
      - name: Prefer the local runner, otherwise dispatch hosted mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grace_seconds=45
          interval_seconds=5
          deadline=$((SECONDS + grace_seconds))
          echo "runner-watchdog=local-preferred grace_seconds=$grace_seconds source_run=$GITHUB_RUN_ID"
          while [ "$SECONDS" -lt "$deadline" ]; do
            jobs="$(gh api --paginate "repos/$REPO/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
            state="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].status // "missing"')"
            conclusion="$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "Selected runner readiness")][0].conclusion // ""')"
            case "$state/$conclusion" in
              in_progress/*|completed/success)
                echo "runner-watchdog=local-started sentinel_status=$state sentinel_conclusion=$conclusion"
                exit 0
                ;;
              completed/*)
                echo "runner-watchdog=local-start-failed sentinel_status=$state sentinel_conclusion=$conclusion"
                break
                ;;
            esac
            echo "runner-watchdog=waiting sentinel_status=$state sentinel_conclusion=${conclusion:-none} seconds_remaining=$((deadline - SECONDS))"
            sleep "$interval_seconds"
          done

          echo "runner-watchdog=fallback reason=local-sentinel-not-started"
          ref="$GITHUB_REF_NAME"
          gh workflow run canonical-execution.yml \
            --repo "$REPO" \
            --ref "$ref" \
            -f runner_mode=hosted \
            -f fallback_source_run="$GITHUB_RUN_ID"
          echo "runner-watchdog=hosted-dispatch ref=$ref source_run=$GITHUB_RUN_ID"
          sleep 2
          gh api --method POST "repos/$REPO/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null || true
          echo "runner-watchdog=local-run-cancel-requested source_run=$GITHUB_RUN_ID"

  tissu_validation_image:
    name: Build/publish pinned Tissu validation image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Derive immutable Tissu image tag
        id: image
        run: |
          set -euo pipefail
          digest="$(cat docker/freecad-ci/Dockerfile docker/freecad-ci/apply-tissu-contact-fix.py | sha256sum | cut -d' ' -f1)"
          echo "image=ghcr.io/uhrendoktor/freecad-cloth/tissu-validation:${digest:0:32}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for published Tissu image
        id: image_cache
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Tissu image already published: $IMAGE"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "Tissu image missing; source build required: $IMAGE"
          fi
      - name: Set up Docker Buildx
        if: ${{ steps.image_cache.outputs.hit != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish pinned Tissu validation image
        if: ${{ steps.image_cache.outputs.hit != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/freecad-ci/Dockerfile
          push: true
          pull: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=freecad-cloth-tissu-validation
          cache-to: type=gha,mode=max,scope=freecad-cloth-tissu-validation,ignore-error=true
      - name: Pull pinned Tissu validation image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

  diagnostic-tissu-contact:
    name: Diagnostic Tissu contact controls
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic_controls) || (github.event_name == 'pull_request' && (contains(github.event.pull_request.head.ref, 'cube-ladder-2481') || contains(github.event.pull_request.head.ref, 'avatar-ladder-2482'))) }}
    needs: [local_runner_readiness, tissu_validation_image]
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      FREECAD_TISSU_IMAGE: ${{ needs.tissu_validation_image.outputs.image }}
      CLOTH_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Log selected execution mode
        run: |
          set -euo pipefail
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned Tissu validation image
        run: docker pull "$FREECAD_TISSU_IMAGE"
      - name: Run one-step contact controls
        run: |
          set -euo pipefail
          mkdir -p artifacts/tissu-contact-diagnostics
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=tissu -e CLOTH_CI_ENABLE_TISSU=1 \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=1 \
            -e CLOTH_TISSU_SUBSTEPS=1 -e CLOTH_TISSU_COLLISION_MODE=mesh \
            -e CLOTH_TISSU_COLLISION_TRIANGLES=2048 \
            -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/tissu-contact-diagnostics \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_TISSU_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/tissu-contact-diagnostics
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              rm -f /workspace/artifacts/tissu-contact-diagnostics/app-run.log
              setsid /opt/freecad/AppRun /workspace/tests/freecad_tissu_contact_diagnostics.py > /workspace/artifacts/tissu-contact-diagnostics/app-run.log 2>&1 &
              APP_PID=$!
              APP_DEADLINE=$((SECONDS + 300))
              echo "diagnostic-contact-supervisor=started pid=$APP_PID deadline_seconds=300"
              while kill -0 "$APP_PID" 2>/dev/null; do
                if [ "$SECONDS" -ge "$APP_DEADLINE" ]; then
                  echo "diagnostic-contact-supervisor=timeout pid=$APP_PID elapsed_seconds=300" | tee -a /workspace/artifacts/tissu-contact-diagnostics/app-run.log
                  kill -TERM -- "-$APP_PID" 2>/dev/null || kill -TERM "$APP_PID" 2>/dev/null || true
                  sleep 5
                  kill -KILL -- "-$APP_PID" 2>/dev/null || kill -KILL "$APP_PID" 2>/dev/null || true
                  break
                fi
                sleep 1
              done
              set +e
              wait "$APP_PID"
              APP_STATUS=$?
              set -e
              echo "diagnostic-contact-supervisor=finished status=$APP_STATUS" | tee -a /workspace/artifacts/tissu-contact-diagnostics/app-run.log
              exit "$APP_STATUS"
            '
      - name: Run cube complexity ladder
        run: |
          set -euo pipefail
          rm -rf artifacts/tissu-contact-diagnostics/cube-ladder
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
            -e TINI_SUBREAPER=1 -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb \
            -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=tissu -e CLOTH_CI_ENABLE_TISSU=1 \
            -e CLOTH_CONTACT_DIAGNOSTICS_EXECUTE=0 \
            -e CLOTH_DIAGNOSTIC_DIR=/workspace/artifacts/tissu-contact-diagnostics \
            -e CLOTH_HEAD_SHA="$CLOTH_HEAD_SHA" \
            -v "$PWD:/workspace" -w /workspace "$FREECAD_TISSU_IMAGE" bash -lc '
              set -euo pipefail
              python3 -m pip install --no-cache-dir triangle==20250106 >/tmp/triangle-install.log 2>&1
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/tissu-contact-diagnostics
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              PYTHONUNBUFFERED=1 timeout --signal=TERM --kill-after=10s 600s /opt/freecad/AppRun /workspace/tests/freecad_tissu_cube_ladder.py 2>&1 | tee /workspace/artifacts/tissu-contact-diagnostics/cube-ladder-run.log
            '
      - name: Validate cube ladder artifact
        run: |
          set -euo pipefail
          test -s artifacts/tissu-contact-diagnostics/cube-ladder-manifest.json
          python3 tools/agent_pbd_migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/generated/cloth-avatar-turntable.gif \
            docs/images/generated/cloth-simulation-arranged-turntable.gif \
            docs/images/generated/cloth-simulation-draped-turntable.gif \
            docs/images/generated/cloth-blanket-motion.gif \
            docs/images/generated/cloth-simulation-draped-front.png
          if git diff --cached --quiet; then
            echo "README turntables are already current."
            exit 0
          fi
          git commit -m "ci: publish stable README turntables"
          git push origin "HEAD:$branch"
  maintenance-cleanup:
    name: Repository retention cleanup
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    timeout-minutes: 10
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - name: Remove stale agent branches and old completed workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH_RETENTION_DAYS: 14
          RUN_RETENTION_DAYS: 30
        run: |
          set -euo pipefail
          branch_cutoff="$(date -u -d "-${BRANCH_RETENTION_DAYS} days" +%s)"
          run_cutoff="$(date -u -d "-${RUN_RETENTION_DAYS} days" +%s)"
          open_heads="$(gh pr list --repo "$REPO" --state open --limit 100 --json headRefName --jq '.[].headRefName')"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' |
          while IFS= read -r branch_name; do
            case "$branch_name" in
              agent/*) ;;
              *) continue ;;
            esac
            if printf '%s\n' "$open_heads" | grep -Fxq "$branch_name"; then
              echo "Keeping open-PR branch: $branch_name"
              continue
            fi
            sha="$(gh api "repos/$REPO/branches/$branch_name" --jq '.commit.sha')"
            authored="$(gh api "repos/$REPO/commits/$sha" --jq '.commit.author.date // .commit.committer.date')"
            authored_epoch="$(date -u -d "$authored" +%s)"
            if [ "$authored_epoch" -lt "$branch_cutoff" ]; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch_name"
            fi
          done
          gh api --paginate "repos/$REPO/actions/runs?per_page=100&status=completed" |
            jq -r '.workflow_runs[] | [.id, .created_at] | @tsv' |
            while IFS=$'\t' read -r run_id created_at; do
              created_epoch="$(date -u -d "$created_at" +%s)"
              if [ "$created_epoch" -lt "$run_cutoff" ]; then
                gh api --method DELETE "repos/$REPO/actions/runs/$run_id"
              fi
            done
  benchmark:
    name: Measured FreeCAD workbench benchmark
    needs: [local_runner_readiness]
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ (github.event_name == 'pull_request' || inputs.runner_mode == 'hosted') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","linux","x64","docker"]') }}
    timeout-minutes: 12
    steps:
      - name: Log selected execution mode
        run: |
          echo "ci-runner-mode=$CLOTH_CI_RUNNER_MODE"
          echo "runner=$RUNNER_NAME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pull published FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1
          timeout --signal=TERM --kill-after=30s 10m docker pull "$IMAGE"
      - name: Run isolated FreeCAD workbench measurements
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -uo pipefail
          rm -rf artifacts/workbench-benchmark
          mkdir -p artifacts/workbench-benchmark
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 -e CLOTH_SIMULATION_BACKEND=tissu -e CLOTH_CI_ENABLE_TISSU=1 -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            python3 -c "import tissu, pytest; print(\"Tissu\", tissu.__file__); print(\"pytest\", pytest.__version__)"
            mkdir -p "$XDG_RUNTIME_DIR"
            Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
            openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
            trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display :99 >/dev/null 2>&1
            for wb in Pattern Sewing Simulation; do
              echo "=== benchmark: $wb ==="
              rm -f /tmp/cloth-benchmark-trace.log
              CLOTH_BENCHMARK_WORKBENCH="$wb" CLOTH_BENCHMARK_OUTPUT="artifacts/workbench-benchmark/$wb.json" CLOTH_BENCHMARK_REPEATS=7 timeout --signal=TERM --kill-after=10s 180s /opt/freecad/AppRun tests/freecad_workbench_benchmark.py
              test -s "artifacts/workbench-benchmark/$wb.json"
            done
          ')"
          cleanup() {
            set +e
            docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/ 2>/dev/null || true
            docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
            docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
            docker cp "$CID:/tmp/openbox.log" artifacts/workbench-benchmark/openbox.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "FreeCAD benchmark failed with status $status"
            exit "$status"
          fi
          docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/
          docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
          docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
          python3 tools/merge_workbench_benchmark.py artifacts/workbench-benchmark
      - name: Install plotting dependency
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workbench-benchmark-venv"
          "$RUNNER_TEMP/workbench-benchmark-venv/bin/python" -m pip install --disable-pip-version-check matplotlib
      - name: Generate benchmark plots
        run: |
          "$RUNNER_TEMP/workbench-benchmark-venv/bin/python" tools/plot_workbench_benchmark.py artifacts/workbench-benchmark/benchmark.json artifacts/workbench-benchmark/plots
      - name: Upload benchmark measurements and plots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-benchmark
          path: artifacts/workbench-benchmark
          if-no-files-found: warn
          compression-level: 1


  # AGENT-REFactor-BEGIN
  agent-refactor:
    name: Apply PositionBasedDynamics migration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'replace-tissu-with-positionbaseddynamics' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply migration
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          python3 tools/agent_pbd_migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "ci: apply PositionBasedDynamics migration"
          git push origin "HEAD:${BRANCH}"
  # AGENT-REFactor-END
