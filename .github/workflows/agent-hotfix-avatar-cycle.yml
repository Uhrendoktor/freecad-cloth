name: Agent hotfix avatar cycle
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove reverse dependency assignments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freecad_cloth/avatar/AvatarCommands.py')
          s = p.read_text()
          old1 = '''    if attach_collision:\n        collision = _ensure_collision(obj)\n        target = _ensure_drape_target(obj)\n        obj.CollisionProxy = collision\n        obj.DrapeTarget = target\n'''
          new1 = '''    if attach_collision:\n        _ensure_collision(obj)\n        _ensure_drape_target(obj)\n'''
          old2 = '''    obj.CollisionProxy = _ensure_collision(obj)\n    target = doc.getObject("DrapeTarget")\n    if target is None:\n        target = _ensure_drape_target(obj)\n    obj.DrapeTarget = target\n'''
          new2 = '''    _ensure_collision(obj)\n    target = doc.getObject("DrapeTarget")\n    if target is None:\n        target = _ensure_drape_target(obj)\n'''
          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1); changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1); changed = True
          if not changed:
              raise SystemExit('expected reverse-link blocks not found')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freecad_cloth/avatar/AvatarCommands.py
          git commit -m 'fix: avoid avatar dependency cycles'
          git push
