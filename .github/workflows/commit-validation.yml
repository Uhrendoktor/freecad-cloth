name: Commit validation
run-name: Commit validation

# PR updates run fast feedback by default. Add [full-validation] to the PR title for an explicit full run.
# Merge-queue candidates always receive the dedicated Required pre-merge validation gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      diagnostic_controls:
        description: Run diagnostic-only PBD contact controls.
        required: false
        type: boolean
        default: false
      execution_mode:
        description: Manually dispatched runs use full validation.
        required: false
        type: choice
        default: full
        options: [full]
      pr_number:
        description: Optional PR number for explicitly requested full validation and simulation evidence.
        required: false
        type: string
        default: ""
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('commit-validation-pr-{0}', github.event.pull_request.number) || format('commit-validation-{0}-{1}-{2}', github.event_name, github.ref, github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  safe-ruff-autofix:
    name: Safe Ruff autofix (explicit pull-request opt-in)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 2842 && github.event.pull_request.head.ref == 'agents/strict-python-all-files' && github.event.pull_request.user.login == 'Uhrendoktor' && contains(github.event.pull_request.title, '[apply-safe-ruff]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Apply Ruff formatting and safe lint fixes, then push the patch
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_BRANCH" =~ ^[A-Za-z0-9._/-]+$ || "$PR_BRANCH" == *".."* ]]; then
            echo "::error::Unsafe pull-request branch name; refusing to push autofixes."
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/python" -m pip install --disable-pip-version-check "ruff==0.17.2"

          mapfile -d '' tracked_files < <(git ls-files -z -- '*.py' '*.pyi')
          if (( ${#tracked_files[@]} == 0 )); then
            echo "::error::No tracked Python sources or stubs were found."
            exit 1
          fi

          "$RUNNER_TEMP/ruff-venv/bin/python" -m ruff format "${tracked_files[@]}"
          set +e
          "$RUNNER_TEMP/ruff-venv/bin/python" -m ruff check --fix "${tracked_files[@]}"
          lint_status=$?
          set -e
          if (( lint_status > 1 )); then
            echo "::error::Ruff safe autofix could not complete (exit=$lint_status)."
            exit "$lint_status"
          fi
          echo "ruff-safe-autofix-lint-exit=$lint_status"

          remote_sha="$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::PR branch advanced during Ruff autofix; refusing to apply a stale patch."
            exit 1
          fi

          git diff --check
          changed_paths="$(git diff --name-only)"
          if [[ -z "$changed_paths" ]]; then
            echo "ruff-autofix=no-changes"
            exit 0
          fi
          while IFS= read -r path; do
            [[ "$path" == *.py || "$path" == *.pyi ]] || {
              echo "::error::Autofix changed a non-Python path: $path"
              exit 1
            }
          done <<< "$changed_paths"

          git add -- "${tracked_files[@]}"
          if git diff --cached --quiet; then
            echo "ruff-autofix=no-staged-changes"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply safe repository-wide Ruff autofixes"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "ruff-autofix=committed files=$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')"

  fast-feedback:
    name: Fast PR feedback
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.title, '[full-validation]') }}
    # Ceiling required by full/publication jobs in the reusable workflow; fast jobs are explicitly read-only there.
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/canonical-execution.yml
    with:
      execution_mode: fast
      diagnostic_controls: false
      pr_number: ""

  explicit-full-validation:
    name: Explicit full validation
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && contains(github.event.pull_request.title, '[full-validation]') }}
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/canonical-execution.yml
    with:
      execution_mode: full
      diagnostic_controls: false
      pr_number: ${{ github.event.pull_request.number }}

  full-validation:
    name: Full validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execution_mode == 'full' }}
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/canonical-execution.yml
    with:
      execution_mode: full
      diagnostic_controls: ${{ inputs.diagnostic_controls || false }}
      pr_number: ${{ inputs.pr_number || '' }}

  scheduled-validation:
    name: Scheduled static validation
    if: ${{ github.event_name == 'schedule' }}
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/canonical-execution.yml
    with:
      execution_mode: scheduled
      diagnostic_controls: false
      pr_number: ""
