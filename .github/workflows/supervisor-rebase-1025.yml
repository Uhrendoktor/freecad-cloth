name: Supervisor rebase release 1025

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Rebase release branch onto current main
        run: |
          set -euo pipefail
          target='agent/issue-1017-release-foundation-20260923'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/heads/$target:refs/remotes/origin/$target"
          git checkout -B "$target" refs/remotes/origin/$target
          git merge --no-ff --no-edit refs/remotes/origin/main
          test "$(git status --porcelain)" = ''
          git push --force-with-lease origin "HEAD:refs/heads/$target"
      - name: Remove helper from main
        if: always()
        run: |
          set +e
          git checkout main
          git rm .github/workflows/supervisor-rebase-1025.yml
          git commit -m 'chore: remove temporary 1025 rebase helper'
          git push origin HEAD:refs/heads/main
