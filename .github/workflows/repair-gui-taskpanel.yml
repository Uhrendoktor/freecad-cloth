name: Repair GUI task panel

on:
  push:
    branches: [fix/freecad-screenshot-initgui-loading]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/freecad-screenshot-initgui-loading
          fetch-depth: 0
      - name: Fix task panel lifecycle and screenshot assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/freecad_screenshot.py")
          text = path.read_text(encoding="utf-8")
          old = '''                task_view = Gui.Control.taskPanel()\n                tabs = Gui.Control.tabPanel()\n                if task_view is None or task_view.isVisible() or (tabs is not None and tabs.isVisible()):\n                    return True\n'''
          new = '''                task_view = Gui.Control.taskPanel()\n                tabs = Gui.Control.tabPanel()\n                window = Gui.getMainWindow()\n                tasks_dock = window.findChild(QtWidgets.QDockWidget, "Tasks") if window is not None else None\n                if tasks_dock is not None and not tasks_dock.isVisible():\n                    tasks_dock.show()\n                    tasks_dock.raise_()\n                    Gui.updateGui()\n                if (task_view is None or task_view.isVisible()\n                        or (tabs is not None and tabs.isVisible())\n                        or (tasks_dock is not None and tasks_dock.isVisible())):\n                    return True\n'''
          if text.count(old) != 1:
              raise SystemExit(f"tests/freecad_screenshot.py: expected exactly one task-view visibility block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = path.read_text(encoding="utf-8")
          if 'QDockWidget, "Tasks"' not in test or 'tasks_dock.show()' not in test:
              raise SystemExit("task dock visibility repair was not installed")
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-gui-taskpanel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/freecad_screenshot.py .github/workflows/repair-gui-taskpanel.yml sitecustomize.py
          git commit -m "fix: force FreeCAD task dock visible for screenshots"
          git push origin HEAD:fix/freecad-screenshot-initgui-loading
