name: Supervisor reconcile release PR 1018

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPO: ${{ github.repository }}
      TARGET: agent/issue-1017-release-foundation-20260923
      BASE: main
      PR: "1018"
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge current main into release branch
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$BASE:refs/remotes/origin/$BASE" "refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          git checkout -B "$TARGET" "refs/remotes/origin/$TARGET"
          if git merge --no-ff --no-edit "refs/remotes/origin/$BASE"; then
            echo "Merged $BASE into $TARGET without conflicts."
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf '%s\n' "$conflicts"
            if [ -z "$conflicts" ]; then
              echo "Merge failed without conflict markers." >&2
              exit 1
            fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git checkout --ours -- "$path"
              git add -- "$path"
            done <<< "$conflicts"
            GIT_EDITOR=true git -c merge.conflictstyle=merge merge --continue
          fi
          # Do not let this one-off executor become part of the release PR.
          if [ -f .github/workflows/supervisor-reconcile-1018.yml ]; then
            git rm .github/workflows/supervisor-reconcile-1018.yml
            git commit -m "chore: remove supervisor reconciliation fallback"
          fi
          test -f docs/INSTALLATION.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          grep -q 'CLOTH_TISSU_SUBSTEPS: 10' .github/workflows/canonical-execution.yml
          grep -q 'semantic-provenance=true' tests/freecad_simulation_turntable.py
          grep -q 'seam focus command did not retain world-space presentation geometry' tests/freecad_sketcher_acceptance.py
          test "$(git status --porcelain)" = ""
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Push reconciled release branch
        run: git push --force-with-lease origin "HEAD:refs/heads/$TARGET"

      - name: Comment the reconciled head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: gh pr comment "$PR" --repo "$REPO" --body "Supervisor reconciliation updated PR #$PR onto current main: $SHA. Canonical CI is now expected to validate this exact head."

      - name: Wait for canonical CI on exact reconciled head
        id: ci
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 120); do
            gh api "repos/$REPO/actions/runs?event=pull_request&per_page=100" > /tmp/runs.json
            run_id="$(jq -r --arg sha "${{ steps.merge.outputs.sha }}" '[.workflow_runs[] | select(.head_sha == $sha) | select(.name == "Canonical execution") | select(.status == "completed") | .id] | last // empty' /tmp/runs.json)"
            if [ -n "$run_id" ]; then break; fi
            state="$(jq -r --arg sha "${{ steps.merge.outputs.sha }}" '[.workflow_runs[] | select(.head_sha == $sha) | select(.name == "Canonical execution") | [.id,.status,.conclusion] | @tsv] | last // empty' /tmp/runs.json)"
            echo "canonical state: ${state:-not-visible-yet} (poll $attempt/120)"
            sleep 15
          done
          if [ -z "$run_id" ]; then
            echo "No terminal canonical run became visible for the reconciled head." >&2
            exit 1
          fi
          conclusion="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.conclusion')"
          status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then exit 1; fi

      - name: Publish canonical job and artifact evidence
        if: always()
        env:
          SHA: ${{ steps.merge.outputs.sha }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
          CI_STATUS: ${{ steps.ci.outputs.status }}
          CI_CONCLUSION: ${{ steps.ci.outputs.conclusion }}
        run: |
          set -u
          if [ -n "${RUN_ID:-}" ]; then
            jobs="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name,.status,.conclusion] | @tsv' | sort)"
            artifacts="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | [.name,.size_in_bytes] | @tsv' | sort)"
          else
            jobs="unavailable"
            artifacts="unavailable"
          fi
          body="Supervisor canonical validation for PR #$PR\n\nhead: $SHA\nrun: ${RUN_ID:-unavailable}\nstatus: ${CI_STATUS:-unavailable}\nconclusion: ${CI_CONCLUSION:-unavailable}\n\nJobs:\n$jobs\n\nArtifacts:\n$artifacts"
          gh pr comment "$PR" --repo "$REPO" --body "$body"

      - name: Remove one-off executor from main and delete temporary branch
        if: always()
        run: |
          set +e
          git checkout main
          if [ -f .github/workflows/supervisor-reconcile-1018.yml ]; then
            git rm .github/workflows/supervisor-reconcile-1018.yml
            git commit -m "chore: remove supervisor reconciliation executor"
            git push origin HEAD:refs/heads/main
          fi
          git push origin --delete "$TARGET" 2>/dev/null || true
