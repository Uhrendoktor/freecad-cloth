name: GUI screenshot capability test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gui_screenshots:
        description: Generate FreeCAD GUI screenshots
        required: false
        default: true
        type: boolean

jobs:
  gui-screenshots:
    if: ${{ github.event_name == 'push' || inputs.gui_screenshots == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install FreeCAD and Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq freecad xvfb openbox
      - name: Run GUI screenshot scenario
        run: |
          mkdir -p docs/images/generated
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          openbox >/tmp/openbox.log 2>&1 &
          OPENBOX_PID=$!
          trap 'kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true' EXIT
          export DISPLAY=:99
          export QT_X11_NO_MITSHM=1
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export CLOTH_SCREENSHOT_DIR="$PWD/docs/images/generated"
          sleep 2
          timeout --signal=TERM --kill-after=5s 120s freecad tests/freecad_screenshot.py
          test -s docs/images/generated/cloth-pattern-design.png
          test -s docs/images/generated/cloth-sewing.png
          test -s docs/images/generated/cloth-simulation.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-screenshots-capability-test
          path: docs/images/generated/*.png
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloth-gui-diagnostics-capability-test
          path: |
            docs/images/generated/gui-progress.log
            /tmp/xvfb.log
            /tmp/openbox.log
