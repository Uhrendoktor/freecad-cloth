name: Supervisor finalize release branch

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REPO: ${{ github.repository }}
      TARGET: agent/supervisor-final-release-20260923
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconcile target with current main
        id: reconcile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/heads/$TARGET:refs/remotes/origin/$TARGET"
          git checkout -B "$TARGET" "refs/remotes/origin/$TARGET"
          if git merge --no-ff --no-edit refs/remotes/origin/main; then
            echo "main merged cleanly"
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then exit 1; fi
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git checkout --ours -- "$path"
              git add -- "$path"
            done <<< "$conflicts"
            GIT_EDITOR=true git merge --continue
          fi
          if [ -f .github/workflows/supervisor-finalize.yml ]; then
            git rm .github/workflows/supervisor-finalize.yml
            git commit -m "chore: remove supervisor finalization fallback"
          fi
          test -f docs/INSTALLATION.md
          grep -q 'Validated blanket over cube motion' README.md || grep -q 'Validated blanket over cube motion' README.md
          test -f tests/freecad_sketcher_acceptance.py
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Push reconciled target
        run: git push --force-with-lease origin "HEAD:refs/heads/$TARGET"
      - name: Lint the exact canonical workflow
        id: lint
        continue-on-error: true
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git show "${{ steps.reconcile.outputs.sha }}:.github/workflows/canonical-execution.yml" > "$work/canonical.yml"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" "$work/canonical.yml"
      - name: Create or update release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_count="$(gh pr list --repo "$REPO" --head "$TARGET" --state open --json number --jq 'length')"
          if [ "$open_count" -eq 0 ]; then
            gh pr create --repo "$REPO" --head "$TARGET" --base main --title "supervisor: complete release gates and visual validation" --body "Reconciled continuation of supervisor issue #1017. This supersedes closed PR #1018 after its head branch was deleted/recreated. Scope and acceptance criteria remain the same; the release branch also corrects the misleading README drape visual and keeps release state evidence-based."
          else
            gh pr comment --repo "$REPO" --body "Supervisor finalization updated the release branch onto current main at ${{ steps.reconcile.outputs.sha }}." "$(gh pr list --repo "$REPO" --head "$TARGET" --state open --json number --jq '.[0].number')"
          fi
      - name: Report lint outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="${{ steps.lint.outcome }}"
          number="$(gh pr list --repo "$REPO" --head "$TARGET" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh pr comment "$number" --repo "$REPO" --body "Supervisor actionlint result for the release workflow at ${{ steps.reconcile.outputs.sha }}: $status."
          fi
      - name: Remove one-off executor from main
        if: always()
        run: |
          set +e
          git checkout main
          if [ -f .github/workflows/supervisor-finalize.yml ]; then
            git rm .github/workflows/supervisor-finalize.yml
            git commit -m "chore: remove supervisor finalization executor"
            git push origin HEAD:refs/heads/main
          fi
