              while index < len(lines) and not lines[index].startswith("======="):
                  main_side.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated main test side")
              index += 1
              pr_side = []
              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  pr_side.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR test side")
              main_text = "".join(main_side)
              pr_text = "".join(pr_side)
              if "test_production_tunic_profile_records_native_python_and_gui_stages" not in main_text:
                  raise SystemExit("main production-profile tests are missing")
              if "test_native_arc_evaluator_returns_validated_planar_coordinates" not in pr_text:
                  raise SystemExit("PR native-arc regression is missing")
              result.extend(main_side)
              result.extend(pr_side)
              resolved += 1
              index += 1
          if resolved != 1:
              raise SystemExit(f"expected one independent appended-test conflict, found {resolved}")
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                printf '::error::Overlapping edits require manual resolution: %s\\n' "$path"
                grep -n -E '^(<<<<<<<|=======|>>>>>>>)' "$tmpdir/merged" || true
                rm -rf "$tmpdir"
                git rebase --abort
                exit 1
              done
              if ! GIT_EDITOR=true git rebase --continue; then
                if ! git diff --name-only --diff-filter=U | grep -q .; then
                  echo "::error::Rebase continuation failed without a conflict; refusing to skip commits."
                  git rebase --abort
                  exit 1
                fi
              fi
            done
          fi
          git merge-base --is-ancestor origin/main HEAD
          rebased_head="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          main_tree="$(git rev-parse "origin/main^{tree}")"
          tree_entries='[]'
          while IFS= read -r -d '' path; do
            [[ -n "$path" ]] || continue
            if [[ -e "$path" || -L "$path" ]]; then
              mode=100644
              [[ -x "$path" ]] && mode=100755
              if [[ -L "$path" ]]; then
                mode=120000
                encoded="$(readlink "$path" | base64 -w0)"
              else
                encoded="$(base64 -w0 < "$path")"
              fi
              blob_sha="$(gh api --method POST "repos/${repo}/git/blobs" -f content="$encoded" -f encoding=base64 --jq .sha)"
              entry="$(jq -n --arg path "$path" --arg mode "$mode" --arg sha "$blob_sha" '{path:$path,mode:$mode,type:"blob",sha:$sha}')"
            else
              mode="$(git ls-tree origin/main -- "$path" | awk '{print $1}')"
              [[ -n "$mode" ]] || mode=100644
              entry="$(jq -n --arg path "$path" --arg mode "$mode" '{path:$path,mode:$mode,type:"blob",sha:null}')"
            fi
            tree_entries="$(jq --argjson entry "$entry" '. + [$entry]' <<< "$tree_entries")"
          done < <(git diff --name-only -z --no-renames origin/main HEAD)
          tree_payload="$RUNNER_TEMP/pr2842-tree.json"
          jq -n --arg base_tree "$main_tree" --argjson tree "$tree_entries" '{base_tree:$base_tree,tree:$tree}' > "$tree_payload"
          merged_tree="$(gh api --method POST "repos/${repo}/git/trees" --input "$tree_payload" --jq .sha)"
          parents="$(jq -n --arg main "$main_sha" --arg original "$EXPECTED_HEAD" '[$main,$original]')"
          commit_payload="$RUNNER_TEMP/pr2842-commit.json"
          jq -n --arg message "Merge main into PR #2842 after reviewed rebase" --arg tree "$merged_tree" --argjson parents "$parents" '{message:$message,tree:$tree,parents:$parents}' > "$commit_payload"
          merge_commit="$(gh api --method POST "repos/${repo}/git/commits" --input "$commit_payload" --jq .sha)"
          echo "PR2842_MERGE_COMMIT_SHA=$merge_commit"
          echo "PR2842_MERGED_TREE_SHA=$merged_tree"
          echo "PR2842_REBASED_HEAD=$rebased_head"
          echo "PR2842_MAIN_PARENT=$main_sha"
          echo "PR2842_ORIGINAL_PARENT=$EXPECTED_HEAD"
          {
            echo "## PR #2842 branch update prepared"
            echo "- Merge commit: `$merge_commit`"
            echo "- Main parent: `$main_sha`"
            echo "- Original PR parent: `$EXPECTED_HEAD`"
            echo "- Tree from successful reviewed rebase: `$merged_tree`"
            echo "- Changed paths: $(git diff --name-only --no-renames origin/main HEAD | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
