                if [[ "$path" == "freecad_cloth/simulation/SimulationQualityRuntime.py" ]]; then
                  # Main added transient preview mesh publication after this PR forked.
                  # Keep that behavior; this PR's old side predates the publisher contract.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
