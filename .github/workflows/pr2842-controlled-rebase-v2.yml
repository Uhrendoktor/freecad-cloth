                if [[ "$path" == "tests/test_tunic_audit_contract.py" ]]; then
                  # Both branches append independent regression tests at EOF. Keep both sides
                  # of the append conflict; the main-side production-gate changes remain intact.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
