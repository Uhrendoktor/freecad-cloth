name: PR 2842 controlled rebase v2
on:
  push:
    branches:
      - agents/pr2842-controlled-rebase-v2
permissions:
  actions: write
  contents: write
  pull-requests: read
jobs:
  rebase-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase with reviewed strict-policy preservation and clean three-way merges
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 1e3fd604e503ed77608134135911d3ce91c3424a
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          pr_number=2842
          target_branch="agents/strict-python-all-files"
          pr_json="$(gh api "repos/${repo}/pulls/${pr_number}")"
          test "$(jq -r '.state' <<< "$pr_json")" = "open"
          test "$(jq -r '.base.ref' <<< "$pr_json")" = "main"
          test "$(jq -r '.head.ref' <<< "$pr_json")" = "$target_branch"
          test "$(jq -r '.head.sha' <<< "$pr_json")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name' <<< "$pr_json")" = "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
          git fetch origin main "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          test "$(git rev-parse "refs/remotes/origin/${target_branch}")" = "$EXPECTED_HEAD"
          git checkout -B "$target_branch" "refs/remotes/origin/$target_branch"
          if ! git rebase origin/main; then
            while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              if (( ${#conflicts[@]} == 0 )); then
                echo "::error::Rebase stopped without identifiable conflict files."
                git rebase --abort
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                tmpdir="$(mktemp -d)"
                if [[ "$path" == "pyrightconfig.json" ]]; then
                  # Preserve the PR's explicit repository-root strict Pyright policy.
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                git show ":1:$path" > "$tmpdir/base"
                git show ":2:$path" > "$tmpdir/main"
                git show ":3:$path" > "$tmpdir/pr"
                if git merge-file -p "$tmpdir/main" "$tmpdir/base" "$tmpdir/pr" > "$tmpdir/merged"; then
                  cat "$tmpdir/merged" > "$path"
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "tools/ci/validate_ci_structure.py" ]]; then
                  # Resolve only the known staged-vs-root Pyright policy hunk to the PR side.
                  # All other non-overlapping mainline edits remain from the clean merge-file output.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
          index = 0
          resolved = 0
          while index < len(lines):
              if not lines[index].startswith("<<<<<<< "):
                  result.append(lines[index])
                  index += 1
                  continue
              index += 1
              ours = []
              while index < len(lines) and not lines[index].startswith("======="):
                  ours.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated main side of conflict")
              index += 1
              theirs = []
              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  theirs.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR side of conflict")
              ours_text = "".join(ours)
              theirs_text = "".join(theirs)
              if "PYRIGHT_EXPECTED_INCLUDE = (" not in ours_text:
                  raise SystemExit("unexpected main-side conflict content")
              if 'PYRIGHT_EXPECTED_INCLUDE = (".",)' not in theirs_text:
                  raise SystemExit("unexpected PR strict-Pyright conflict content")
              if "PYRIGHT_EXPECTED_EXCLUDE: tuple[str, ...] = ()" not in theirs_text:
                  raise SystemExit("unexpected PR Pyright exclusion contract")
              result.extend(theirs)
              resolved += 1
              index += 1
          if resolved != 1:
              raise SystemExit(f"expected one reviewed conflict block, found {resolved}")
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "docs/developers/UI_STYLE_GUIDE.md" ]]; then
                  # Preserve the PR's keyword-only disclosure argument while retaining main's
                  # expanded UX audit and all other non-conflicting documentation updates.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
          index = 0
          resolved = 0
          while index < len(lines):
              if not lines[index].startswith("<<<<<<< "):
                  result.append(lines[index])
                  index += 1
                  continue
              index += 1
              ours = []
              while index < len(lines) and not lines[index].startswith("======="):
                  ours.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated main side of documentation conflict")
              index += 1
              theirs = []
              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  theirs.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR side of documentation conflict")
              ours_text = "".join(ours)
              theirs_text = "".join(theirs)
              if "make_disclosure(" not in ours_text or "make_disclosure(" not in theirs_text:
                  raise SystemExit("unexpected UI style guide conflict")
              if "*, expanded=False" not in theirs_text:
                  raise SystemExit("PR keyword-only disclosure contract is missing")
              result.extend(theirs)
              resolved += 1
              index += 1
          if resolved != 1:
              raise SystemExit(f"expected one reviewed disclosure conflict, found {resolved}")
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "freecad_cloth/pattern/PatternTopologyRepairGui.py" ]]; then
                  # Keep main's newer native Sketcher viewport picker and layer the PR's
                  # Protocol annotations over that implementation instead of reverting it.
                  git checkout --ours -- "$path"
                  python3 - "$path" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          replace_once("from typing import TYPE_CHECKING", "from typing import TYPE_CHECKING, Protocol")
          replace_once(
              "if TYPE_CHECKING:\n    from types import ModuleType\n\n    from PySide2 import QtWidgets as _QT_TYPE_QtWidgets\n",
              "if TYPE_CHECKING:\n"
              "    from types import ModuleType\n\n"
              "    from PySide2 import QtWidgets as _QT_TYPE_QtWidgets\n"
              "    from freecad_cloth.pattern.PatternTopologyRepair import SeamFeatureProtocol\n",
          )
          insert_after = (
              "if TYPE_CHECKING:\n"
              "    from types import ModuleType\n\n"
              "    from PySide2 import QtWidgets as _QT_TYPE_QtWidgets\n"
              "    from freecad_cloth.pattern.PatternTopologyRepair import SeamFeatureProtocol\n"
          )
          protocol = (
              "\n\nclass _ComboBoxProtocol(Protocol):\n"
              "    def addItem(self, text: str, userData: object = None) -> None: ...\n\n"
              "    def currentData(self) -> object: ...\n\n"
              "    def findData(self, value: object) -> int: ...\n\n"
              "    def setCurrentIndex(self, index: int) -> None: ...\n\n"
              "    def count(self) -> int: ...\n"
          )
          if text.count(insert_after) != 1:
              raise SystemExit("could not locate the TYPE_CHECKING import block")
          text = text.replace(insert_after, insert_after + protocol, 1)
          replace_once("    def __init__(self, doc):", "    def __init__(self, doc: object) -> None:")
          replace_once(
              "        self.rows = []",
              "        self.rows: list[tuple[SeamFeatureProtocol, str, _ComboBoxProtocol, _QT_TYPE_QtWidgets.QPushButton]] = []",
          )
          replace_once("    def accept(self):", "    def accept(self) -> bool:")
          replace_once(
              "        repairs = [\n            (seam, side, combo.currentData())",
              "        repairs: list[tuple[SeamFeatureProtocol, str, str]] = [\n"
              "            (seam, side, str(combo.currentData()))",
          )
          replace_once("    def reject(self):", "    def reject(self) -> bool:")
          replace_once("    def getStandardButtons(self):", "    def getStandardButtons(self) -> int:")
          replace_once(
              "def show_topology_repair_task(doc):",
              "def show_topology_repair_task(doc: object) -> PatternTopologyRepairTaskPanel:",
          )
          path.write_text(text, encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "freecad_cloth/pattern/PatternTopologyRepair.py" ]]; then
                  # Keep main's native Sketcher viewport-edge resolver and the PR's explicit
                  # Protocol/EdgeRecord typing. The two conflict hunks are imports and the
                  # insertion point immediately before validate_repair_target.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
          index = 0
          import_conflicts = 0
          resolver_conflicts = 0
          while index < len(lines):
              if not lines[index].startswith("<<<<<<< "):
                  result.append(lines[index])
                  index += 1
                  continue
              index += 1
              main_side = []
              while index < len(lines) and not lines[index].startswith("======="):
                  main_side.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated main topology-repair conflict")
              index += 1
              pr_side = []
              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  pr_side.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR topology-repair conflict")
              main_text = "".join(main_side)
              pr_text = "".join(pr_side)
              if "FreeCADDocumentObjectProtocol" in main_text and "Iterable, Sequence" in pr_text:
                  # Standard-library imports first, then the mainline and PR local imports.
                  result.extend(pr_side)
                  result.extend(main_side)
                  import_conflicts += 1
              elif (
                  "current_edge_candidate_for_sketch_index" in main_text
                  and "def validate_repair_target(seam, side, edge_id):" in main_text
                  and "def validate_repair_target(seam: object, side: str, edge_id: str) -> EdgeRecord:" in pr_text
              ):
                  merged_block = main_text.replace(
                      "def validate_repair_target(seam, side, edge_id):",
                      "def validate_repair_target(seam: object, side: str, edge_id: str) -> EdgeRecord:",
                  )
                  result.append(merged_block)
                  resolver_conflicts += 1
              else:
                  raise SystemExit("unexpected topology-repair conflict block")
              index += 1
          if import_conflicts != 1 or resolver_conflicts != 1:
              raise SystemExit(
                  f"expected one import and one resolver conflict, got {import_conflicts} and {resolver_conflicts}"
              )
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "freecad_cloth/simulation/SimulationQualityRuntime.py" ]]; then
                  # Main added transient preview mesh publication after this PR forked.
                  # Keep that behavior; this PR's old side predates the publisher contract.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
