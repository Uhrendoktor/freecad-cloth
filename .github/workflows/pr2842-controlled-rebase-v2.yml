              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  pr_side.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR preview-publisher side")
              main_text = "".join(main_side)
              if "_preview_mesh_publisher" not in main_text:
                  raise SystemExit("main preview-publisher behavior is not present in conflict")
              result.extend(main_side)
              resolved += 1
              index += 1
          if resolved != 1:
              raise SystemExit(f"expected one preview-publisher conflict, found {resolved}")
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "tests/test_simulation_gui.py" ]]; then
                  # Main added simulation GUI regression coverage; the PR commit only removes
                  # the now-redundant sys.path bootstrap. Keep main's tests and apply that removal.
                  git checkout --ours -- "$path"
                  python3 - "$path" <<'PY'
