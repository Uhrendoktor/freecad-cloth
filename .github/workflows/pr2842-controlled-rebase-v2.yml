name: PR 2842 controlled rebase v2
on:
  push:
    branches:
      - agents/pr2842-controlled-rebase-v2
permissions:
  actions: write
  contents: write
  pull-requests: read
  packages: read
jobs:
  rebase-and-validate:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Rebase with reviewed strict-policy preservation and clean three-way merges
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 1e3fd604e503ed77608134135911d3ce91c3424a
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          pr_number=2842
          target_branch="agents/strict-python-all-files"
          pr_json="$(gh api "repos/${repo}/pulls/${pr_number}")"
          test "$(jq -r '.state' <<< "$pr_json")" = "open"
          test "$(jq -r '.base.ref' <<< "$pr_json")" = "main"
          test "$(jq -r '.head.ref' <<< "$pr_json")" = "$target_branch"
          test "$(jq -r '.head.sha' <<< "$pr_json")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.repo.full_name' <<< "$pr_json")" = "$repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git"
          git fetch origin main "refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
          test "$(git rev-parse "refs/remotes/origin/${target_branch}")" = "$EXPECTED_HEAD"
          git checkout -B "$target_branch" "refs/remotes/origin/$target_branch"
          if ! git rebase origin/main; then
            while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
              if (( ${#conflicts[@]} == 0 )); then
                echo "::error::Rebase stopped without identifiable conflict files."
                git rebase --abort
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                tmpdir="$(mktemp -d)"
                if [[ "$path" == "pyrightconfig.json" ]]; then
                  # Preserve the PR's explicit repository-root strict Pyright policy.
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                git show ":1:$path" > "$tmpdir/base"
                git show ":2:$path" > "$tmpdir/main"
                git show ":3:$path" > "$tmpdir/pr"
                if git merge-file -p "$tmpdir/main" "$tmpdir/base" "$tmpdir/pr" > "$tmpdir/merged"; then
                  cat "$tmpdir/merged" > "$path"
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "tools/ci/validate_ci_structure.py" ]]; then
                  # Resolve only the known staged-vs-root Pyright policy hunk to the PR side.
                  # All other non-overlapping mainline edits remain from the clean merge-file output.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
          index = 0
          resolved = 0
          while index < len(lines):
              if not lines[index].startswith("<<<<<<< "):
                  result.append(lines[index])
                  index += 1
                  continue
              index += 1
              ours = []
              while index < len(lines) and not lines[index].startswith("======="):
                  ours.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated main side of conflict")
              index += 1
              theirs = []
              while index < len(lines) and not lines[index].startswith(">>>>>>> "):
                  theirs.append(lines[index])
                  index += 1
              if index >= len(lines):
                  raise SystemExit("unterminated PR side of conflict")
              ours_text = "".join(ours)
              theirs_text = "".join(theirs)
              if "PYRIGHT_EXPECTED_INCLUDE = (" not in ours_text:
                  raise SystemExit("unexpected main-side conflict content")
              if 'PYRIGHT_EXPECTED_INCLUDE = (".",)' not in theirs_text:
                  raise SystemExit("unexpected PR strict-Pyright conflict content")
              if "PYRIGHT_EXPECTED_EXCLUDE: tuple[str, ...] = ()" not in theirs_text:
                  raise SystemExit("unexpected PR Pyright exclusion contract")
              result.extend(theirs)
              resolved += 1
              index += 1
          if resolved != 1:
              raise SystemExit(f"expected one reviewed conflict block, found {resolved}")
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "docs/developers/UI_STYLE_GUIDE.md" ]]; then
                  # Preserve the PR's keyword-only disclosure argument while retaining main's
                  # expanded UX audit and all other non-conflicting documentation updates.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
          index = 0
          resolved = 0
          while index < len(lines):
