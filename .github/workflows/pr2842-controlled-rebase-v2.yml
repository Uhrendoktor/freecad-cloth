          test -n "$merge_commit"
          echo "Prepared merge commit $merge_commit with tree $tree_sha"
          git cat-file -p "$merge_commit" | sed -n '1,8p'
          git push --verbose origin "$merge_commit:refs/heads/${target_branch}"
