          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [
              line for line in lines
              if line != "from pathlib import Path"
              and line != "sys.path.insert(0, str(Path(__file__).resolve().parents[1]))"
          ]
          path.write_text("\\n".join(lines) + "\\n", encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
                fi
                if [[ "$path" == "tests/test_tunic_audit_contract.py" ]]; then
                  # Both branches append independent contract tests: retain the mainline production
                  # profiling tests and the PR's native-arc boundary regression.
                  python3 - "$tmpdir/merged" "$path" <<'PY'
          import pathlib
          import sys

          merged_path, output_path = map(pathlib.Path, sys.argv[1:])
          lines = merged_path.read_text(encoding="utf-8").splitlines(keepends=True)
          result = []
