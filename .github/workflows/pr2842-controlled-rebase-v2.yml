              elif (
                  "current_edge_candidate_for_sketch_index" in main_text
                  and "def validate_repair_target(seam, side, edge_id):" in main_text
                  and "def validate_repair_target(seam: object, side: str, edge_id: str) -> EdgeRecord:" in pr_text
              ):
                  merged_block = main_text.replace(
                      "def validate_repair_target(seam, side, edge_id):",
                      "def validate_repair_target(seam: object, side: str, edge_id: str) -> EdgeRecord:",
                  )
                  result.append(merged_block)
                  resolver_conflicts += 1
              else:
                  raise SystemExit("unexpected topology-repair conflict block")
              index += 1
          if import_conflicts != 1 or resolver_conflicts != 1:
              raise SystemExit(
                  f"expected one import and one resolver conflict, got {import_conflicts} and {resolver_conflicts}"
              )
          output_path.write_text("".join(result), encoding="utf-8")
          PY
                  git add -- "$path"
                  rm -rf "$tmpdir"
                  continue
