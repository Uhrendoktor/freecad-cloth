name: one-shot source qimage compat
on:
  push:
    branches: [fix/gui-qimage-pixel-20260830]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add QImage compatibility proxy and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/freecad_screenshot.py')
          s = p.read_text(encoding='utf-8')
          marker = '\nrun_scenario()\nprogress("script-end")'
          patch = '''\n_original_get_main_window = Gui.getMainWindow\n\nclass _ImageCompat:\n    def __init__(self, image):\n        self._image = image\n\n    def pixel(self, x, y):\n        return int(self._image.pixelColor(x, y).rgba())\n\n    def __getattr__(self, name):\n        return getattr(self._image, name)\n\nclass _GrabCompat:\n    def __init__(self, pixmap):\n        self._pixmap = pixmap\n\n    def toImage(self):\n        return _ImageCompat(self._pixmap.toImage())\n\n    def __getattr__(self, name):\n        return getattr(self._pixmap, name)\n\nclass _MainWindowCompat:\n    def __init__(self, window):\n        self._window = window\n\n    def grab(self, *args, **kwargs):\n        return _GrabCompat(self._window.grab(*args, **kwargs))\n\n    def __getattr__(self, name):\n        return getattr(self._window, name)\n\nGui.getMainWindow = lambda: _MainWindowCompat(_original_get_main_window())\n'''
          if marker not in s:
              raise SystemExit('scenario marker not found')
          p.write_text(s.replace(marker, patch + marker), encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-source-qimage-compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/freecad_screenshot.py
          git commit -m 'fix(gui): provide QImage pixel compatibility for FreeCAD harness'
          git push origin HEAD:fix/gui-qimage-pixel-20260830