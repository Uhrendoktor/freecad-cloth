name: Workbench benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  FREECAD_IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.0-py312-r2
  PYTHONPATH: /workspace

jobs:
  benchmark:
    name: Measured FreeCAD workbench benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Prepare FreeCAD image
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then exit 0; fi
          if printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io --username '${{ github.actor }}' --password-stdin >/dev/null 2>&1 && timeout 90s docker pull "$IMAGE"; then exit 0; fi
          docker buildx create --name cloth-ci --use >/dev/null 2>&1 || docker buildx use cloth-ci
          docker buildx build --progress=plain --load --tag "$IMAGE" docker/freecad-ci
      - name: Run isolated FreeCAD workbench measurements
        env:
          IMAGE: ${{ env.FREECAD_IMAGE }}
          REPEATS: ${{ github.event_name == 'pull_request' && '3' || '5' }}
        run: |
          set -uo pipefail
          rm -rf artifacts/workbench-benchmark
          mkdir -p artifacts/workbench-benchmark
          CID="$(docker create --init --security-opt seccomp=unconfined --shm-size=1g --entrypoint /bin/bash -e REPEATS="$REPEATS" -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth -e PYTHONPATH=/workspace -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 -w /workspace "$IMAGE" -euo pipefail -c '
            set -e
            mkdir -p "$XDG_RUNTIME_DIR"
            Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
            openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
            trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
            xdpyinfo -display :99 >/dev/null 2>&1
            for wb in Pattern Sewing Simulation; do
              echo "=== benchmark: $wb ==="
              rm -f /tmp/cloth-benchmark-trace.log
              CLOTH_BENCHMARK_WORKBENCH="$wb" CLOTH_BENCHMARK_OUTPUT="artifacts/workbench-benchmark/$wb.json" CLOTH_BENCHMARK_REPEATS="$REPEATS" timeout --signal=TERM --kill-after=10s 180s /opt/freecad/AppRun tests/freecad_workbench_benchmark.py
              test -s "artifacts/workbench-benchmark/$wb.json"
            done
          ')"
          cleanup() {
            set +e
            docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/ 2>/dev/null || true
            docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
            docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$PWD/." "$CID:/workspace/"
          docker start -a "$CID"
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "FreeCAD benchmark failed with status $status"
            exit "$status"
          fi
          docker cp "$CID:/workspace/artifacts/workbench-benchmark/." artifacts/workbench-benchmark/
          docker cp "$CID:/tmp/cloth-benchmark-trace.log" artifacts/workbench-benchmark/cloth-benchmark-trace.log 2>/dev/null || true
          docker cp "$CID:/tmp/xvfb.log" artifacts/workbench-benchmark/xvfb.log 2>/dev/null || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/workbench-benchmark")
          names = ["Pattern", "Sewing", "Simulation"]
          data = [json.loads((root / f"{name}.json").read_text()) for name in names]
          merged = {
              "schema": data[0]["schema"],
              "python": data[0]["python"],
              "freecad_version": data[0]["freecad_version"],
              "repeats": data[0]["repeats"],
              "workbenches": {},
          }
          for item in data:
              merged["workbenches"].update(item["workbenches"])
          (root / "benchmark.json").write_text(json.dumps(merged, indent=2, sort_keys=True) + "\n")
          PY
      - name: Install plotting dependency
        run: python3 -m pip install --disable-pip-version-check --cache-dir "$HOME/.cache/pip" matplotlib
      - name: Generate benchmark plots
        run: python3 tools/plot_workbench_benchmark.py artifacts/workbench-benchmark/benchmark.json artifacts/workbench-benchmark/plots
      - name: Upload benchmark measurements and plots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-benchmark
          path: artifacts/workbench-benchmark
          if-no-files-found: warn
          compression-level: 1
