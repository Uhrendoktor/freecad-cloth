name: Validate canonical workflow syntax

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Cancel stale canonical runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t stale_runs < <(
            gh api --paginate "repos/$REPO/actions/runs?branch=$GITHUB_HEAD_REF&per_page=100" |
              jq -r '.workflow_runs[] | select(.name == "Canonical execution" and .head_sha != $sha and .status == "in_progress") | .id' --arg sha "$EXPECTED_HEAD_SHA"
          )
          for run_id in "${stale_runs[@]}"; do
            echo "cancelling-stale-canonical-run=$run_id"
            gh api --method POST "repos/$REPO/actions/runs/$run_id/force-cancel" >/dev/null 2>&1 || true
          done
      - name: Validate workflow
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.7
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path(".github/workflows/canonical-execution.yml").read_text(encoding="utf-8"))
          print("canonical-workflow-yaml=parsed")
          PY
