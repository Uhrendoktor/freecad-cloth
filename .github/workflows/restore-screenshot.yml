name: Restore screenshot test
on:
  push:
    branches: [fix/freecad-screenshot-initgui-loading]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore complete screenshot test from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- tests/freecad_screenshot.py
          rm .github/workflows/restore-screenshot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/freecad_screenshot.py .github/workflows/restore-screenshot.yml
          git commit -m "fix: restore complete FreeCAD screenshot test"
          git push origin HEAD:fix/freecad-screenshot-initgui-loading
