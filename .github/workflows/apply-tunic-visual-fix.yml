name: apply tunic visual fix
on:
  pull_request:
    types: [synchronize]
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/pr537-tunic-visual-validation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch canonical tunic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/freecad_screenshot_source.py')
          s = p.read_text()
          s2 = s.replace('front, front_outline = make_piece("VisualTunicFront", front_y, 0.64, 0.10); back, back_outline = make_piece("VisualTunicBack", back_y, 0.64, 0.07)', 'front, front_outline = make_piece("VisualTunicFront", front_y, 0.64, 0.08); back, back_outline = make_piece("VisualTunicBack", back_y, 0.68, 0.08)', 1)
          s2 = s2.replace('def authored_shoulder_pins(piece, positions):', 'def authored_shoulder_pins(piece, positions, boundary):', 1)
          s2 = s2.replace('available = list(range(len(positions)))', 'available = [int(i) for i in boundary]', 1)
          s2 = s2.replace('front_pins = authored_shoulder_pins(front, front_positions)\n    back_pins_local = authored_shoulder_pins(back, back_positions)', 'front_pins = authored_shoulder_pins(front, front_positions, _front_boundary)\n    back_pins_local = authored_shoulder_pins(back, back_positions, _back_boundary)', 1)
          if s2 == s:
              raise SystemExit('no tunic fixture changes applied')
          p.write_text(s2)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/freecad_screenshot_source.py
          git commit -m 'fix: align tunic screenshot geometry with turntable fixture'
          git push origin HEAD:fix/pr537-tunic-visual-validation
      - name: Remove patch workflow
        if: always()
        shell: bash
        run: |
          set +e
          rm -f .github/workflows/apply-tunic-visual-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: remove one-shot tunic patch workflow' || true
          git push origin HEAD:fix/pr537-tunic-visual-validation || true
