name: apply tunic visual fix
on:
  push:
    branches:
      - fix/pr537-tunic-visual-validation
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Patch canonical tunic fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/freecad_screenshot_source.py')
          s = p.read_text()
          old = 'front, front_outline = make_piece("VisualTunicFront", front_y, 0.64, 0.10); back, back_outline = make_piece("VisualTunicBack", back_y, 0.64, 0.07)'
          new = 'front, front_outline = make_piece("VisualTunicFront", front_y, 0.64, 0.08); back, back_outline = make_piece("VisualTunicBack", back_y, 0.68, 0.08)'
          if old not in s:
              raise SystemExit('fixture geometry pattern not found')
          s = s.replace(old, new, 1)
          old = '''    def authored_shoulder_pins(piece, positions):\n        targets = (\n            (0.14 * panel_width, 0.97 * garment_height),\n            (0.86 * panel_width, 0.97 * garment_height),\n        )\n        available = list(range(len(positions)))'''
          new = '''    def authored_shoulder_pins(piece, positions, boundary):\n        targets = (\n            (0.14 * panel_width, 0.97 * garment_height),\n            (0.86 * panel_width, 0.97 * garment_height),\n        )\n        available = [int(i) for i in boundary]'''
          if old not in s:
              raise SystemExit('pin helper pattern not found')
          s = s.replace(old, new, 1)
          old = 'front_pins = authored_shoulder_pins(front, front_positions)\n    back_pins_local = authored_shoulder_pins(back, back_positions)'
          new = 'front_pins = authored_shoulder_pins(front, front_positions, _front_boundary)\n    back_pins_local = authored_shoulder_pins(back, back_positions, _back_boundary)'
          if old not in s:
              raise SystemExit('pin call pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/freecad_screenshot_source.py
          git commit -m 'fix: stabilize canonical tunic back geometry'
          git push
      - name: Remove patch workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/pr537-tunic-visual-validation
          git checkout fix/pr537-tunic-visual-validation
          rm -f .github/workflows/apply-tunic-visual-fix.yml
          git add -A
          git commit -m 'ci: remove one-shot tunic patch workflow' || true
          git push || true
