name: Repair GUI artifacts

on:
  push:
    branches: [fix/freecad-screenshot-initgui-loading]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fix GUI screenshot artifact collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/canonical-execution.yml')
          s = p.read_text()
          old = '''          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT\n          docker cp "$PWD/." "$CID:/workspace/"\n          docker start -a "$CID"\n      - name: Upload GUI artifacts'''
          new = '''          cleanup() {\n            set +e\n            docker cp "$CID:/workspace/docs/images/generated/." docs/images/generated/ 2>/dev/null || true\n            docker rm -f "$CID" >/dev/null 2>&1 || true\n          }\n          trap cleanup EXIT\n          docker cp "$PWD/." "$CID:/workspace/"\n          docker start -a "$CID"\n      - name: Upload GUI artifacts'''
          if old not in s:
              raise SystemExit('GUI cleanup block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-execution.yml
          git commit -m 'ci: copy GUI screenshots out of container'
          git push
      - name: Remove repair workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin fix/freecad-screenshot-initgui-loading
          git rm -f .github/workflows/repair-gui-artifacts.yml
          git commit -m 'ci: remove temporary GUI artifact repair workflow' || true
          git push || true
