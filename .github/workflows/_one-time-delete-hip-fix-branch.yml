name: One-time hip-fix branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-hip-fix-branch]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/fix/avatar-hip-pose-artifacts"
      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(gh api "repos/${{ github.repository }}/contents/.github/workflows/_one-time-delete-hip-fix-branch.yml?ref=main" --jq '.sha')"
          gh api --method DELETE "repos/${{ github.repository }}/contents/.github/workflows/_one-time-delete-hip-fix-branch.yml" -f message='chore: remove one-time branch cleanup workflow' -f sha="$SHA" -f branch='main'
