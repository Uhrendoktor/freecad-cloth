name: Temporary GPT-ToolsAndStorage cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_gpt_tools_cleanup.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Uhrendoktor/freecad-cloth
      KEEP_RUNS: "10"
      BRANCH_DAYS: "7"
    steps:
      - name: Apply GPT-ToolsAndStorage gc policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone, timedelta

          repo = os.environ["TARGET_REPO"]
          keep_runs = int(os.environ["KEEP_RUNS"])
          cutoff = datetime.now(timezone.utc) - timedelta(days=int(os.environ["BRANCH_DAYS"]))

          def gh_api(path, *extra):
              out = subprocess.check_output(["gh", "api", "--paginate", path, *extra], text=True)
              return [json.loads(line) for line in out.splitlines() if line.strip()]

          def gh_api_slurp(path):
              raw = subprocess.check_output(
                  ["gh", "api", "--paginate", "--slurp", path],
                  text=True,
              )
              pages = json.loads(raw)
              if pages and isinstance(pages[0], list):
                  merged = []
                  for page in pages:
                      merged.extend(page)
                  return merged
              return pages

          # GPT-ToolsAndStorage gc semantics:
          # - keep the newest KEEP_RUNS workflow runs
          # - delete merged PR head branches older than BRANCH_DAYS
          runs = gh_api_slurp(f"repos/{repo}/actions/runs?per_page=100")
          runs.sort(key=lambda x: x.get("created_at", ""), reverse=True)
          keep_ids = {r["id"] for r in runs[:keep_runs]}

          deleted_runs = []
          skipped_active = []
          for run in runs[keep_runs:]:
              if run["id"] in keep_ids:
                  continue
              if run.get("status") != "completed":
                  skipped_active.append(run["id"])
                  continue
              subprocess.check_call(["gh", "api", "--method", "DELETE",
                                    f"repos/{repo}/actions/runs/{run['id']}"])
              deleted_runs.append(run["id"])

          branches = gh_api_slurp(f"repos/{repo}/branches?per_page=100")
          current_branches = {b["name"] for b in branches}

          pulls = gh_api_slurp(f"repos/{repo}/pulls?state=closed&per_page=100&sort=updated&direction=desc")
          merged_by_branch = {}
          for page in pulls:
              if isinstance(page, list):
                  items = page
              else:
                  items = [page]
              for pr in items:
                  if not pr.get("merged_at"):
                      continue
                  branch = (pr.get("head") or {}).get("ref")
                  if not branch or branch == "main" or branch not in current_branches:
                      continue
                  ts = datetime.fromisoformat(pr["merged_at"].replace("Z", "+00:00"))
                  prev = merged_by_branch.get(branch)
                  if prev is None or ts > prev["merged_at"]:
                      merged_by_branch[branch] = {
                          "merged_at": ts,
                          "pr": pr["number"],
                          "title": pr.get("title", ""),
                      }

          deleted_branches = []
          for branch, info in sorted(merged_by_branch.items(), key=lambda item: item[1]["merged_at"]):
              if info["merged_at"] >= cutoff:
                  continue
              subprocess.check_call(["gh", "api", "--method", "DELETE",
                                    f"repos/{repo}/git/refs/heads/{branch}"])
              deleted_branches.append({
                  "branch": branch,
                  "pr": info["pr"],
                  "merged_at": info["merged_at"].isoformat(),
              })

          print(json.dumps({
              "target_repo": repo,
              "keep_runs": keep_runs,
              "workflow_runs_seen": len(runs),
              "workflow_runs_deleted": deleted_runs,
              "active_runs_preserved": skipped_active,
              "branch_cutoff": cutoff.isoformat(),
              "branches_deleted": deleted_branches,
          }, indent=2))
          PY
