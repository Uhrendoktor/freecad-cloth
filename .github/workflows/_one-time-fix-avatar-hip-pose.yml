name: One-time avatar hip pose fix

on:
  push:
    branches: [fix/avatar-hip-pose-artifacts]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[avatar-hip-pose-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/avatar-hip-pose-artifacts

      - name: Patch arm influence and add regression test
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('freecad_cloth/avatar/HumanoidMesh.py')
          text = path.read_text()
          old = '''def _arm_pose_weight(x, z, shoulder_pivot_x, height_mm):\n    """Return a smooth 0..1 influence that begins at the actual shoulder joint."""\n    pivot = abs(shoulder_pivot_x)\n    lateral = _smoothstep(pivot * 0.98, pivot * 1.12, abs(x))\n    nz = z / max(1.0, height_mm)\n    vertical = _smoothstep(0.34, 0.40, nz) * (1.0 - _smoothstep(0.88, 0.96, nz))\n    return lateral * vertical\n'''
          new = '''def _arm_pose_weight(x, z, shoulder_pivot_x, height_mm):\n    """Return a smooth influence for actual arm vertices only.\n\n    The influence must begin above the pelvis. A lower vertical gate lets\n    lateral hip vertices rotate around the shoulder pivot, producing large\n    triangular hip artifacts in orthographic validation views.\n    """\n    pivot = abs(shoulder_pivot_x)\n    lateral = _smoothstep(pivot * 0.98, pivot * 1.12, abs(x))\n    nz = z / max(1.0, height_mm)\n    vertical = _smoothstep(0.56, 0.62, nz) * (1.0 - _smoothstep(0.88, 0.96, nz))\n    return lateral * vertical\n'''
          if old not in text:
              raise SystemExit('expected _arm_pose_weight block not found')
          path.write_text(text.replace(old, new))

          test = Path('tests/test_avatar_hip_pose.py')
          test.write_text('''import unittest\n\nfrom freecad_cloth.avatar.HumanoidMesh import _arm_pose_weight\n\n\nclass AvatarHipPoseTests(unittest.TestCase):\n    def test_hip_region_has_no_arm_pose_influence(self):\n        height = 1750.0\n        self.assertEqual(_arm_pose_weight(260.0, height * 0.50, 170.0, height), 0.0)\n        self.assertEqual(_arm_pose_weight(-260.0, height * 0.50, -170.0, height), 0.0)\n\n    def test_upper_arm_region_can_receive_pose_influence(self):\n        height = 1750.0\n        self.assertGreater(_arm_pose_weight(260.0, height * 0.72, 170.0, height), 0.0)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY

      - name: Commit and remove staging workflow
        run: |
          set -euo pipefail
          rm .github/workflows/_one-time-fix-avatar-hip-pose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freecad_cloth/avatar/HumanoidMesh.py tests/test_avatar_hip_pose.py .github/workflows/_one-time-fix-avatar-hip-pose.yml
          git commit -m 'fix: keep arm pose influence out of hips [avatar-hip-pose-fix]'
          git push origin HEAD:fix/avatar-hip-pose-artifacts
