name: one-shot ci qimage fix
on:
  push:
    branches: [fix/gui-qimage-pixel-20260830]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch canonical GUI validator and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/canonical-execution.yml')
          s = p.read_text(encoding='utf-8')
          old = 'samples={int(image.pixel(x,y)) for y in range(0,image.height(),max(1,image.height()//24)) for x in range(0,image.width(),max(1,image.width()//32))}'
          new = 'samples={int(image.pixelColor(x,y).rgba()) for y in range(0,image.height(),max(1,image.height()//24)) for x in range(0,image.width(),max(1,image.width()//32))}'
          if old not in s:
              raise SystemExit('expected canonical QImage pixel call not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-ci-qimage-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-execution.yml
          git commit -m 'fix(ci): use Qt-compatible QImage pixelColor sampling'
          git push origin HEAD:fix/gui-qimage-pixel-20260830