name: Sync open PR branches with main
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Request branch updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --limit 100 --json number,headRefOid --jq '.[] | [.number, .headRefOid] | @tsv' > /tmp/open-prs.tsv
          while IFS=$'\t' read -r number head_sha; do
            test -n "$number" || continue
            echo "== PR #$number =="
            if gh api --method PUT "/repos/$REPO/pulls/$number/update-branch" -f expected_head_sha="$head_sha" >/tmp/update.json 2>/tmp/update.err; then
              cat /tmp/update.json
              echo "requested main sync for PR #$number"
            else
              cat /tmp/update.err || true
              echo "PR #$number could not be synchronized (likely merge conflict)"
            fi
          done < /tmp/open-prs.tsv
      - name: Remove temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/sync-open-prs.yml
          git add .github/workflows/sync-open-prs.yml
          git commit -m "chore(ci): remove temporary PR sync workflow"
          git push origin main
