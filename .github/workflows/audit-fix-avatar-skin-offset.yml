name: audit-fix-avatar-skin-offset
on:
  push:
    branches:
      - agent/avatar-workbench-20260830
    paths:
      - '.github/workflows/audit-fix-avatar-skin-offset.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix(avatar): apply skin offset to collision mesh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply audit fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('AvatarModel.py')
          s = p.read_text()
          s = s.replace(
              'def _radii(circumference, depth_ratio=0.39):\n    c = float(circumference)\n    return max(1.0, c / (2 * pi) * 1.18), max(1.0, c * depth_ratio / pi)\n',
              'def _radii(circumference, depth_ratio=0.39, skin_offset=0.0):\n    c = float(circumference)\n    offset = float(skin_offset)\n    return (max(1.0, c / (2 * pi) * 1.18) + offset,\n            max(1.0, c * depth_ratio / pi) + offset)\n')
          s = s.replace('chest_w, chest_d = _radii(m["chest"])', 'chest_w, chest_d = _radii(m["chest"], skin_offset=params.skin_offset)')
          s = s.replace('waist_w, waist_d = _radii(m["waist"], .40)', 'waist_w, waist_d = _radii(m["waist"], .40, params.skin_offset)')
          s = s.replace('hip_w, hip_d = _radii(m["hip"], .42)', 'hip_w, hip_d = _radii(m["hip"], .42, params.skin_offset)')
          s = s.replace('m["neck"]/(2*pi), m["neck"]/(2*pi)*.85', 'm["neck"]/(2*pi) + params.skin_offset, m["neck"]/(2*pi)*.85 + params.skin_offset')
          s = s.replace('m["neck"]/(2*pi)*.82)', 'm["neck"]/(2*pi)*.82 + params.skin_offset)')
          s = s.replace('m["neck"]/(2*pi)*1.22, m["neck"]/(2*pi)*1.08, 105', 'm["neck"]/(2*pi)*1.22 + params.skin_offset, m["neck"]/(2*pi)*1.08 + params.skin_offset, 105 + params.skin_offset')
          s = s.replace('arm_radius = m["upper_arm"] / (2*pi)', 'arm_radius = m["upper_arm"] / (2*pi) + params.skin_offset')
          s = s.replace('wrist_radius = m["wrist"] / (2*pi)', 'wrist_radius = m["wrist"] / (2*pi) + params.skin_offset')
          s = s.replace('thigh_radius = m["thigh"] / (2*pi)', 'thigh_radius = m["thigh"] / (2*pi) + params.skin_offset')
          s = s.replace('calf_radius = m["calf"] / (2*pi)', 'calf_radius = m["calf"] / (2*pi) + params.skin_offset')
          s = s.replace('m["ankle"]/(2*pi)*1.6, m["ankle"]/(2*pi)*2, 45', 'm["ankle"]/(2*pi)*1.6 + params.skin_offset, m["ankle"]/(2*pi)*2 + params.skin_offset, 45 + params.skin_offset')
          p.write_text(s)

          t = Path('tests/test_avatar_model.py')
          s = t.read_text()
          marker = '    def test_chest_change_changes_derived_geometry(self):\n'
          test = '''    def test_skin_offset_changes_collision_geometry_without_measurements(self):\n        base = AvatarParameters({}, skin_offset=0)\n        offset = AvatarParameters({}, skin_offset=12)\n        self.assertEqual(base.measurements, offset.measurements)\n        self.assertNotEqual(generate_mesh(base)[0], generate_mesh(offset)[0])\n\n'''
          if 'test_skin_offset_changes_collision_geometry_without_measurements' not in s:
              s = s.replace(marker, test + marker)
          t.write_text(s)

          import subprocess
          subprocess.run(['python', '-m', 'unittest', 'tests.test_avatar_model'], check=True)
      - name: Commit audit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AvatarModel.py tests/test_avatar_model.py
          git diff --cached --quiet || git commit -m 'fix(avatar): apply skin offset to collision mesh'
          git push
