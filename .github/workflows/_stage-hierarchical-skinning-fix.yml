name: Stage hierarchical avatar skinning fix
on:
  push:
    branches: [fix/avatar-source-skinning-weights]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const p = 'freecad_cloth/avatar/HumanoidMesh.py';
            let text = fs.readFileSync(p, 'utf8');
            const oldLoader = /def _is_arm_bone[\s\S]*?(?=\ndef _normalize_fit_axes)/;
            const newLoader = `def _bone_group(name: str) -> str | None:
                base = name[:-2] if name.endswith((".L", ".R")) else name
                if base == "clavicle":
                    return "clavicle"
                if base.startswith(("upperarm", "lowerarm", "wrist", "hand", "finger", "thumb")):
                    return "arm"
                return None


            @lru_cache(maxsize=4)
            def load_makehuman_skin_weights(vertex_count: int, path: str | None = None):
                """Load MakeHuman clavicle and arm-chain weights without collapsing the rig."""
                source = ensure_makehuman_weights(path)
                try:
                    payload = json.loads(source.read_text(encoding="utf-8", errors="strict"))
                    raw = payload["weights"]
                    groups = {key: [0.0] * vertex_count for key in ("clavicle_l", "clavicle_r", "arm_l", "arm_r")}
                    for bone_name, entries in raw.items():
                        if not bone_name.endswith((".L", ".R")):
                            continue
                        group = _bone_group(bone_name)
                        if group is None:
                            continue
                        side = "l" if bone_name.endswith(".L") else "r"
                        target = groups[f"{group}_{side}"]
                        for index, weight in entries:
                            index = int(index)
                            if 0 <= index < vertex_count:
                                target[index] = min(1.0, target[index] + max(0.0, float(weight)))
                    return {key: tuple(value) for key, value in groups.items()}
                except (KeyError, OSError, UnicodeError, ValueError, TypeError) as exc:
                    raise HumanoidMeshError("unable to parse MakeHuman skin weights %s: %s" % (source, exc)) from exc


            @lru_cache(maxsize=4)
            def load_makehuman_arm_weights(vertex_count: int, path: str | None = None):
                """Backward-compatible access to the aggregated arm-chain weights."""
                groups = load_makehuman_skin_weights(vertex_count, path)
                return groups["arm_l"], groups["arm_r"]


            def _rotate_xz(point, pivot_x, pivot_z, radians):
                x, y, z = point
                dx = x - pivot_x
                dz = z - pivot_z
                c = math.cos(radians)
                s = math.sin(radians)
                return (pivot_x + c * dx + s * dz, y, pivot_z - s * dx + c * dz)


            def _blend_weighted_pose(point, arm_weight, clavicle_weight, arm_pivot, clavicle_pivot, arm_radians, clavicle_radians):
                arm_weight = max(0.0, min(1.0, arm_weight))
                clavicle_weight = max(0.0, min(1.0, clavicle_weight))
                total = arm_weight + clavicle_weight
                if total > 1.0:
                    arm_weight /= total
                    clavicle_weight /= total
                arm_point = _rotate_xz(point, arm_pivot[0], arm_pivot[1], arm_radians)
                clavicle_point = _rotate_xz(point, clavicle_pivot[0], clavicle_pivot[1], clavicle_radians)
                torso_weight = max(0.0, 1.0 - arm_weight - clavicle_weight)
                return tuple(
                    torso_weight * point[i] + arm_weight * arm_point[i] + clavicle_weight * clavicle_point[i]
                    for i in range(3)
                )


            def _estimate_clavicle_pivots(vertices, skin_weights, shoulder_pivots, shoulder_z, height_mm):
                pivots = {}
                for side in (-1.0, 1.0):
                    key = "clavicle_l" if side < 0 else "clavicle_r"
                    weights = skin_weights[key]
                    candidates = [
                        (side * x, z, weights[index])
                        for index, (x, _y, z) in enumerate(vertices)
                        if weights[index] >= 0.35 and 0.68 <= z / max(1.0, height_mm) <= 0.82
                    ]
                    if candidates:
                        total = sum(weight for _x, _z, weight in candidates)
                        cx = sum(x * weight for x, _z, weight in candidates) / max(1e-9, total)
                        cz = sum(z * weight for _x, z, weight in candidates) / max(1e-9, total)
                        target_x = min(cx, abs(shoulder_pivots[side]) * 0.92)
                        target_x = max(abs(shoulder_pivots[side]) * 0.35, target_x)
                        pivots[side] = (side * target_x, cz)
                    else:
                        pivots[side] = (side * abs(shoulder_pivots[side]) * 0.55, shoulder_z)
                return pivots
`;
            if (!oldLoader.test(text)) throw new Error('loader block not found');
            text = text.replace(oldLoader, newLoader + '\n');
            const oldFit = /def fit_makehuman_mesh\(mesh: MeshData, parameters, arm_weights=None\)[\s\S]*?(?=\ndef _arm_pose_weight)/;
            const newFit = `def fit_makehuman_mesh(mesh: MeshData, parameters, arm_weights=None) -> MeshData:
                """Fit HM08 and pose the shoulder/arm using source-authored hierarchical weights."""
                mesh.validate()
                source = _map_makehuman_axes(mesh.vertices)
                height_mm = float(parameters.measurement("height"))
                z0, z1 = _axis_bounds(source, 2)
                base_scale = height_mm / max(1e-9, z1 - z0)
                torso_profile = [(0.0, 1.0), (1.0, 1.0)] if _is_default_measurement_shape(parameters) else _measurement_profile(parameters)
                if _is_default_measurement_shape(parameters):
                    shoulder_scale = 1.0
                else:
                    from freecad_cloth.avatar.AvatarModel import DEFAULT_MEASUREMENTS
                    shoulder_ratio = parameters.measurement("shoulder") / float(DEFAULT_MEASUREMENTS["shoulder"])
                    shoulder_scale = max(0.80, min(1.25, shoulder_ratio))
                skin_offset = float(parameters.skin_offset)
                fitted = []
                for x, y, z in source:
                    torso_scale = _profile_scale(z, torso_profile)
                    shoulder_blend = _smoothstep(0.67, 0.79, z)
                    lateral_scale = _lerp(1.0, shoulder_scale, shoulder_blend)
                    x_mm = x * base_scale * torso_scale * lateral_scale
                    y_mm = y * base_scale * torso_scale
                    radius = math.hypot(x_mm, y_mm)
                    if radius > 1e-9 and skin_offset:
                        x_mm += x_mm / radius * skin_offset
                        y_mm += y_mm / radius * skin_offset
                    fitted.append((x_mm, y_mm, z * height_mm))
                fitted = _normalize_fit_axes(tuple(fitted), parameters)
                pose = parameters.pose
                shoulder_half = float(parameters.measurement("shoulder")) / 2.0
                shoulder_z = height_mm * 0.76
                skin_weights = arm_weights
                arm_pairs = None if skin_weights is None else (skin_weights["arm_l"], skin_weights["arm_r"])
                shoulder_pivots = _estimate_shoulder_pivots(fitted, shoulder_half, shoulder_z, height_mm)
                rest_angles = _estimate_rest_arm_angles(fitted, shoulder_pivots, shoulder_z, height_mm, arm_pairs)
                clavicle_pivots = _estimate_clavicle_pivots(
                    fitted, skin_weights or {"clavicle_l": (0.0,) * len(fitted), "clavicle_r": (0.0,) * len(fitted)},
                    shoulder_pivots, shoulder_z, height_mm
                )
                default_angle = {"standing": 12.0, "sewing": 55.0, "sitting": 25.0}.get(pose.preset, 12.0)
                left_angle = default_angle if pose.preset != "standing" and float(pose.left_arm_angle) == 12.0 else float(pose.left_arm_angle)
                right_angle = default_angle if pose.preset != "standing" and float(pose.right_arm_angle) == 12.0 else float(pose.right_arm_angle)
                posed = []
                for index, point in enumerate(fitted):
                    x = point[0]
                    side = -1.0 if x < 0.0 else 1.0
                    if skin_weights is None:
                        posed.append(point)
                        continue
                    desired = left_angle if side < 0 else right_angle
                    delta = side * math.radians(desired - rest_angles.get(side, 0.0))
                    if abs(delta) <= 1e-9:
                        posed.append(point)
                        continue
                    suffix = "l" if side < 0 else "r"
                    arm_weight = skin_weights[f"arm_{suffix}"][index]
                    clavicle_weight = skin_weights[f"clavicle_{suffix}"][index]
                    arm_pivot = shoulder_pivots.get(side, side * shoulder_half)
                    clavicle_pivot = clavicle_pivots.get(side, (side * shoulder_half * 0.55, shoulder_z))
                    posed.append(_blend_weighted_pose(
                        point, arm_weight, clavicle_weight,
                        (arm_pivot, shoulder_z), clavicle_pivot,
                        delta, delta * 0.35,
                    ))
                return MeshData(tuple(posed), _reoriented_triangles(mesh.triangles))
`;
            if (!oldFit.test(text)) throw new Error('fit block not found');
            text = text.replace(oldFit, newFit);
            text = text.replace('    arm_weights = None if source_path is not None else load_makehuman_arm_weights(len(source.vertices))\n    return fit_makehuman_mesh(source, parameters, arm_weights=arm_weights)', '    skin_weights = None if source_path is not None else load_makehuman_skin_weights(len(source.vertices))\n    return fit_makehuman_mesh(source, parameters, arm_weights=skin_weights)');
            fs.writeFileSync(p, text);
            const testPath = 'tests/test_avatar_hip_pose.py';
            let test = fs.readFileSync(testPath, 'utf8');
            test = test.replace('    load_makehuman_arm_weights,\n', '    load_makehuman_arm_weights,\n    load_makehuman_skin_weights,\n    _blend_weighted_pose,\n');
            test = test.replace('        left, right = load_makehuman_arm_weights(4, str(path))', '        groups = load_makehuman_skin_weights(4, str(path))\n        left, right = load_makehuman_arm_weights(4, str(path))');
            test = test.replace('        self.assertAlmostEqual(left[1], 1.0)', '        self.assertAlmostEqual(left[1], 0.60)\n        self.assertAlmostEqual(groups["clavicle_l"][1], 0.0)\n        self.assertAlmostEqual(groups["arm_l"][1], 0.60)');
            test = test.replace('        self.assertAlmostEqual(right[2], 0.60)', '        self.assertAlmostEqual(right[2], 0.60)\n        self.assertAlmostEqual(groups["arm_r"][2], 0.60)');
            fs.writeFileSync(testPath, test);
            await github.rest.repos.createOrUpdateFileContents({owner:'Uhrendoktor',repo:'freecad-cloth',path:p,message:'fix: use hierarchical MakeHuman shoulder skinning',content:Buffer.from(fs.readFileSync(p)).toString('base64'),sha:(await github.rest.repos.getContent({owner:'Uhrendoktor',repo:'freecad-cloth',path:p,ref:context.ref.replace('refs/heads/','')})).data.sha,branch:context.ref.replace('refs/heads/','')});
            await github.rest.repos.createOrUpdateFileContents({owner:'Uhrendoktor',repo:'freecad-cloth',path:testPath,message:'test: cover hierarchical avatar skinning',content:Buffer.from(fs.readFileSync(testPath)).toString('base64'),sha:(await github.rest.repos.getContent({owner:'Uhrendoktor',repo:'freecad-cloth',path:testPath,ref:context.ref.replace('refs/heads/','')})).data.sha,branch:context.ref.replace('refs/heads/','')});
