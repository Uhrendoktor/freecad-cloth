name: Agent repair avatar dependency cycle
on:
  push:
    branches:
      - agent/fix-avatar-recompute-cycle-20260913
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove reverse FreeCAD dependency links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('freecad_cloth/avatar/AvatarCommands.py')
          s = p.read_text()
          old = '''    if attach_collision:\n        collision = _ensure_collision(obj)\n        target = _ensure_drape_target(obj)\n        obj.CollisionProxy = collision\n        obj.DrapeTarget = target\n'''
          new = '''    if attach_collision:\n        _ensure_collision(obj)\n        _ensure_drape_target(obj)\n'''
          if old not in s:
              raise SystemExit('expected avatar attachment block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add freecad_cloth/avatar/AvatarCommands.py
          git commit -m 'fix: avoid avatar collision and drape dependency cycles'
          git push
