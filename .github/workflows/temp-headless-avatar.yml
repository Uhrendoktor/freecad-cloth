name: Disposable headless avatar verification

on:
  push:
    branches: [temp/hosted-avatar-only-20260910]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Pull FreeCAD image
        env:
          IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
        run: docker pull "$IMAGE"
      - name: Verify fitted avatar axes
        env:
          IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
        run: |
          set -euo pipefail
          docker run --rm --security-opt seccomp=unconfined --shm-size=1g \
            -v "$PWD:/workspace" -w /workspace \
            -e PYTHONPATH=/workspace \
            --entrypoint /opt/freecad/AppRun "$IMAGE" \
            -c '"'"'from freecad_cloth.avatar.AvatarModel import AvatarParameters, generate_mesh
p=AvatarParameters()
v, t, landmarks = generate_mesh(p)
xs=[x for x,_,_ in v]; ys=[y for _,y,_ in v]; zs=[z for _,_,z in v]
print("BOUNDS", min(xs), max(xs), min(ys), max(ys), min(zs), max(zs))
assert max(zs)-min(zs) > 1500
assert max(zs)-min(zs) > 2*(max(ys)-min(ys))
assert len(v) > 10000 and len(t) > 10000
'"'"'
