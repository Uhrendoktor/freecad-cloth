name: Disposable Python style cleanup

on:
  push:
    branches: [agent/architecture-tooling-docs]

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.10
      - name: Normalize Python sources
        run: |
          set -euo pipefail
          ruff check --fix --unsafe-fixes . || true
          ruff format .
          ruff check .
          ruff format --check .
      - name: Commit normalized sources
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'ruff-clean'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.py'
          git commit -m 'style: normalize Python sources [stylebot]'
          git push origin HEAD:agent/architecture-tooling-docs
