name: Repair hosted fallback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'ci: repair canonical runner fallback' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Replace runner probe with hosted runner selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/canonical-execution.yml')
          s = p.read_text()
          start = s.index('  runner_selection:\n')
          end = s.index('  python:\n', start)
          replacement = '''  runner_selection:\n    name: Use GitHub-hosted fallback runner\n    runs-on: ubuntu-latest\n    outputs:\n      runner: ${{ steps.select.outputs.runner }}\n    steps:\n      - id: select\n        run: echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          Path('.github/workflows/fix-hosted-fallback.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/canonical-execution.yml .github/workflows/fix-hosted-fallback.yml
          git commit -m 'ci: repair canonical runner fallback'
          git push origin HEAD:main
