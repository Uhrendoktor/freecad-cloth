name: Stage source-weight skinning fix

on:
  push:
    branches: [fix/avatar-source-skinning-weights]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite avatar posing to use MakeHuman arm weights
        shell: python
        run: |
          from pathlib import Path

          p = Path('freecad_cloth/avatar/HumanoidMesh.py')
          text = p.read_text()
          text = text.replace('import hashlib\nimport math\n', 'import hashlib\nimport json\nimport math\n')
          text = text.replace(
              'MAKEHUMAN_BASE_SHA256 = "8e761e6624b8f54536409135d1636da63b32486a90d4897f84e121d144f6fb4c"\n',
              'MAKEHUMAN_BASE_SHA256 = "8e761e6624b8f54536409135d1636da63b32486a90d4897f84e121d144f6fb4c"\n'
              'MAKEHUMAN_WEIGHTS_URL = (\n'
              '    "https://raw.githubusercontent.com/makehumancommunity/makehuman/"\n'
              '    + MAKEHUMAN_COMMIT\n'
              '    + "/makehuman/data/rigs/default_weights.mhw"\n'
              ')\n'
              'MAKEHUMAN_WEIGHTS_SIZE = 897521\n'
              'DEFAULT_WEIGHTS_NAME = "makehuman-default-weights.mhw"\n'
              'WEIGHTS_ENV = "FREECAD_CLOTH_AVATAR_WEIGHTS"\n'
          )
          marker = '\ndef _lerp(a, b, t):\n'
          insertion = '''\n\ndef _weights_cache_path() -> Path:\n    configured = os.environ.get(CACHE_DIR_ENV, "").strip()\n    if configured:\n        return Path(configured).expanduser() / DEFAULT_WEIGHTS_NAME\n    return Path.home() / ".cache" / "freecad-cloth" / DEFAULT_WEIGHTS_NAME\n\n\ndef _verified_weights(path: Path) -> bool:\n    if not path.is_file() or path.stat().st_size != MAKEHUMAN_WEIGHTS_SIZE:\n        return False\n    try:\n        payload = json.loads(path.read_text(encoding="utf-8", errors="strict"))\n        return isinstance(payload.get("weights"), dict)\n    except (OSError, UnicodeError, ValueError):\n        return False\n\n\ndef ensure_makehuman_weights(path: str | os.PathLike[str] | None = None) -> Path:\n    """Return the pinned MakeHuman default skinning weights."""\n    override = os.environ.get(WEIGHTS_ENV, "").strip()\n    if path is not None:\n        destination = Path(path).expanduser()\n        if not destination.is_file():\n            raise HumanoidMeshError("explicit MakeHuman weights path does not exist: %s" % destination)\n        return destination\n    if override:\n        destination = Path(override).expanduser()\n        if not destination.is_file():\n            raise HumanoidMeshError("%s points to missing MakeHuman weights: %s" % (WEIGHTS_ENV, destination))\n        return destination\n\n    destination = _weights_cache_path()\n    if _verified_weights(destination):\n        return destination\n    try:\n        _download(MAKEHUMAN_WEIGHTS_URL, destination)\n    except Exception as exc:\n        raise HumanoidMeshError(\n            "unable to obtain the pinned MakeHuman default weights; "\n            "set %s to a local MHW file or allow network access (%s)" % (WEIGHTS_ENV, exc)\n        ) from exc\n    return destination\n\n\ndef _is_arm_bone(name: str, side: str) -> bool:\n    if not name.endswith(side):\n        return False\n    base = name[:-2]\n    return base.startswith(("upperarm", "lowerarm", "wrist", "hand", "finger", "thumb"))\n\n\n@lru_cache(maxsize=4)\ndef load_makehuman_arm_weights(vertex_count: int, path: str | None = None) -> tuple[tuple[float, ...], tuple[float, ...]]:\n    """Load the source mesh's arm-chain weights, mapped onto visible vertices.\n\n    The weights come from MakeHuman itself rather than a geometric distance gate.\n    Distal arm and finger vertices therefore retain full arm influence, while the\n    shoulder transition follows the authored skinning field.\n    """\n    source = ensure_makehuman_weights(path)\n    try:\n        payload = json.loads(source.read_text(encoding="utf-8", errors="strict"))\n        raw = payload["weights"]\n        left = [0.0] * vertex_count\n        right = [0.0] * vertex_count\n        for bone_name, entries in raw.items():\n            if _is_arm_bone(bone_name, ".L"):\n                target = left\n            elif _is_arm_bone(bone_name, ".R"):\n                target = right\n            else:\n                continue\n            for index, weight in entries:\n                index = int(index)\n                if 0 <= index < vertex_count:\n                    target[index] = min(1.0, target[index] + max(0.0, float(weight)))\n        return tuple(left), tuple(right)\n    except (KeyError, OSError, UnicodeError, ValueError, TypeError) as exc:\n        raise HumanoidMeshError("unable to parse MakeHuman arm weights %s: %s" % (source, exc)) from exc\n'''
          text = text.replace(marker, insertion + marker)

          old = '''def _arm_pose_weight(x, z, shoulder_pivot_x, height_mm):
    """Return a smooth influence for actual arm vertices only.

    The influence must begin above the pelvis. A lower vertical gate lets
    lateral hip vertices rotate around the shoulder pivot, producing large
    triangular hip artifacts in orthographic validation views.
    """
    pivot = abs(shoulder_pivot_x)
    lateral = _smoothstep(pivot * 0.98, pivot * 1.12, abs(x))
    nz = z / max(1.0, height_mm)
    vertical = _smoothstep(0.56, 0.62, nz) * (1.0 - _smoothstep(0.88, 0.96, nz))
    return lateral * vertical
'''
          new = '''def _arm_pose_weight(x, z, shoulder_pivot_x, height_mm, source_weight=None):
    """Return source-authored arm influence, with a geometric legacy fallback."""
    if source_weight is not None:
        return max(0.0, min(1.0, float(source_weight)))
    pivot = abs(shoulder_pivot_x)
    lateral = _smoothstep(pivot * 0.98, pivot * 1.12, abs(x))
    nz = z / max(1.0, height_mm)
    vertical = _smoothstep(0.56, 0.62, nz) * (1.0 - _smoothstep(0.88, 0.96, nz))
    return lateral * vertical
'''
          if old not in text:
              raise SystemExit('old arm pose function not found')
          text = text.replace(old, new)

          old_fit = '''    pose = parameters.pose
    shoulder_half = float(parameters.measurement("shoulder")) / 2.0
    shoulder_z = height_mm * 0.76
    shoulder_pivots = _estimate_shoulder_pivots(fitted, shoulder_half, shoulder_z, height_mm)
    rest_angles = _estimate_rest_arm_angles(fitted, shoulder_pivots, shoulder_z, height_mm)
'''
          new_fit = '''    pose = parameters.pose
    shoulder_half = float(parameters.measurement("shoulder")) / 2.0
    shoulder_z = height_mm * 0.76
    arm_weights = None
    try:
        arm_weights = load_makehuman_arm_weights(len(mesh.vertices))
    except HumanoidMeshError:
        if str(os.environ.get(WEIGHTS_ENV, "").strip()):
            raise
    shoulder_pivots = _estimate_shoulder_pivots(fitted, shoulder_half, shoulder_z, height_mm)
    if arm_weights is not None:
        for side_index, side in enumerate((-1.0, 1.0)):
            weights = arm_weights[side_index]
            lateral = sorted(
                side * x
                for index, (x, _y, z) in enumerate(fitted)
                if weights[index] >= 0.50
                and side * x > 0.0
                and 0.66 <= z / max(1.0, height_mm) <= 0.82
            )
            if lateral:
                pivot = lateral[max(0, int(len(lateral) * 0.10))]
                pivot = max(shoulder_half * 0.70, min(shoulder_half * 1.05, pivot))
                shoulder_pivots[side] = side * pivot
    rest_angles = _estimate_rest_arm_angles(fitted, shoulder_pivots, shoulder_z, height_mm)
'''
          if old_fit not in text:
              raise SystemExit('fit setup marker not found')
          text = text.replace(old_fit, new_fit)

          old_loop = '''    posed = []
    for x, y, z in fitted:
        side = -1.0 if x < 0.0 else 1.0
        pivot_x = shoulder_pivots.get(side, side * shoulder_half)
        weight = _arm_pose_weight(x, z, pivot_x, height_mm)
'''
          new_loop = '''    posed = []
    for index, (x, y, z) in enumerate(fitted):
        side = -1.0 if x < 0.0 else 1.0
        pivot_x = shoulder_pivots.get(side, side * shoulder_half)
        source_weight = None if arm_weights is None else arm_weights[0 if side < 0 else 1][index]
        weight = _arm_pose_weight(x, z, pivot_x, height_mm, source_weight)
'''
          if old_loop not in text:
              raise SystemExit('pose loop marker not found')
          text = text.replace(old_loop, new_loop)
          p.write_text(text)

          t = Path('tests/test_avatar_hip_pose.py')
          t.write_text('''import unittest\n\nfrom freecad_cloth.avatar.HumanoidMesh import _arm_pose_weight\n\n\nclass AvatarHipPoseTests(unittest.TestCase):\n    def test_hip_region_has_no_arm_pose_influence_without_source_weights(self):\n        height = 1750.0\n        self.assertEqual(_arm_pose_weight(260.0, height * 0.50, 170.0, height), 0.0)\n        self.assertEqual(_arm_pose_weight(-260.0, height * 0.50, -170.0, height), 0.0)\n\n    def test_source_weights_override_geometric_gate(self):\n        height = 1750.0\n        self.assertEqual(_arm_pose_weight(260.0, height * 0.72, 170.0, height, 0.0), 0.0)\n        self.assertEqual(_arm_pose_weight(10.0, height * 0.50, 170.0, height, 1.0), 1.0)\n        self.assertAlmostEqual(_arm_pose_weight(10.0, height * 0.50, 170.0, height, 0.35), 0.35)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')

          w = Path('.github/workflows/_stage-source-skinning-fix.yml')
          w.unlink()
      - name: Run focused regression tests
        run: python -m pytest tests/test_avatar_hip_pose.py
      - name: Commit rewritten skinning model
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add freecad_cloth/avatar/HumanoidMesh.py tests/test_avatar_hip_pose.py .github/workflows/_stage-source-skinning-fix.yml
          git commit -m "fix: use MakeHuman source arm skinning weights"
          git push
