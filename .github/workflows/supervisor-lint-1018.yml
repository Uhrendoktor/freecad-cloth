name: Supervisor lint release workflow

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
      TARGET: agent/issue-1017-release-foundation-20260923
      PR: "1018"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch release head
        run: git fetch origin "refs/heads/$TARGET:refs/remotes/origin/$TARGET"
      - name: Run actionlint on exact release workflow
        id: lint
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          git show "refs/remotes/origin/$TARGET:.github/workflows/canonical-execution.yml" > "$work/canonical-execution.yml"
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint" "$work/canonical-execution.yml" | tee "$work/actionlint.txt"
      - name: Report and self-remove
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          status="${{ steps.lint.outcome }}"
          gh pr comment "$PR" --repo "$REPO" --body "Supervisor actionlint result for PR #$PR workflow: $status. This validates the workflow file from the exact release head before further CI remediation."
          git rm .github/workflows/supervisor-lint-1018.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove supervisor workflow lint fallback"
          git push origin HEAD:refs/heads/main
