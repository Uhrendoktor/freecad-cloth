name: Render GUI screenshots in PR comments

on:
  workflow_run:
    workflows: [Canonical execution]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  render:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Download screenshots artifact
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: cloth-gui-screenshots
          path: gui-screenshots
      - name: Publish images to PR-specific branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" screenshot-repo
          cd screenshot-repo
          branch="ci/pr-${PR_NUMBER}-screenshots"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout --orphan "$branch"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p docs/images/generated
          cp ../gui-screenshots/*.png docs/images/generated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/generated/*.png
          git commit -m "ci: publish PR ${PR_NUMBER} GUI screenshots" || true
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:$branch"
      - name: Comment rendered images
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          branch="ci/pr-${PR_NUMBER}-screenshots"
          raw_base="$SERVER_URL/$REPO/raw/refs/heads/$branch/docs/images/generated"
          run_url="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "## Canonical GUI screenshots

The successful canonical GUI run generated these screenshots:

### Pattern design
![cloth-pattern-design.png]($raw_base/cloth-pattern-design.png)

### Sewing
![cloth-sewing.png]($raw_base/cloth-sewing.png)

### Simulation arranged
![cloth-simulation-arranged.png]($raw_base/cloth-simulation-arranged.png)

### Simulation draped
![cloth-simulation-draped.png]($raw_base/cloth-simulation-draped.png)

[Workflow artifact]($run_url)"