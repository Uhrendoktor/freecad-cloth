name: Disposable hosted avatar capture

on:
  push:
    branches: [temp/hosted-avatar-only-20260910]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Pull FreeCAD image
        env:
          IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
        run: docker pull "$IMAGE"
      - name: Capture avatar
        env:
          IMAGE: ghcr.io/uhrendoktor/freecad-cloth/freecad-ci:freecad-1.1.3-r1
        run: |
          set -euo pipefail
          mkdir -p artifacts/hosted-avatar
          docker run --rm --security-opt seccomp=unconfined --shm-size=1g \
            -v "$PWD:/workspace" -w /workspace \
            -e PYTHONPATH=/workspace -e DISPLAY=:99 -e XDG_RUNTIME_DIR=/tmp/runtime-cloth \
            -e QT_X11_NO_MITSHM=1 -e QT_QPA_PLATFORM=xcb -e LIBGL_ALWAYS_SOFTWARE=1 \
            --entrypoint /bin/bash "$IMAGE" -euo pipefail -c '
              set -e
              mkdir -p "$XDG_RUNTIME_DIR" /workspace/artifacts/hosted-avatar
              Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 & XVFB_PID=$!
              openbox >/tmp/openbox.log 2>&1 & OPENBOX_PID=$!
              trap "kill $OPENBOX_PID $XVFB_PID 2>/dev/null || true" EXIT
              for i in $(seq 1 20); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep 0.25; done
              xdpyinfo -display :99 >/dev/null 2>&1
              /opt/freecad/AppRun tests/hosted_avatar_visual.py
            '
      - uses: actions/upload-artifact@v6
        with:
          name: hosted-avatar-only
          path: artifacts/hosted-avatar/avatar-front.png
          if-no-files-found: error
