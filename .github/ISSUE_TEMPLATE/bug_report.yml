name: Bug report
description: Report a reproducible problem in FreeCAD Cloth
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include FreeCAD version, Cloth commit/release, OS and solver backend.
      placeholder: "FreeCAD 1.1.x, commit ..., Linux ..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest document/workflow that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a screenshot, visual-regression artifact, log, FCStd or other relevant evidence.
    validations:
      required: false
