name: FreeCAD container
description: Run a command in the canonical FreeCAD CI container with standardized Docker/X11 setup.
inputs:
  image:
    description: Immutable FreeCAD container image.
    required: true
  command:
    description: Shell command to execute in the container.
    required: true
  timeout-seconds:
    description: Hard container command timeout in seconds; maximum 60 seconds.
    required: false
    default: "60"
  environment:
    description: Optional newline-delimited KEY=VALUE environment entries for the container.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Restore workflow image artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      continue-on-error: true
      with:
        name: pbd-validation-image
        path: ${{ runner.temp }}/pbd-validation-image

    - name: Ensure CI container image is available
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IMAGE_ARTIFACT_DIR: ${{ runner.temp }}/pbd-validation-image
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        if docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "docker-image-cache=hit image=$IMAGE"
          exit 0
        fi
        image_tar="$(find "$IMAGE_ARTIFACT_DIR" -maxdepth 1 -type f -name '*.tar' -print -quit 2>/dev/null || true)"
        if [ -n "$image_tar" ]; then
          echo "docker-image-artifact=load file=$image_tar"
          docker load --input "$image_tar" >/dev/null
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "docker-image-artifact=loaded image=$IMAGE"
            exit 0
          fi
        fi
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
        for attempt in 1 2 3; do
          if timeout --signal=TERM --kill-after=5s 60s docker pull "$IMAGE"; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            sleep 1
          fi
        done
        echo "docker-pull=failed attempts=3 image=$IMAGE" >&2
        exit 1
    - name: Run command in FreeCAD container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_ENV: ${{ inputs.environment }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        env_file="$RUNNER_TEMP/freecad-container-${GITHUB_JOB}.env"
        {
          printf '%s\n' "PYTHONPATH=/workspace"
          printf '%s\n' "QT_X11_NO_MITSHM=1"
          printf '%s\n' "QT_QPA_PLATFORM=xcb"
          printf '%s\n' "LIBGL_ALWAYS_SOFTWARE=1"
          printf '%s\n' "XDG_RUNTIME_DIR=/tmp/runtime-cloth"
          printf '%s\n' "DISPLAY=:99"
          printf '%s\n' "TINI_SUBREAPER=1"
          if [ -n "$EXTRA_ENV" ]; then
            printf '%s\n' "$EXTRA_ENV"
          fi
        } >"$env_file"
        timeout_seconds="$TIMEOUT_SECONDS"
        if [ "$timeout_seconds" -gt 60 ]; then
          echo "timeout-seconds must be <= 60" >&2
          exit 2
        fi
        timeout --signal=TERM --kill-after=5s "${timeout_seconds}s" \
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
          --env-file "$env_file" \
          -v "$GITHUB_WORKSPACE:/workspace:rw" \
          -w /workspace \
          "$IMAGE" bash -lc "$INPUT_COMMAND"
