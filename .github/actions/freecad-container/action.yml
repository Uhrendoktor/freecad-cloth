name: FreeCAD container
description: Run a command in the canonical FreeCAD CI container with standardized Docker/X11 setup.
inputs:
  image:
    description: Immutable FreeCAD container image.
    required: true
  command:
    description: Shell command to execute in the container.
    required: true
  timeout-seconds:
    description: Hard container command timeout in seconds; maximum 360 seconds; the harness adds 10 seconds for diagnostics.
    required: false
    default: "120"
  environment:
    description: Optional newline-delimited KEY=VALUE environment entries for the container.
    required: false
    default: ""
  runner-writable-path:
    description: Optional safe workspace-relative directory copied back with evidence so the host runner can append evidence.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Ensure CI container image is available
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        if docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "docker-image-cache=hit image=$IMAGE"
          exit 0
        fi
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
        if timeout --signal=TERM --kill-after=10s 180s docker pull "$IMAGE"; then
          exit 0
        fi
        echo "docker-pull=failed timeout=180s image=$IMAGE" >&2
        exit 1

    - name: Transfer checkout and run command in FreeCAD container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_ENV: ${{ inputs.environment }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_COMMAND: ${{ inputs.command }}
        RUNNER_WRITABLE_PATH: ${{ inputs.runner-writable-path }}
      run: |
        set -euo pipefail
        workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
        temp_root="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        mkdir -p "$temp_root"
        job_key="$(printf '%s' "${GITHUB_JOB:-freecad}" | LC_ALL=C tr -cs 'A-Za-z0-9._-' '-')"
        run_id="${GITHUB_RUN_ID:-$$}"
        run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
        execution_key="freecad-$run_id-$run_attempt-$job_key"
        workspace_archive="$temp_root/$execution_key.tar"
        env_file="$temp_root/$execution_key.env"
        command_file="$temp_root/$execution_key.sh"
        output_root="$temp_root/$execution_key-output"
        container_id=""

        cleanup() {
          if [[ -n "$container_id" ]]; then
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          fi
          rm -f "$workspace_archive" "$env_file" "$command_file"
          rm -rf "$output_root"
        }
        trap cleanup EXIT

        timeout_seconds="$TIMEOUT_SECONDS"
        if [[ ! "$timeout_seconds" =~ ^[0-9]+$ ]] || (( timeout_seconds > 360 )); then
          echo "timeout-seconds must be an integer between 0 and 360" >&2
          exit 2
        fi

        if [[ -n "$RUNNER_WRITABLE_PATH" ]]; then
          case "$RUNNER_WRITABLE_PATH" in
            /*|..|../*|*/..|*/../*|*\\*)
              echo "runner-writable-path must stay inside the workspace" >&2
              exit 2
              ;;
          esac
          if [[ ! "$RUNNER_WRITABLE_PATH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "runner-writable-path contains unsupported characters" >&2
            exit 2
          fi
        fi

        # A self-hosted runner may itself run in a container while Docker uses a
        # different mount namespace. Export the exact checked-out tree instead of
        # bind-mounting the runner's private GITHUB_WORKSPACE path into the daemon.
        git -C "$workspace" archive --format=tar --output="$workspace_archive" HEAD
        tar -tf "$workspace_archive" >/dev/null

        {
          printf '%s\n' "PYTHONPATH=/workspace"
          printf '%s\n' "QT_X11_NO_MITSHM=1"
          printf '%s\n' "QT_QPA_PLATFORM=xcb"
          printf '%s\n' "LIBGL_ALWAYS_SOFTWARE=1"
          printf '%s\n' "XDG_RUNTIME_DIR=/tmp/runtime-cloth"
          printf '%s\n' "DISPLAY=:99"
          printf '%s\n' "TINI_SUBREAPER=1"
          if [[ -n "$EXTRA_ENV" ]]; then
            printf '%s\n' "$EXTRA_ENV"
          fi
        } >"$env_file"

        {
          printf '#!/usr/bin/env bash\n'
          printf 'set -euo pipefail\n'
          printf 'mkdir -p /workspace\n'
          printf 'tar -xf /tmp/freecad-workspace.tar -C /workspace\n'
          printf 'cd /workspace\n'
          printf 'set +e\n'
          printf 'bash -lc %q\n' "$INPUT_COMMAND"
          printf 'command_status=$?\n'
          if [[ -n "$RUNNER_WRITABLE_PATH" ]]; then
            printf 'chmod a+wx %q 2>/dev/null || true\n' "/workspace/$RUNNER_WRITABLE_PATH"
          fi
          printf 'exit "$command_status"\n'
        } >"$command_file"

        container_name="$execution_key"
        container_id="$(docker create --name "$container_name" --init --security-opt seccomp=unconfined --shm-size=1g --env-file "$env_file" --workdir /tmp "$IMAGE" bash /tmp/freecad-container-command.sh)"
        docker cp "$workspace_archive" "$container_id:/tmp/freecad-workspace.tar"
        docker cp "$command_file" "$container_id:/tmp/freecad-container-command.sh"

        set +e
        container_timeout_seconds=$((timeout_seconds + 10))
        timeout --signal=TERM --kill-after=5s "${container_timeout_seconds}s" docker start --attach "$container_id"
        status=$?
        set -e

        copy_back_directory() {
          local relative_path="$1"
          local stage_directory="$2"
          mkdir -p "$stage_directory"
          if docker cp "$container_id:/workspace/$relative_path/." "$stage_directory/" >/dev/null 2>&1; then
            mkdir -p "$workspace/$relative_path"
            cp -a "$stage_directory/." "$workspace/$relative_path/"
          fi
        }

        # Restore logs/manifests and generated visuals before validators and uploads run.
        copy_back_directory "artifacts" "$output_root/artifacts"
        copy_back_directory "docs/images/generated" "$output_root/generated"

        case "$RUNNER_WRITABLE_PATH" in
          ""|artifacts|artifacts/*|docs/images/generated|docs/images/generated/*)
            ;;
          *)
            copy_back_directory "$RUNNER_WRITABLE_PATH" "$output_root/runner-writable"
            ;;
        esac

        if [[ "$status" -ne 0 ]]; then
          echo "freecad-command-failed status=$status"
          echo "freecad-container-image=$IMAGE"
          echo "freecad-command-logs-start"
          found=0
          while IFS= read -r log; do
            found=1
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done < <(find "$workspace/artifacts" "$workspace/docs/images/generated" -type f -name '*.log' -print 2>/dev/null)
          if [[ "$found" -eq 0 ]]; then
            echo "no workflow log files found"
          fi
          echo "freecad-command-logs-end"
        fi
        exit "$status"
