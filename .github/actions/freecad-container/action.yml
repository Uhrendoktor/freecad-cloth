name: FreeCAD container
description: Run a command in the canonical FreeCAD CI container with standardized Docker/X11 setup.
inputs:
  image:
    description: Immutable FreeCAD container image.
    required: true
  command:
    description: Shell command to execute in the container.
    required: true
  timeout-seconds:
    description: Hard container command timeout in seconds; maximum 120 seconds; the harness adds 10 seconds for diagnostics.
    required: false
    default: "120"
  environment:
    description: Optional newline-delimited KEY=VALUE environment entries for the container.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Ensure CI container image is available
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        if docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "docker-image-cache=hit image=$IMAGE"
          exit 0
        fi
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
        if timeout --signal=TERM --kill-after=10s 180s docker pull "$IMAGE"; then
          exit 0
        fi
        echo "docker-pull=failed timeout=180s image=$IMAGE" >&2
        exit 1
    - name: Run command in FreeCAD container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        EXTRA_ENV: ${{ inputs.environment }}
        TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        set -euo pipefail
        env_file="$RUNNER_TEMP/freecad-container-${GITHUB_JOB}.env"
        {
          printf '%s\n' "PYTHONPATH=/workspace"
          printf '%s\n' "QT_X11_NO_MITSHM=1"
          printf '%s\n' "QT_QPA_PLATFORM=xcb"
          printf '%s\n' "LIBGL_ALWAYS_SOFTWARE=1"
          printf '%s\n' "XDG_RUNTIME_DIR=/tmp/runtime-cloth"
          printf '%s\n' "DISPLAY=:99"
          printf '%s\n' "TINI_SUBREAPER=1"
          if [ -n "$EXTRA_ENV" ]; then
            printf '%s\n' "$EXTRA_ENV"
          fi
        } >"$env_file"
        timeout_seconds="$TIMEOUT_SECONDS"
        if [ "$timeout_seconds" -gt 120 ]; then
          echo "timeout-seconds must be <= 120" >&2
          exit 2
        fi
        set +e
        container_timeout_seconds=$((timeout_seconds + 10))
        timeout --signal=TERM --kill-after=5s "${container_timeout_seconds}s" \
          docker run --rm --init --security-opt seccomp=unconfined --shm-size=1g \
          --env-file "$env_file" \
          -v "$GITHUB_WORKSPACE:/workspace:rw" \
          -w /workspace \
          "$IMAGE" bash -lc "$INPUT_COMMAND"
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          echo "freecad-command-failed status=$status"
          echo "freecad-container-selfcheck-start"
          docker run --rm --init --security-opt seccomp=unconfined "$IMAGE" bash -lc             'set -e; echo "python=$(command -v python3)"; python3 --version;              test -f /workspace/tools/ci/run_freecad.py;              test -x /opt/freecad/AppRun;              python3 -m py_compile /workspace/tools/ci/run_freecad.py;              echo "freecad-container-selfcheck=passed"' || true
          echo "freecad-container-selfcheck-end"
          echo "freecad-command-logs-start"
          found=0
          while IFS= read -r log; do
            found=1
            echo "===== $log ====="
            tail -n 200 "$log" || true
          done < <(
            find "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/docs/images/generated" \
              -type f -name '*.log' -print 2>/dev/null
          )
          if [ "$found" -eq 0 ]; then
            echo "no workflow log files found"
          fi
          echo "freecad-command-logs-end"
        fi
        exit "$status"
