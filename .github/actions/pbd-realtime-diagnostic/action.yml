name: PBD realtime preview diagnostic
description: Compare the original two-panel tunic control with a separate multi-garment outfit preview workload.
# Keep the production preview unchanged; this action isolates timed-window GC cost.
inputs:
  image:
    description: Immutable FreeCAD/PBD validation image.
    required: true
runs:
  using: composite
  steps:
    - name: Measure two-panel tunic control
      uses: ./.github/actions/freecad-test
      continue-on-error: true
      with:
        checkout: "false"
        image: ${{ inputs.image }}
        test-script: tests/freecad_realtime_benchmark.py
        pre-command: mkdir -p artifacts/freecad-realtime/control artifacts/freecad-realtime/outfit
        log-file: artifacts/freecad-realtime/control/freecad-realtime-benchmark.log
        environment: |
          CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
          CLOTH_REALTIME_FIXTURE=two-panel-tunic-pattern
          CLOTH_REALTIME_DIR=/workspace/artifacts/freecad-realtime/control
          CLOTH_PBD_SUBSTEPS=1
          CLOTH_REALTIME_FRAMES=120
          CLOTH_REALTIME_WARMUP_FRAMES=30
          CLOTH_REALTIME_DISABLE_GC_DURING_MEASUREMENT=true
          OMP_NUM_THREADS=1

    - name: Measure three-garment outfit
      uses: ./.github/actions/freecad-test
      continue-on-error: true
      with:
        checkout: "false"
        image: ${{ inputs.image }}
        test-script: tests/freecad_realtime_benchmark.py
        log-file: artifacts/freecad-realtime/outfit/freecad-realtime-benchmark.log
        environment: |
          CLOTH_SCREENSHOT_DIR=/workspace/docs/images/generated
          CLOTH_REALTIME_FIXTURE=three-garment-outfit
          CLOTH_REALTIME_DIR=/workspace/artifacts/freecad-realtime/outfit
          CLOTH_PBD_SUBSTEPS=1
          CLOTH_REALTIME_FRAMES=120
          CLOTH_REALTIME_WARMUP_FRAMES=30
          CLOTH_REALTIME_DISABLE_GC_DURING_MEASUREMENT=true
          OMP_NUM_THREADS=1
        artifact-name: realtime-preview-performance
        artifact-path: artifacts/freecad-realtime/**

    - name: Validate tunic control metrics (diagnostic)
      if: always()
      shell: bash
      run: python3 tools/ci/validate_realtime_benchmark.py artifacts/freecad-realtime/control/metrics.json

    - name: Validate outfit metrics (diagnostic)
      if: always()
      shell: bash
      run: python3 tools/ci/validate_realtime_benchmark.py artifacts/freecad-realtime/outfit/metrics.json
