name: PBD validation image
description: Build or reuse the immutable PositionBasedDynamics validation image.
inputs:
  image:
    description: Full immutable image tag.
    required: true
outputs:
  cache-hit:
    description: Whether the image already existed.
    value: ${{ steps.cache.outputs.hit }}
runs:
  using: composite
  steps:
    - name: Checkout requested revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Login to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
    - name: Check image cache
      id: cache
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      if: steps.cache.outputs.hit != 'true'
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      if: steps.cache.outputs.hit != 'true'
      with:
        context: .
        file: docker/freecad-ci/Dockerfile
        push: true
        pull: true
        tags: ${{ inputs.image }}
        cache-from: type=gha,scope=freecad-cloth-pbd-validation
        cache-to: type=gha,mode=max,scope=freecad-cloth-pbd-validation,ignore-error=true
