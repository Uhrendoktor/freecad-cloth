name: FreeCAD test
description: Run one FreeCAD acceptance or screenshot command using the repository CI timeout setting.
inputs:
  image:
    description: Immutable FreeCAD container image.
    required: true
  test-script:
    description: Repository-relative Python script passed to FreeCAD.
    required: true
  checkout:
    description: Checkout the canonical PR head or workflow SHA before running. Disable for subsequent tests in the same job.
    required: false
    default: "true"
  pre-command:
    description: Optional repository command to run after checkout and before FreeCAD.
    required: false
    default: ""
  stage-workbench:
    description: Stage workbench files for FreeCAD module discovery.
    required: false
    default: "false"
  clean-user:
    description: Reset FreeCAD user state before launch.
    required: false
    default: "false"
  log-file:
    description: Repository-relative log file for captured FreeCAD output.
    required: false
    default: "artifacts/freecad-run.log"
  test-args:
    description: Optional arguments passed after the test script.
    required: false
    default: ""
  environment:
    description: Optional newline-delimited KEY=VALUE environment entries.
    required: false
    default: ""
  validate-command:
    description: Optional repository command run after the FreeCAD test.
    required: false
    default: ""
  artifact-name:
    description: Optional artifact name to upload after validation.
    required: false
    default: ""
  artifact-path:
    description: Optional artifact path to upload.
    required: false
    default: "artifacts"
  observation-root:
    description: Evidence directory relative to the workspace; selected files are indexed relative to this directory.
    required: false
    default: "artifacts"
  observation-label:
    description: Short scenario or hypothesis label for the observation manifest.
    required: false
    default: ""
  observation-files:
    description: Optional newline-delimited role=relative/path entries; only existing, allowlisted files are indexed, never copied.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout requested revision
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Run preflight
      if: inputs.pre-command != ''
      shell: bash
      env:
        PRE_COMMAND: ${{ inputs.pre-command }}
      run: timeout --signal=TERM --kill-after=5s 60s bash -lc "$PRE_COMMAND"

    - name: Run bounded FreeCAD test
      uses: Uhrendoktor/freecad-cloth/.github/actions/freecad-container@cebf4f9aabb0733dcce8e3bd57c80403b3910d98
      with:
        image: ${{ inputs.image }}
        environment: |
          ${{ inputs.environment }}
          CLOTH_CI_STAGE_WORKBENCH=${{ inputs.stage-workbench }}
          CLOTH_CI_CLEAN_USER=${{ inputs.clean-user }}
        command: >-
          python3 /workspace/tools/ci/run_freecad.py
          --log-file /workspace/${{ inputs.log-file }}
          --test-script /workspace/${{ inputs.test-script }}
          --test-args "${{ inputs.test-args }}"

    - name: Validate test evidence
      if: inputs.validate-command != ''
      shell: bash
      env:
        VALIDATE_COMMAND: ${{ inputs.validate-command }}
      # Keep the caller's command as one argument so nested shell quoting survives.
      run: bash -lc "$VALIDATE_COMMAND"

    - name: Create optional agent observation manifest
      id: agent-observation
      if: ${{ always() && inputs.observation-files != '' }}
      shell: bash
      env:
        OBSERVATION_ROOT: ${{ inputs.observation-root }}
        OBSERVATION_LABEL: ${{ inputs.observation-label }}
        OBSERVATION_FILES: ${{ inputs.observation-files }}
        OBSERVATION_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        OBSERVATION_TEST_SCRIPT: ${{ inputs.test-script }}
        OBSERVATION_IMAGE: ${{ inputs.image }}
      run: python3 tools/ci/create_agent_observation_bundle.py

    - name: Upload test evidence
      if: always() && inputs.artifact-name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.artifact-path }}
          ${{ inputs.observation-files != '' && format('{0}/agent-observation.json', inputs.observation-root) || '' }}
        if-no-files-found: warn
        compression-level: 1
