minimum_pre_commit_version: "4.6.2"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yaml"]

  - repo: local
    hooks:
      - id: documentation-contract
        name: Python documentation contract
        entry: python tools/check_documentation_contract.py
        language: system
        types: [python]
      - id: import-linter
        name: Python architecture contracts
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: dead-code
        name: High-confidence dead code
        entry: python tools/check_dead_code.py
        language: system
        types: [python]
      - id: ci-structure
        name: Canonical CI structure
        entry: python tools/ci/validate_ci_structure.py
        language: system
        files: ^(?:\.github/(actions|workflows)/|tools/ci/)
