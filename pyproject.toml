[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-cloth"
version = "0.1.0.dev0"
description = "FreeCAD workbenches for parametric sewing patterns and 3D cloth simulation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LGPL-2.1-or-later"}
dependencies = [
  "pydantic>=2.11,<3",
  "pillow>=11,<13",
  "networkx>=3,<4",
  "rtree>=1,<2",
  "trimesh>=4,<6",
  "triangle==20250106",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "shapely>=2,<3",
  "anny>=0.6,<0.7",
  "clad-body[anny]>=0.6.1,<0.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
simulation = [
  "numpy>=2,<3",
  "pyPBD==2.2.2",
]
dev = [
  "import-linter==2.15",
  "pre-commit==4.6.2",
  "pyright==1.1.414",
  "pytest>=9,<10",
  "ruff==0.16.10",
  "hypothesis==6.168.3",
  "vulture==2.16",
  "crosshair-tool==0.0.111",
  "ast-grep-cli==0.45.3",
  "ty==0.0.85",
]

[tool.freecad_cloth.ci]
freecad_application_timeout_seconds = 120

[tool.setuptools.packages.find]
include = ["freecad_cloth*"]

[tool.setuptools.package-data]
freecad_cloth = ["resources/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = true
force-exclude = false

[tool.ruff.lint]
# Enable all Ruff rules and preview diagnostics. Only rules that Ruff documents as
# incompatible with its own formatter are omitted; no legacy-debt baseline exists.
select = ["ALL"]
preview = true
ignore = [
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "incorrect-blank-line-before-class",
  "docstring-tab-indentation",
  "triple-single-quotes",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "avoidable-escaped-quote",
  "unnecessary-escaped-quote",
  "tab-indentation",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)Copyright\\s+\\(C\\)\\s+\\d{4}"

[tool.ruff.format]
docstring-code-format = true
