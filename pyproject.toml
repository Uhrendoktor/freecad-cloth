[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-cloth"
version = "0.1.0.dev0"
description = "FreeCAD workbenches for parametric sewing patterns and 3D cloth simulation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LGPL-2.1-or-later"}
dependencies = [
  "pydantic>=2.11,<3",
  "pillow>=11,<14",
  "networkx>=3,<4",
  "rtree>=1,<2",
  "trimesh>=4,<6",
  "triangle==20250106",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "shapely>=2,<3",
  "anny>=0.6,<0.7",
  "clad-body[anny]>=0.6.1,<0.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
simulation = [
  "numpy>=2,<3",
  "pyPBD==2.2.2",
]
dev = [
  "import-linter==2.15",
  "pre-commit==4.7.0",
  "pyright==1.1.414",
  "pytest>=9,<10",
  "ruff==0.17.2",
  "freecad-stubs==1.0.21",
  "scipy-stubs==1.18.1.1",
  "PySide2-stubs==5.15.2.1.2",
  "PySide6-stubs==6.7.3.0",
  "hypothesis==6.168.3",
  "vulture==2.16",
  "crosshair-tool==0.0.112",
  "defusedxml>=0.7.1,<1",
  "ast-grep-cli==0.45.3",
  "ty==0.0.91",
  "matplotlib>=3.9,<4",
]

[tool.freecad_cloth.ci]
freecad_application_timeout_seconds = 120

[tool.setuptools.packages.find]
include = ["freecad_cloth*"]

[tool.setuptools.package-data]
freecad_cloth = ["resources/**/*"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]

[tool.ruff]
required-version = "==0.17.2"
target-version = "py312"
line-length = 100
respect-gitignore = true
force-exclude = false

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
  # Conflicts with Ruff format or mutually exclusive pydocstyle conventions.
  "COM812",
  "COM819",
  "D203",
  "D206",
  "D213",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",

  # The project intentionally uses PascalCase module paths as stable FreeCAD APIs.
  "N999",

  # Lazy/local imports preserve runtime boundaries and avoid eager host imports/cycles.
  "PLC0415",

  # Preserve legacy printf formatting in FreeCAD console/status messages.
  "UP031",

  # Host callback methods must retain instance binding even when their body does not use self.
  "PLR6301",
]

[tool.ruff.lint.per-file-ignores]
# Test literals and test/acceptance output are intentional parts of the test oracle and CLI.
"tests/**/*.py" = ["S101", "PLR2004", "T201"]

# These CI tools have stable stdout contracts consumed by Actions and developers.
"tools/ci/check_changed_python_types.py" = ["T201"]
"tools/ci/check_explicit_any_annotations.py" = ["T201"]
"tools/ci/check_docker_workspace_transfer.py" = ["T201"]
"tools/ci/check_pydantic_models.py" = ["T201"]

# Native FreeCAD console diagnostics are intentionally visible to the user.
"freecad_cloth/avatar/AnnyAvatarBackend.py" = ["T201"]

# Executable adapters establish a checkout path before importing repository modules.
"tools/ci/check_visual_assets_and_budget.py" = ["E402"]
"tools/ci/validate_acceptance.py" = ["E402"]
"tests/test_pattern_marks.py" = ["E402"]
"tests/test_command_adapter.py" = ["E402"]
"tests/test_meshpart_adapter.py" = ["E402"]
"tests/test_sewing_repair.py" = ["E402"]
"tests/test_simulation_gui.py" = ["E402"]
"tests/freecad_meshpart_smoke.py" = ["E402"]
"tests/freecad_workbench_benchmark.py" = ["E402"]
"tests/freecad_tunic_audit_production.py" = ["E402"]
"tests/test_core.py" = ["E402"]
"tests/test_sewing_network_gui_contract.py" = ["E402"]
"tests/test_derived_geometry.py" = ["E402"]
"tests/test_sewing_gui_contract.py" = ["E402"]
"tests/freecad_pattern_workbench_smoke.py" = ["E402"]
"tests/freecad_avatar_smoke.py" = ["E402"]
"tests/test_sewing_correspondence.py" = ["E402"]
"tests/test_seam_graph.py" = ["E402"]
"tests/drape_backend_micro.py" = ["E402"]
"tests/freecad_e2e.py" = ["E402"]
"tests/test_sewing_network.py" = ["E402"]
"tests/test_sewing_show2d.py" = ["E402"]
"tests/test_pattern_ir.py" = ["E402"]
"tests/freecad_drape_debug.py" = ["E402"]
"tests/test_freecad_objects.py" = ["E402"]
"tests/freecad_surface_pen_smoke.py" = ["E402"]
"tests/freecad_avatar_acceptance.py" = ["E402"]
"tests/freecad_pbd_cube_ladder.py" = ["E402"]
"tests/freecad_pbd_ladder_bootstrap.py" = ["E402"]
"tests/freecad_pbd_avatar_ladder.py" = ["E402"]
"tests/freecad_sketcher_acceptance.py" = ["E402"]
"tests/freecad_visual_examples.py" = ["E402"]
"tests/test_sewing_network_gui.py" = ["E402"]
"tests/freecad_avatar_screenshot.py" = ["E402"]
"tests/freecad_smoke.py" = ["E402"]
"tests/freecad_sewing_smoke.py" = ["E402"]

# FreeCAD task and teardown callbacks must contain native SWIG/Qt exceptions.
"freecad_cloth/pattern/PatternCommands.py" = ["BLE001"]
"freecad_cloth/pattern/PatternTopologyRepairGui.py" = ["BLE001"]
"freecad_cloth/simulation/RealtimePreview.py" = ["BLE001"]
"freecad_cloth/simulation/SimulationQualityGui.py" = ["BLE001"]
"tests/freecad_*.py" = ["BLE001"]
"tests/support/pbd_contact_helpers.py" = ["BLE001"]
"tools/benchmark_workbenches.py" = ["BLE001"]
"tools/ci/python_validation.py" = ["BLE001"]

[tool.ruff.format]
docstring-code-format = true
