[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-cloth"
version = "0.1.0.dev0"
description = "FreeCAD workbenches for parametric sewing patterns and 3D cloth simulation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "LGPL-2.1-or-later"}
dependencies = [
  "pydantic>=2.11,<3",
  "pillow>=11,<13",
  "networkx>=3,<4",
  "rtree>=1,<2",
  "trimesh>=4,<6",
  "triangle==20250106",
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
  "shapely>=2,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
simulation = [
  "numpy>=2,<3",
  "pyPBD==2.2.2",
]
avatar = [
  "anny[warp]>=0.6,<0.7",
  "clad-body[anny]>=0.6.1,<0.7",
]
dev = [
  "import-linter==2.15",
  "pre-commit==4.6.2",
  "pyright==1.1.414",
  "pytest>=9,<10",
  "ruff==0.16.10",
  "hypothesis==6.168.3",
  "vulture==2.16",
  "crosshair-tool==0.0.111",
  "ast-grep-cli==0.45.3",
  "ty==0.0.85",
]

[tool.freecad_cloth.ci]
freecad_application_timeout_seconds = 120

[tool.setuptools.packages.find]
include = ["freecad_cloth*"]

[tool.setuptools.package-data]
freecad_cloth = ["resources/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = true
force-exclude = false

[tool.ruff.lint]
# Broad, production-oriented static checks; only formatter conflicts and
# FreeCAD-required host imports are excluded.
select = [
  "E",
  "F",
  "W",
  "I",
  "A",
  "ANN401",
  "B",
  "BLE",
  "C4",
  "DTZ",
  "FURB",
  "G",
  "LOG",
  "PERF",
  "PGH",
  "PIE",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "YTT",
]
ignore = [
  "E402",
  "E501",

  # Legacy printf interpolation remains useful in FreeCAD console/status diagnostics;
  # replacing it wholesale with f-strings is not a semantics-preserving lint autofix.
  "UP031",

  # These rules encode local style preferences, not correctness or maintainability
  # guarantees, and can obscure the intent of sequence and return contracts.
  "RUF007",
  "RUF046",
  "RUF005",
  "RET501",
  "RET503",
  "RET504",
  "SIM105",
  "C401",
  "C408",
  "C416",
  "FURB162",
  "FURB192",
  "PIE810",
  "RUF043",
  "UP017",
  "UP040",
]

[tool.ruff.lint.per-file-ignores]
# Standard unittest assertions are the native test oracle for this FreeCAD project.
"tests/**/*.py" = ["S101"]

# FreeCAD task callbacks must contain SWIG/Qt exceptions at the host boundary.
# Broad exception handling is part of teardown, diagnostic reporting, and GUI resilience.
"freecad_cloth/pattern/PatternCommands.py" = ["BLE001"]
"freecad_cloth/pattern/PatternTopologyRepairGui.py" = ["BLE001"]
"freecad_cloth/simulation/RealtimePreview.py" = ["BLE001"]
"freecad_cloth/simulation/SimulationQualityGui.py" = ["BLE001"]

# These integration/teardown runners must close the native FreeCAD process after any failure.
"tests/freecad_*.py" = ["BLE001"]
"tests/support/pbd_contact_helpers.py" = ["BLE001"]
"tools/benchmark_workbenches.py" = ["BLE001"]
"tools/ci/python_validation.py" = ["BLE001"]

[tool.ruff.format]
docstring-code-format = true
