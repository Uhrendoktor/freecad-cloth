[tool.ruff.lint.per-file-ignores]
# Test literals and test/acceptance output are intentional parts of the test oracle and CLI.
"tests/**/*.py" = ["S101", "PLR2004", "T201"]

# These tests assert public exception classes where message text is not a contract.
"tests/test_avatar_provider.py" = ["PT011"]
"tests/test_boundary_validation_expansion.py" = ["PT011"]
"tests/test_pattern_geometry.py" = ["PT011"]
"tests/test_seam_reference.py" = ["PT011"]
"tests/test_validation_models.py" = ["PT011"]

# Acceptance/CLI diagnostics deliberately use contextual built-in exception messages.
"tests/freecad_screenshot_source.py" = ["TRY003", "E402"]
"tests/freecad_simulation_quality_acceptance.py" = ["TRY003"]
"tests/test_scene_understanding_report.py" = ["TRY003"]
"tests/test_sewing_workbench.py" = ["TRY003"]
