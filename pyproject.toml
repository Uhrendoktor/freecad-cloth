# These CI tools have stable stdout contracts consumed by Actions and developers.
"tools/ci/check_explicit_any_annotations.py" = ["T201"]
"tools/ci/check_pydantic_models.py" = ["T201"]

# Native FreeCAD console diagnostics are intentionally visible to the user.
"freecad_cloth/avatar/AnnyAvatarBackend.py" = ["T201"]

# Executable adapters establish a checkout path before importing repository modules.
"tools/ci/check_visual_assets_and_budget.py" = ["E402"]
"tools/ci/validate_acceptance.py" = ["E402"]
"tests/test_pattern_marks.py" = ["E402"]
